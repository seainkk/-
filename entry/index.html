<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <!-- directory preconnect -->
  <script>
  /* directory reader bundle */
  const directoryProject = "";
  (() => {
    if(!directoryProject||!window.RegistryDirectoryReader||window.location.origin!=='https://seainkk.github.io'||
       !('credentialless' in HTMLIFrameElement.prototype)||new URL(window.location.href).searchParams.has('validate'))return;
    const key=window.location.hash.match(/^#access_key=([\w-]{43})$/)?.[1];
    if(!key)return;
    let project='numshield';
    try{if(window.localStorage.getItem('registry.activeProject')==='neosender')project='neosender';}catch{}
    const controller=new AbortController();
    const reader=window.RegistryDirectoryReader;
    const promise=reader.read(directoryProject,key,project,controller.signal).catch(()=>({state:'unavailable'}));
    const device=reader.device(directoryProject,key,project),cached=device.restore();
    window.takeEntryDirectoryRead=(activeKey,activeProject)=>{
      delete window.takeEntryDirectoryRead;
      if(activeKey===key&&activeProject===project)return {controller,promise,device,cached};
      controller.abort();return null;
    };
  })();
  </script>
  <title>Центр мультиканального аутрича</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  <style>
    :root{color-scheme:light;--bg:#fff;--ink:#08090e;--muted:#6c6e79;--soft:#f7f7f8;--line:#e9e9ee;--blue:#4753ff;--blue-hover:#3441ed;--blue-soft:#eef0ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Vela Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:100px;padding:11px 22px;background:var(--blue);color:#fff;font-weight:600;line-height:1.3;transition:background .18s ease,box-shadow .18s ease}button:hover{background:var(--blue-hover)}button:focus-visible{outline:3px solid #aab0ff;outline-offset:3px}button:disabled{cursor:default;opacity:.46}[hidden]{display:none!important}
    .entry-bar{height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 22px;border-bottom:1px solid var(--line);font-size:12px;background:var(--bg)}.entry-brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:-.45px;line-height:1.18;min-width:0}.entry-mark{display:inline-block;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 27% 22%,#a8d4ff 0,#6fa8ff 25%,#4753ff 69%,#3947f4 100%);box-shadow:inset 0 0 0 1px #4753ff12;flex:0 0 auto}.entry-wordmark b{font-weight:700;color:var(--blue)}
    .entry-card{margin:clamp(45px,13vh,140px) auto 36px;max-width:620px;padding:40px;border:1px solid #f0f0f3;border-radius:30px;background:var(--soft)}.entry-card h1{font-size:34px;line-height:1.18;margin:0 0 18px;font-weight:700;letter-spacing:-1.1px}.entry-card p{margin:0 0 24px;color:var(--muted);font-size:16px;line-height:1.6}.entry-help{font-size:13px}.entry-spinner{height:27px;width:27px;display:inline-block;border:3px solid #dfe2ff;border-top-color:var(--blue);border-radius:50%;animation:spin .85s linear infinite;margin-bottom:23px}@keyframes spin{to{transform:rotate(360deg)}}
    #entry-frame-host{height:calc(100dvh - 44px);min-height:400px}#entry-frame-host iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
    body:is([data-state=loading],[data-state=ready]) .entry-bar{display:none}body:is([data-state=loading],[data-state=ready]) #entry-frame-host{height:100dvh}
    #entry-preview{max-width:1200px;margin:32px auto;padding:0 24px}#entry-preview h1{font-size:clamp(26px,4vw,40px);letter-spacing:-1px;line-height:1.15;margin:0 0 8px}#entry-preview p{color:var(--muted);margin:0 0 20px}#entry-preview ul{padding:0;margin:0;list-style:none;display:block}#entry-preview li{padding:10px 8px;border-bottom:1px solid var(--line,#e4e4ed);overflow-wrap:anywhere}
    @media(max-width:640px){.entry-bar{padding:6px 12px;gap:8px}.entry-brand{font-size:12px;gap:6px;letter-spacing:-.35px}.entry-mark{width:14px;height:14px}.entry-card{margin:38px 16px;padding:28px 24px;border-radius:26px}.entry-card h1{font-size:29px;letter-spacing:-.8px}.entry-card p{font-size:15px;line-height:1.55}.entry-card button{padding:12px 20px;min-height:44px}.entry-spinner{margin-bottom:20px}}
    @media(max-width:359px){.entry-bar{padding-inline:10px;gap:6px}.entry-card{margin-inline:12px;padding:25px 21px}.entry-card h1{font-size:27px}}
    @media(prefers-reduced-motion:reduce){.entry-spinner{animation:none}button{transition:none}}
    #entry-validation-access{margin:12px 0}
    #entry-validation-access label{display:block;font-weight:600}
    #entry-validation-access input{display:block;box-sizing:border-box;width:100%;margin:6px 0 14px;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}
    body[data-directory-open=true] .entry-bar{display:flex}
    body[data-directory-open=true] #entry-frame-host{position:fixed;inset:0;visibility:hidden;pointer-events:none}
    #entry-directory-nav{display:flex;gap:4px;width:fit-content;max-width:calc(100% - 48px);margin:18px max(24px,calc((100% - 1152px)/2));padding:5px;border-radius:100px;background:var(--soft)}
    #entry-directory-nav{flex-wrap:wrap;border-radius:20px}
    #entry-source-fields,#entry-segment-fields{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:14px 0}
    #entry-source-fields label{display:grid;gap:4px;font-size:13px;font-weight:600}
    #entry-source-fields input:not([type=checkbox]),#entry-source-fields select{font:inherit;min-height:40px;padding:7px 12px;border:1px solid var(--line);border-radius:10px}
    #entry-source-fields label:last-of-type{display:flex;align-items:center;min-height:40px}
    #entry-segment-fields button[aria-pressed=false]{color:var(--ink);background:var(--soft)}
    .entry-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:15px 0}
    .entry-actions button{padding:9px 15px;font-size:13px}
    .entry-field{border:1px solid var(--line);border-radius:16px;margin:12px 0;padding:14px 18px}
    .entry-field h2{font-size:17px;margin:0}
    #entry-section-note{color:var(--muted)}
    #entry-directory-nav button{min-height:37px;padding:9px 14px;background:transparent;color:var(--ink);font-size:12px}
    #entry-directory-nav [aria-pressed=true]{background:var(--blue);color:#fff}
    #entry-preview-list button{border:0;background:transparent;padding:2px 0;text-align:left;color:var(--ink);font-weight:600}
    #entry-preview-list [data-directory-kind=segments]{font-size:18px;line-height:1.25;letter-spacing:-.3px}
    #entry-preview-list small{color:var(--muted)}
    #entry-preview-list button:hover{text-decoration:underline;color:var(--blue)}
  </style>
</head>
<body data-state="locked">
  <header class="entry-bar"><div class="entry-brand"><span class="entry-mark" aria-hidden="true"></span><span class="entry-wordmark">Центр <b>мультиканального аутрича</b></span></div></header>
  <nav id="entry-directory-nav" aria-label="Разделы сервиса" hidden>
    <button id="entry-view-sources" type="button" aria-pressed="true">Общий каталог</button>
    <button id="entry-view-segments" type="button" aria-pressed="false">Сегменты</button>
    <button id="entry-view-analytics" type="button" aria-pressed="false">Аналитика</button>
    <button id="entry-view-infrastructure" type="button" aria-pressed="false">Инфраструктура</button>
    <button id="entry-view-retarget" type="button" aria-pressed="false">Ретаргетинг</button>
    <button id="entry-view-settings" type="button" aria-pressed="false">Настройки</button>
  </nav>
  <main id="entry-card" class="entry-card" aria-labelledby="entry-title">
    <span id="entry-spinner" class="entry-spinner" aria-hidden="true" hidden></span>
    <h1 id="entry-title">Для входа нужна закрытая ссылка</h1>
    <p id="entry-message">Откройте полную ссылку, которую вам передал владелец сервиса.</p>
    <button id="entry-retry" type="button" hidden>Повторить подключение</button>
    <form id="entry-validation-access" hidden>
      <label for="entry-private-link">Закрытая ссылка на сервис</label>
      <input id="entry-private-link" type="password" autocomplete="off" required>
      <button type="submit">Открыть выбранное действие</button>
    </form>
    <noscript><p>Для работы сервиса включите JavaScript в браузере.</p></noscript>
  </main>
  <section id="entry-preview" aria-labelledby="entry-preview-title" hidden>
    <h1 id="entry-preview-title">Общий каталог</h1>
    <div id="entry-source-fields" hidden>
      <button id="entry-import-source" type="button">＋ Загрузить базу</button>
      <label>Поиск по названию<input id="entry-search" type="search" placeholder="Название базы" autocomplete="off"></label>
      <label>Проект базы<select id="entry-project"><option value="">Все проекты</option><option value="numshield">Намшилд</option><option value="neosender">Нео Сендер</option><option value="none">Без отметки проекта</option></select></label>
      <label>Тип базы<select id="entry-contents"><option value="">Все типы</option><option value="companies">Компании</option><option value="lpr">ЛПР</option></select></label>
      <label><input id="entry-unassigned" type="checkbox">Без сегмента в этом проекте</label>
    </div>
    <div id="entry-segment-fields" hidden>
      <button id="entry-category-partners" type="button" aria-pressed="false">Партнерка</button>
      <button id="entry-category-clients" type="button" aria-pressed="true">Клиенты</button>
      <button id="entry-import-segment" type="button">Добавить контакты</button>
      <button type="button" disabled>Добавить сегмент</button>
    </div>
    <div id="entry-analytics-fields" hidden>
      <div class="entry-actions"><button type="button" disabled>Настройки Coldy</button><button type="button" disabled>↻ Обновить данные</button></div>
      <div class="entry-field"><h2>Прогноз отправок</h2></div>
    </div>
    <div id="entry-infrastructure-fields" hidden>
      <div class="entry-actions"><button type="button" disabled>Обновить из Coldy</button><button type="button" disabled>Выбрать почты</button><button type="button" disabled>Настройки Coldy</button></div>
    </div>
    <div id="entry-settings-fields" hidden>
      <button id="entry-settings-close" type="button">Закрыть</button>
      <div class="entry-field"><h2>Coldy</h2></div><div class="entry-field"><h2>Promouser</h2></div><div class="entry-field"><h2>Доступ к сервису</h2></div>
    </div>
    <p id="entry-section-note" hidden></p>
    <p id="entry-preview-time"></p>
    <ul id="entry-preview-list"></ul>
  </section>
  <div id="entry-frame-host" hidden></div>
  <script>
  (() => {
    'use strict';
    const APP_ORIGIN='https://seainkk.github.io';
    const $=(id)=>document.getElementById(id);
    const params=new URL(window.location.href).searchParams;
    const target=params.get('validate'),action=params.get('action'),project=params.get('project');
    const actionTitles={email:'Проверить новые email',mailing:'Загрузить готовые email в рассылку',telegram:'Проверить новые телефоны',
      telegramReady:'Выгрузить готовые контакты',telegramAddressBook:'Выгрузить телефоны для записной книжки'};
    const validRoute=(action===null||Object.hasOwn(actionTitles,action))&&(project===null||['numshield','neosender'].includes(project));
    const validationFile=validRoute&&target&&/^[A-Za-z0-9_-]{10,200}$/.test(target)?target:null;
    let validationOpened=false;
    let accessKey=null,currentFrame=null,loadingTimer=null,ready=false;
    let appWindow=null,appOrigin='',shellLoaded=false,canBack=false,backArmed=false,releasingBack=false;
    const catalogSlot='outreach.catalog.v1',catalogLifetime=86400000;
    let savedCatalog=null,deviceKey=null,catalogWrite=0,catalogReceived=false;
    let directory=null,shown=null;
    const sectionNames={sources:'Общий каталог',segments:'Сегменты',analytics:'Аналитика',infrastructure:'Инфраструктура',retarget:'Ретаргетинг',settings:'Настройки'};
    const normalize=value=>(value||'').normalize('NFKC').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').trim();
    function filters(){
      return {query:$('entry-search').value||'',project:$('entry-project').value||'',contents:$('entry-contents').value||'',onlyUnassigned:$('entry-unassigned').checked===true};
    }
    function clearFields(){
      for(const id of ['entry-search','entry-project','entry-contents'])$(id).value='';
      $('entry-unassigned').checked=false;
    }

    function handoff(){
      if(directory)directory.front=false;
      document.body.dataset.directoryOpen='false';$('entry-directory-nav').hidden=true;
      shown=null;$('entry-preview').hidden=true;$('entry-preview-list').replaceChildren();
    }
    function releaseView(s){
      if(!s.front||s.epoch===null||s.explicit&&!s.viewAck)return;
      if(shown?.kind==='device'){if(s.deviceAck===shown.at)handoff();return;}
      if(shown&&s.accepted[shown.kind]!==shown.at)return;
      handoff();
    }
    function sendFast(s,type,fields){
      if(directory!==s||s.epoch===null)return;
      s.frame.contentWindow.postMessage({type:'bases-registry-fast-'+type,epoch:s.epoch,projectId:s.project,...fields},APP_ORIGIN);
    }
    function forward(s){
      if(directory!==s||s.epoch===null)return;
      if(s.explicit&&s.sentView!==s.viewSerial){
        s.sentView=s.viewSerial;const fields={kind:s.kind,serial:s.viewSerial};
        if(s.kind==='sources'){fields.filters=filters();if(document.activeElement===$('entry-search'))fields.focus='search';}
        if(s.kind==='segments')fields.category=s.category;
        if(s.kind==='settings'&&s.settingsReturn)fields.returnView=s.settingsReturn;
        if(s.action)fields.action=s.action;
        sendFast(s,'view',fields);
      }
      for(const doc of Object.values(s.docs)){
        if(doc.expiresAt<=Date.now()||s.sent[doc.kind]===doc.checkedAt)continue;
        sendFast(s,'directory',{kind:doc.kind,items:doc.items,checkedAt:doc.checkedAt,expiresAt:doc.expiresAt,complete:doc.complete});s.sent[doc.kind]=doc.checkedAt;
      }
      if(s.choice&&s.sent[s.kind]&&s.choice.serial!==s.sentChoice){
        sendFast(s,'open',s.choice);s.sentChoice=s.choice.serial;
      }
      releaseView(s);
    }
    function renderDirectory(s){
      if(!s.front||directory!==s)return;
      document.body.dataset.directoryOpen='true';$('entry-directory-nav').hidden=false;
      for(const kind of Object.keys(sectionNames))$('entry-view-'+kind).setAttribute('aria-pressed',String(s.kind===kind));
      const doc=s.docs[s.kind];
      $('entry-preview-title').textContent=s.kind==='infrastructure'?'Почты для рассылок':sectionNames[s.kind];
      for(const kind of ['analytics','infrastructure','settings'])$('entry-'+kind+'-fields').hidden=s.kind!==kind;
      $('entry-source-fields').hidden=s.kind!=='sources';$('entry-segment-fields').hidden=s.kind!=='segments';
      for(const category of ['partners','clients'])$('entry-category-'+category).setAttribute('aria-pressed',String(s.category===category));
      const f=filters(),notes={retarget:'Структура ещё обсуждается.',sources:f.project||f.contents||f.onlyUnassigned?'Уточняем результат по выбранным фильтрам.':''};
      $('entry-section-note').textContent=notes[s.kind]||'';$('entry-section-note').hidden=!notes[s.kind];
      if(!doc&&s.kind==='sources'&&savedCatalog){renderPreview(savedCatalog);return;}
      shown=doc?{kind:doc.kind,at:doc.checkedAt}:null;
      const rows=[];
      for(const item of doc?.items||[]){
        if(s.kind==='sources'&&!normalize(item.name).includes(normalize(f.query))||s.kind==='segments'&&item.category!==s.category)continue;
        const row=document.createElement('li'),button=document.createElement('button');
        button.type='button';button.textContent=item.name;button.dataset.directoryKind=s.kind;button.dataset.directoryId=item.id;
        button.addEventListener('click',()=>{
          if(directory!==s||!s.front||s.docs[s.kind]!==doc||doc.expiresAt<=Date.now())return;
          s.choice={kind:s.kind,id:item.id,serial:++s.serial};forward(s);
        });
        row.append(button);
        if(item.category){const detail=document.createElement('small');detail.textContent=item.category==='partners'?' · Партнерка':' · Клиенты';row.append(detail);}
        rows.push(row);
      }
      $('entry-preview-list').replaceChildren(...rows);
      const stamp=doc?new Date(doc.checkedAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' МСК':'';
      $('entry-preview-time').textContent=doc?(doc.items.length?'Список на ':'Пустой список на ')+stamp:'';
      $('entry-card').hidden=true;$('entry-preview').hidden=false;
    }
    function changeDirectory(kind,options={}){
      const s=directory;if(!s?.front||s.kind===kind&&!options.changed)return;
      if(options.category)s.category=options.category;
      if(kind==='settings'&&s.kind!=='settings')s.settingsReturn=s.kind;
      s.action=options.action;s.kind=kind;s.explicit=true;s.viewAck=false;s.choice=null;s.viewSerial=++s.serial;renderDirectory(s);forward(s);
    }
    function expireDirectory(s,doc){
      if(directory!==s||s.docs[doc.kind]!==doc)return;
      s.device?.prune();
      delete s.docs[doc.kind];delete s.sent[doc.kind];delete s.accepted[doc.kind];
      if(s.choice?.kind===doc.kind)s.choice=null;
      sendFast(s,'expired',{kind:doc.kind,checkedAt:doc.checkedAt});
    }
    function presentDirectories(s,docs){
      for(const doc of Object.values(docs)){
        if(doc.expiresAt<=Date.now()||doc.checkedAt<(s.docs[doc.kind]?.checkedAt||0))continue;
        if(s.docs[doc.kind]?.checkedAt===doc.checkedAt){
          if(s.docs[doc.kind].expiresAt===doc.expiresAt&&JSON.stringify(s.docs[doc.kind].items)===JSON.stringify(doc.items))continue;
          delete s.sent[doc.kind];delete s.accepted[doc.kind];
        }
        s.docs[doc.kind]=doc;
        s.timers.push(setTimeout(()=>{
          if(directory===s&&s.docs[doc.kind]===doc){
            expireDirectory(s,doc);
            if(s.front&&s.kind===doc.kind){renderDirectory(s);releaseView(s);}
          }
        },Math.max(0,doc.expiresAt-Date.now())));
      }
      renderDirectory(s);forward(s);
    }
    function forgetDevice(){
      window.RegistryDirectoryReader?.clearDevice(directoryProject);
      catalogReceived=true;savedCatalog=null;catalogWrite++;
      try{window.localStorage.removeItem(catalogSlot);}catch{}
    }
    async function loadDirectory(s,first){
      const generation=++s.generation,active=()=>directory===s&&generation===s.generation;
      s.controller?.abort();
      const early=first&&window.takeEntryDirectoryRead?.(accessKey,s.project),reader=window.RegistryDirectoryReader;
      const controller=s.controller=early?.controller||new AbortController();
      const pending=early?.promise||reader.read(directoryProject,accessKey,s.project,controller.signal).catch(()=>({state:'unavailable'}));
      const device=s.device=early?.device||reader.device(directoryProject,accessKey,s.project);
      let settled=false;
      void (early?.cached||device.restore()).then(docs=>{
        if(active()&&!settled&&Object.keys(docs).length)presentDirectories(s,docs);
      });
      const result=await pending;
      if(!active()||result.state==='unavailable')return;
      settled=true;
      if(result.state==='denied'){
        forgetDevice();
        for(const doc of Object.values(s.docs))expireDirectory(s,doc);
        renderDirectory(s);forward(s);return;
      }
      if(result.state!=='ready')return;
      for(const doc of Object.values(s.docs))if(!result.docs[doc.kind])expireDirectory(s,doc);
      presentDirectories(s,result.docs);
      void device.remember(s.docs,active);
    }
    function openDirectory(frame){
      if(!directoryProject||!window.RegistryDirectoryReader||validationFile)return;
      let projectId='numshield';
      try{if(window.localStorage.getItem('registry.activeProject')==='neosender')projectId='neosender';}catch{}
      const s=directory={frame,project:projectId,epoch:null,front:true,kind:'sources',category:'clients',docs:{},accepted:{},sent:{},timers:[],generation:0,serial:0};
      clearFields();renderDirectory(s);void loadDirectory(s,true);
    }
    function directoryMessage(msg){
      const s=directory;if(!s)return;
      if(msg.type==='bases-registry-directory-scope'){
        if(!Number.isSafeInteger(msg.epoch)||msg.epoch<0||!['numshield','neosender'].includes(msg.projectId))return;
        if(s.epoch!==null&&(msg.epoch<s.epoch||msg.epoch===s.epoch&&msg.projectId!==s.project))return;
        if(msg.epoch===s.epoch)return;
        const changed=s.project!==msg.projectId||s.epoch!==null;
        if(changed){s.choice=null;s.explicit=false;s.viewAck=false;handoff();}
        s.epoch=msg.epoch;s.project=msg.projectId;s.accepted={};s.sent={};
        if(changed){
          s.docs={};s.timers.forEach(clearTimeout);s.timers=[];
          void loadDirectory(s,false);
        }
        forward(s);return;
      }
      if(msg.epoch!==s.epoch||msg.projectId!==s.project||!(msg.type==='bases-registry-fast-viewed'?Object.hasOwn(sectionNames,msg.kind):['sources','segments'].includes(msg.kind)))return;
      if(msg.type==='bases-registry-fast-viewed'&&msg.serial===s.sentView&&msg.kind===s.kind){
        s.viewAck=true;if(msg.visible===false){handoff();return;}
      }else if(msg.type==='bases-registry-fast-presented'&&msg.checkedAt===s.sent[msg.kind]){
        s.accepted[msg.kind]=msg.checkedAt;
      }else if(['bases-registry-fast-opened','bases-registry-fast-open-rejected'].includes(msg.type)&&s.choice?.serial===msg.serial&&s.choice.kind===msg.kind&&s.choice.id===msg.id){
        s.choice=null;handoff();return;
      }
      releaseView(s);
    }

    function catalogData(data){
      if(!data||!Array.isArray(data.items)||data.items.length>200||!Number.isSafeInteger(data.checkedAt))return null;
      const age=Date.now()-data.checkedAt;if(age < -60000||age>=catalogLifetime)return null;
      const items=[];
      for(const row of data.items){
        if(!row||typeof row.name!=='string'||!row.name.trim()||row.name.length>200||!Array.isArray(row.contents)||row.contents.length>2||row.contents.some(type=>type!=='companies'&&type!=='lpr'))return null;
        const item={name:row.name,contents:row.contents.slice()};
        if(row.distribution==='assigned'||row.distribution==='unassigned')item.distribution=row.distribution;
        items.push(item);
      }
      return {items,checkedAt:data.checkedAt};
    }
    function bytes64(bytes){return btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));}
    function un64(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
    async function catalogKey(key){
      const seed=new TextEncoder().encode('outreach/catalog/device/v1/'+key);
      const raw=await window.crypto.subtle.digest('SHA-256',seed);
      return window.crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
    }
    function clearPreview(){
      savedCatalog=null;shown=null;$('entry-preview').hidden=true;$('entry-preview-list').replaceChildren();$('entry-preview-time').textContent='';
    }
    function renderPreview(data){
      shown={kind:'device',at:data.checkedAt};
      $('entry-preview-title').textContent='Общий каталог';
      const query=directory?.front?normalize(filters().query):'';
      const rows=data.items.filter(item=>normalize(item.name).includes(query)).map(item=>{const row=document.createElement('li');row.textContent=item.name;return row;});
      $('entry-preview-list').replaceChildren(...rows);
      const date=new Date(data.checkedAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'});
      $('entry-preview-time').textContent=(rows.length?'Список':'Пустой список')+' на '+date+' МСК. Проверяем доступ и обновляем базы.';
      $('entry-card').hidden=true;$('entry-preview').hidden=false;
    }
    function sendSavedCatalog(){
      if(ready&&appWindow&&savedCatalog)appWindow.postMessage({type:'bases-registry-saved-catalog',...savedCatalog},appOrigin);
    }
    async function restoreCatalog(frame,key){
      try{
        deviceKey=catalogKey(key);
        const cipherKey=await deviceKey,stored=window.localStorage.getItem(catalogSlot);
        if(!stored||stored.length>400000||currentFrame!==frame||catalogReceived)return;
        const value=JSON.parse(stored),plain=await window.crypto.subtle.decrypt({name:'AES-GCM',iv:un64(value.iv)},cipherKey,un64(value.box));
        if(currentFrame!==frame||catalogReceived)return;
        savedCatalog=catalogData(JSON.parse(new TextDecoder().decode(plain)));
        if(!savedCatalog||directory?.docs.sources)return;
        if(ready)sendSavedCatalog();
        else if(shellLoaded)frame.contentWindow.postMessage({type:'bases-registry-startup-catalog',...savedCatalog},APP_ORIGIN);
        else if(document.body.dataset.state==='loading'&&(!directory||directory.front&&directory.kind==='sources'&&!directory.docs.sources))renderPreview(savedCatalog);
      }catch(ignored){/* Storage is optional, including in private browsing. */}
    }
    async function rememberCatalog(input){
      const frame=currentFrame,serial=++catalogWrite;catalogReceived=true;
      const data=catalogData(input);
      if(!data){if(shown?.kind==='device')clearPreview();else savedCatalog=null;try{window.localStorage.removeItem(catalogSlot);}catch(ignored){}return;}
      savedCatalog=data;
      try{
        const key=await deviceKey,iv=window.crypto.getRandomValues(new Uint8Array(12));
        const plain=new TextEncoder().encode(JSON.stringify(data));
        const box=await window.crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);
        if(currentFrame===frame&&ready&&serial===catalogWrite)
          window.localStorage.setItem(catalogSlot,JSON.stringify({iv:bytes64(iv),box:bytes64(new Uint8Array(box))}));
      }catch(ignored){/* The live application works without a device copy. */}
    }

    function keyFromHash(value){const match=typeof value==='string'?value.match(/^#access_key=([A-Za-z0-9_-]{43})$/):null;return match?match[1]:null;}
    function frameSource(source){return !!currentFrame&&!!source&&source===currentFrame.contentWindow;}
    function isBackEntry(){return window.history.state?.basesRegistryBack===true;}
    function syncBackEntry(){
      if(!window.history||releasingBack)return;
      if(canBack&&(ready||shellLoaded)){
        if(isBackEntry()){backArmed=true;return;}
        if(navigator.userActivation?.hasBeenActive===false)return;
        try{
          // Omitting the URL keeps the address intact. The state contains no credential.
          window.history.pushState({basesRegistryBack:true},'');backArmed=true;
        }catch(error){backArmed=false;}
      }else if(backArmed&&isBackEntry()){
        backArmed=false;releasingBack=true;
        try{window.history.back();}catch(error){releasingBack=false;}
      }
    }
    function popEntry(){
      if(!window.history)return;
      const wasArmed=backArmed;backArmed=false;
      if(accessKey!==keyFromHash(window.location.hash)){releasingBack=false;return;}
      if(releasingBack){releasingBack=false;syncBackEntry();return;}
      if(isBackEntry()){backArmed=(ready||shellLoaded)&&canBack;return;} // Forward to a previous same-page entry.
      if(!wasArmed||!ready&&!shellLoaded||!canBack||!frameSource(appWindow))return;
      // The child reports its new state even if a dirty form kept the same view.
      canBack=false;
      try{appWindow.postMessage({type:'bases-registry-back'},appOrigin);}catch(error){/* A detached frame cannot accept a back action. */}
    }
    function clearFrame(releaseBack=false){
      validationOpened=false;
      if(directory){directory.controller?.abort();directory.timers.forEach(clearTimeout);directory=null;}
      handoff();
      catalogWrite++;deviceKey=null;catalogReceived=false;clearPreview();
      canBack=false;appWindow=null;appOrigin='';shellLoaded=false;
      if(releaseBack)syncBackEntry();else{backArmed=false;releasingBack=false;}
      if(loadingTimer!==null){clearTimeout(loadingTimer);loadingTimer=null;}const old=currentFrame;currentFrame=null;if(old)old.remove();ready=false;$('entry-frame-host').hidden=true;
    }
    function showState(state,title,message,retry){document.body.dataset.state=state;$('entry-preview').hidden=true;$('entry-card').hidden=false;$('entry-title').textContent=title;$('entry-message').textContent=message;$('entry-spinner').hidden=state!=='loading';$('entry-retry').hidden=!retry;}
    function openEntry(){
      const key=keyFromHash(window.location.hash);
      if(accessKey&&accessKey!==key||!key&&window.location.hash.startsWith('#access_key='))forgetDevice();
      clearFrame(!!key&&key===accessKey);accessKey=key;
      $('entry-validation-access').hidden=true;
      if(!accessKey){
        if(validationFile){
          const title=actionTitles[action]||'Проверить новые контакты';
          showState('locked',title,'Для доступа к выбранной таблице вставьте обычную закрытую ссылку вашей команды.',false);
          $('entry-validation-access').hidden=false;
        }else showState('locked','Для входа нужна закрытая ссылка','Откройте полную ссылку, которую вам передал владелец сервиса.',false);
        return;
      }
      if(!('credentialless' in HTMLIFrameElement.prototype)){showState('unsupported','Откройте сервис в актуальном Chrome или Edge','Для открытия без переключения Google-аккаунтов нужен браузер, поддерживающий изолированное подключение сервиса. Скопируйте эту же ссылку в актуальный Chrome или Edge.',false);return;}
      showState('loading','Открываем сервис…','Проверяем закрытую ссылку.',false);
      const frame=document.createElement('iframe');
      frame.title='Центр мультиканального аутрича';
      frame.referrerPolicy='no-referrer';frame.allow='clipboard-write';frame.setAttribute('allowfullscreen','');
      function offline(){
        if(currentFrame!==frame)return;
        clearFrame(true);showState('error','Не удалось открыть сервис','Проверьте соединение и повторите подключение.',true);
      }
      frame.addEventListener('error',offline);
      frame.src=new URL('./app.html',window.location.href).href;currentFrame=frame;$('entry-frame-host').append(frame);
      $('entry-card').hidden=true;$('entry-frame-host').hidden=false;
      openDirectory(frame);
      if(!directory)void restoreCatalog(frame,key);
      loadingTimer=setTimeout(()=>{if(!ready)offline();},45000);
    }
    window.addEventListener('message',(event)=>{
      if(event.origin!==APP_ORIGIN||!frameSource(event.source)||!event.data||typeof event.data!=='object')return;
      if(ready&&(event.source!==appWindow||event.origin!==appOrigin))return;
      if(event.data.type==='bases-registry-directory-scope'||typeof event.data.type==='string'&&event.data.type.startsWith('bases-registry-fast-')){
        directoryMessage(event.data);return;
      }
      if(event.data.type==='bases-registry-startup-catalog-presented'){
        if(shown?.kind==='device'&&shown.at===event.data.checkedAt){
          if(directory){directory.deviceAck=shown.at;releaseView(directory);}else handoff();
        }
        return;
      }
      if(event.data.type==='bases-registry-shell'){
        if(loadingTimer!==null){clearTimeout(loadingTimer);loadingTimer=null;}
        shellLoaded=true;appWindow=event.source;appOrigin=event.origin;$('entry-card').hidden=true;
        if(savedCatalog&&!ready&&!directory?.docs.sources)event.source.postMessage({type:'bases-registry-startup-catalog',...savedCatalog},APP_ORIGIN);
        return;
      }
      if(event.data.type==='bases-registry-catalog-hint'&&Number.isSafeInteger(event.data.epoch)){
        event.source.postMessage({type:'bases-registry-catalog-hint',epoch:event.data.epoch,available:!!savedCatalog},event.origin);
        return;
      }
      if(event.data.type==='bases-registry-ready'){
        appWindow=event.source;appOrigin=event.origin;
        if(loadingTimer!==null){clearTimeout(loadingTimer);loadingTimer=null;}ready=true;document.body.dataset.state='ready';$('entry-card').hidden=true;$('entry-frame-host').hidden=false;
        if(!shown&&!directory?.front)handoff();
        if(event.data.catalogPending)sendSavedCatalog();
        else if(shown?.kind==='device'&&savedCatalog)event.source.postMessage({type:'bases-registry-startup-catalog',...savedCatalog},APP_ORIGIN);
        if(validationFile&&!validationOpened){
          const message={type:'bases-registry-open-validation',id:validationFile};
          if(action)message.workbookAction=action;
          if(project)message.projectId=project;
          validationOpened=true;appWindow.postMessage(message,appOrigin);
        }
      }else if(ready&&event.data.type==='bases-registry-catalog'){
        if(!directory)void rememberCatalog(event.data);
      }else if((ready||shellLoaded)&&event.data.type==='bases-registry-navigation'&&typeof event.data.canBack==='boolean'){
        canBack=event.data.canBack;syncBackEntry();
      }else if(event.data.type==='bases-registry-unavailable'){
        clearFrame(true);showState('error','Не удалось подключить сервис','Проверьте соединение и повторите попытку.',true);
      }else if(event.data.type==='bases-registry-locked'){
        forgetDevice();
        clearFrame(true);showState('locked','Нужна действующая закрытая ссылка','Ссылка недействительна или больше не активна. Получите полную закрытую ссылку у владельца сервиса.',false);
        $('entry-validation-access').hidden=!validationFile;
      }
    });
    $('entry-validation-access').addEventListener('submit',event=>{
      event.preventDefault();
      const field=$('entry-private-link');let key=null;
      try{const url=new URL(field.value.trim());
        if(url.origin===window.location.origin&&url.pathname===window.location.pathname&&!url.username&&!url.password)key=keyFromHash(url.hash);
      }catch(ignored){}
      field.value='';
      if(!validationFile||!key){$('entry-message').textContent='Вставьте полную закрытую ссылку на этот сервис.';return;}
      window.location.hash='access_key='+key;
    });
    for(const kind of Object.keys(sectionNames))$('entry-view-'+kind).addEventListener('click',()=>changeDirectory(kind));
    $('entry-settings-close').addEventListener('click',()=>changeDirectory(directory?.settingsReturn||'sources'));
    for(const id of ['entry-project','entry-contents','entry-unassigned'])$(id).addEventListener('change',()=>changeDirectory('sources',{changed:true}));
    $('entry-search').addEventListener('input',()=>changeDirectory('sources',{changed:true}));
    for(const category of ['partners','clients'])$('entry-category-'+category).addEventListener('click',()=>changeDirectory('segments',{changed:true,category}));
    for(const [id,kind] of [['entry-import-source','sources'],['entry-import-segment','segments']])
      $(id).addEventListener('click',()=>changeDirectory(kind,{changed:true,action:'import'}));
    window.addEventListener('storage',event=>{
      const s=directory;
      if(!s||event.newValue!==null||event.key!==null&&event.key!==s.device?.slot)return;
      s.generation++;s.controller?.abort();
      for(const doc of Object.values(s.docs))expireDirectory(s,doc);
      renderDirectory(s);forward(s);
    });
    $('entry-retry').addEventListener('click',openEntry);window.addEventListener('hashchange',openEntry);window.addEventListener('popstate',popEntry);
    window.addEventListener('pointerup',syncBackEntry);window.addEventListener('keyup',syncBackEntry);
    window.addEventListener('pagehide',()=>clearFrame());window.addEventListener('pageshow',event=>{if(event.persisted)openEntry();});
    openEntry();
  })();
  </script>
</body>
</html>
