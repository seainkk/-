name: Deploy Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID || 'AKfycbxKxdFPQt4gGQAOrgyRUBNm1yQEhEyEeXTiPPZqYz2KsVEZNyD6gXrDRj78BhgybCv0WA' }}

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Check publication setup
        id: setup
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [[ -z "$CLASPRC_JSON" || -z "$APPS_SCRIPT_DEPLOYMENT_ID" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Publication skipped. Add secret CLASPRC_JSON after the one-time setup described in DEPLOYMENT.md. The existing deployment ID is already configured.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Update existing web app
        if: steps.setup.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: npm run deploy
