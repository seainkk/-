name: Deploy registry entry

on:
  workflow_run:
    workflows: ['Deploy Apps Script']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: registry-entry-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the static application
        run: node scripts/build-pages.mjs _site
      - name: Name this build artifact
        id: name
        shell: bash
        run: echo "artifact_name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload public interface
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Initial enablement may require the repository owner's one-time
          # Settings > Pages > Source > GitHub Actions selection. GitHub's
          # automatic workflow token cannot grant itself administration rights.
          enablement: true
      - name: Explain one-time Pages setup if configuration failed
        if: ${{ failure() && steps.pages.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::error::Open https://github.com/seainkk/-/settings/pages and select Build and deployment > Source > GitHub Actions, then rerun this workflow. The repository workflow token cannot initially enable GitHub Pages by itself.'
      - name: Wait for the uploaded artifact to appear in this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" |
              jq -e --arg name "$ARTIFACT_NAME" --arg id "$ARTIFACT_ID" '
                .artifacts | length == 1 and
                (.[0] | .name == $name and (.id | tostring) == $id and .expired == false)
              ' >/dev/null; then exit 0; fi
          done
          echo "::error::The uploaded Pages artifact is not visible for this run. Re-run the failed deploy job."
          exit 1
      - name: Publish registry entry
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
