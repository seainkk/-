<script>
(() => {
  'use strict';
  const pages='https://seainkk.github.io';
  const endpoint='https://script.google.com/macros/s/AKfycbxKxdFPQt4gGQAOrgyRUBNm1yQEhEyEeXTiPPZqYz2KsVEZNyD6gXrDRj78BhgybCv0WA/exec';
  const protocol='registry-pages-rpc-v1';
  const timeoutMessage='Google не подтвердил результат. Обновите состояние. При повторе операции используйте прежний запрос.';
  let session=null;

  function bridgeOrigin(origin) {
    return origin==='https://script.google.com'||origin==='https://script.googleusercontent.com'||
      /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(origin);
  }
  function inBridge(frame,source) {
    try {
      for(let depth=0;source&&depth<8;depth++){
        if(source===frame.contentWindow)return true;
        const parent=source.parent;if(source===window||parent===source)break;
        source=parent;
      }
    }catch(ignored){}
    return false;
  }
  function close(s,message) {
    if(session!==s)return;
    session=null;clearTimeout(s.timer);s.port?.close();s.frame.remove();s.reject(new Error(message));
    for(const request of s.pending.values()){clearTimeout(request.timer);request.reject(new Error(message));}
    s.pending.clear();
  }
  function receive(s,event) {
    const m=event.data;
    if(session!==s||m?.protocol!==protocol||m.channel!==s.channel)return;
    if(m.type==='connected'){
      if(!s.connected){s.connected=true;clearTimeout(s.timer);s.resolve();}
      return;
    }
    if(!s.connected||m.type!=='result'||typeof m.ok!=='boolean')return;
    const request=s.pending.get(m.id);
    if(!request)return;
    s.pending.delete(m.id);clearTimeout(request.timer);
    if(m.ok)request.resolve(m.value);
    else request.reject(new Error(typeof m.message==='string'?m.message:'Ошибка сервера Google.'));
  }
  window.addEventListener('message',event=>{
    const s=session,m=event.data;
    if(!s||s.port||m?.protocol!==protocol||m.type!=='hello'||m.channel!==s.channel||
        !bridgeOrigin(event.origin)||!inBridge(s.frame,event.source))return;
    const pipe=new MessageChannel();
    s.port=pipe.port1;
    s.port.onmessage=reply=>receive(s,reply);
    s.port.onmessageerror=()=>close(s,timeoutMessage);
    try{event.source.postMessage({protocol,type:'connect',channel:s.channel},event.origin,[pipe.port2]);}
    catch(error){pipe.port2.close();close(s,'Не удалось подключиться к Google. Повторите вход.');}
  });
  function connect() {
    if(session)return session;
    if(location.origin!==pages||location.pathname!=='/-/app.html'||!('credentialless' in HTMLIFrameElement.prototype))
      throw new Error('Для подключения к Google откройте сервис в актуальном Chrome или Edge.');
    const frame=document.createElement('iframe');
    const channel=crypto.randomUUID(),s={channel,frame,port:null,connected:false,sequence:0,pending:new Map()};
    s.ready=new Promise((resolve,reject)=>{s.resolve=resolve;s.reject=reject;});
    session=s;
    s.timer=setTimeout(()=>close(s,'Подключение к Google заняло больше времени. Повторите запрос.'),45000);
    frame.hidden=true;frame.title='Подключение Google Apps Script';frame.credentialless=true;
    frame.setAttribute('credentialless','');frame.referrerPolicy='no-referrer';
    frame.addEventListener('error',()=>close(s,'Не удалось открыть подключение Google. Повторите запрос.'));
    frame.src=endpoint+'?bridge=1&channel='+encodeURIComponent(channel);
    document.body.append(frame);
    return s;
  }
  async function packForm(form) {
    if(!(form instanceof HTMLFormElement))throw new Error('Откройте форму загрузки файла.');
    const data=new FormData(form),file=data.get('file');
    if(data.getAll('file').length!==1||!(file instanceof File)||!file.size||file.size>10*1024*1024)throw new Error('Выберите один непустой файл размером до 10 МиБ.');
    const allowed=['name','section','routeMode','status','requestId','flow','baseType','contentsJSON'],fields={};
    for(const [name,value] of data){
      if(['file','accessKey','projectId'].includes(name))continue;
      if(!allowed.includes(name)||typeof value!=='string'||Object.hasOwn(fields,name))throw new Error('Некорректные поля загрузки.');
      fields[name]=value;
    }
    return {fields,file:{name:file.name,type:file.type,lastModified:file.lastModified,bytes:await file.arrayBuffer()}};
  }
  async function run(name,payload,projectId,accessKey) {
    if(typeof name!=='string'||!/^[a-z][a-zA-Z0-9]{1,90}$/.test(name)||
        !['numshield','neosender'].includes(projectId)||typeof accessKey!=='string'||accessKey.length!==43||!/^[\w-]{43}$/.test(accessKey))
      throw new Error('Некорректный запрос или закрытая ссылка.');
    const s=connect(),upload=name==='uploadSourceBase';
    const [,body]=await Promise.all([s.ready,upload?packForm(payload):payload]);
    if(session!==s||!s.connected)throw new Error('Подключение к Google изменилось. Повторите запрос.');
    return new Promise((resolve,reject)=>{
      const id=++s.sequence;
      const timer=setTimeout(()=>close(s,timeoutMessage),390000);
      s.pending.set(id,{resolve,reject,timer});
      try{s.port.postMessage({protocol,channel:s.channel,type:'call',id,name,payload:body,projectId,accessKey},upload?[body.file.bytes]:[]);}
      catch(error){clearTimeout(timer);s.pending.delete(id);reject(new Error('Не удалось передать запрос в Google.'));}
    });
  }
  window.addEventListener('pagehide',()=>{if(session)close(session,timeoutMessage);});
  window.RegistryPagesTransport=Object.freeze({ready:async()=>connect().ready,run,
    upload:(form,projectId,accessKey)=>run('uploadSourceBase',form,projectId,accessKey)});
  // Establish only the anonymous bridge while the static controls and their code download.
  try {
    const entry=window.parent.location;
    if(window.parent!==window && entry.origin===pages && ['/-/','/-/index.html'].includes(entry.pathname) &&
       /^#access_key=[\w-]{43}$/.test(entry.hash)) connect().ready.catch(()=>{});
  } catch(ignored) {}
})();
</script>
