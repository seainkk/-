    for(const id of ['br-import-mode-file','br-import-mode-link','br-import-cancel'])$(id).disabled=importing;
    for(const form of [$('br-import-file-form'),$('br-import-link-form')]){form.setAttribute('aria-busy',String(importing));for(const field of form.elements)field.disabled=importing;}
    for(const id of ['br-upload-submit','br-link-submit'])$(id).disabled=requesting()||!!segmentEditor||sourceData?.state!=='ready'||sourceData?.canEdit!==true;
    $('br-import-reread').disabled=importing||sourceLoading||!!sourceSaving||busy;
  }
  function showImportMessage(text,error,recoveryId,reread){const node=$('br-import-message');node.hidden=!text;node.className='br-source-message'+(error?' br-error':'');node.setAttribute('role',error?'alert':'status');node.replaceChildren();if(text)node.append(document.createTextNode(text));if(recoveryId){const link=document.createElement('a');link.href=nativeUrl(recoveryId);link.target='_blank';link.rel='noopener noreferrer';link.textContent='Проверить таблицу';node.append(link);}$('br-import-reread').hidden=!reread;}
  function switchImportMode(mode){if(importing||mode===importMode)return;const old=importMode==='file'?'upload':'link',next=mode==='file'?'upload':'link';for(const name of ['name','status'])$('br-'+next+'-'+name).value=$('br-'+old+'-'+name).value;setImportContents(next,readImportContents(old));importMode=mode;updateImportView();$('br-'+next+'-name').focus();}
  async function submitSourceImport(kind,form){
    if(requesting()||segmentEditor||sourceData?.state!=='ready'||sourceData?.canEdit!==true)return;
    const prefix=kind==='file'?'upload':'link',fields={name:$('br-'+prefix+'-name').value.trim(),contents:readImportContents(prefix),status:$('br-'+prefix+'-status').value};
    if(!fields.name||fields.name.length>100){showImportMessage('Введите название базы от 1 до 100 символов.',true);return;}
    if(!fields.contents.length){showImportMessage('Выберите наполнение: Компании, ЛПР или оба варианта.',true);return;}
    const file=kind==='file'?$('br-upload-file').files[0]:null;
    if(kind==='file'){const invalid=importFileError(file);if(invalid){showImportMessage(invalid,true);return;}}
    else{fields.url=$('br-link-url').value.trim();fields.mode=$('br-import-link-form').querySelector('input[name="br-link-transfer"]:checked')?.value||'copy';if(!importLinkId(fields.url)){showImportMessage('Укажите ссылку на исходную Google Таблицу в docs.google.com.',true);return;}}
    const fingerprint=importFingerprint(kind,fields,file,importFileSelection);let requestId=importRequests.get(fingerprint);if(!requestId){requestId=globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);importRequests.set(fingerprint,requestId);}
    showImportMessage('Добавляем базу…',false);$('br-upload-request').value=requestId;$('br-upload-contents').value=JSON.stringify(fields.contents);
    // Dispatch the live form before disabling its named fields: Google serializes it into a Blob payload here.
    const pending=kind==='file'?rpc('uploadSourceBase',form):rpc('importSourceBaseLink',Object.assign({},fields,{requestId}));
    importing=true;updateControls();renderSourcesHealth();
    try{
      const result=await pending,item=result.item,fileId=result.file?.id||item.id;
      if(sourceData&&item){const index=sourceData.items.findIndex((entry)=>entry.id===item.id);if(index>=0)sourceData.items[index]=item;else sourceData.items.push(item);}
      importOpen=false;importing=false;importRequests.clear();$('br-import-file-form').reset();$('br-import-link-form').reset();showImportMessage(null,false);updateImportView();if(activeView==='sources')renderSources();
      await refreshSourceBases({preserveNotice:true});
      const success=result.recovered?'Результат предыдущей операции найден. База доступна в «Исходных базах».':result.mode==='move'?'Таблица перенесена в «Исходные базы».':result.mode==='copy'?'Копия Google Таблицы создана в «Исходных базах».':'База загружена как новая Google Таблица в «Исходные базы».';
      notice(success+(sourceRefreshError?' Обновить список не удалось: '+sourceRefreshError:''),sourceRefreshError?'error':'info',{id:fileId,label:'Открыть таблицу'});
    }catch(error){const parsed=failure(error),recoveryId=importRecoveryId(parsed.message);let text=parsed.code==='CREATION_UNCERTAIN'?'Результат операции не подтверждён. Проверьте таблицу и перечитайте список перед повторной отправкой. '+parsed.message:parsed.message;if(parsed.code==='DRIVE_SETUP_REQUIRED')text+=' Администратору нужно включить сервис Drive v3 в Apps Script, а для стандартного Cloud-проекта — Google Drive API.';showImportMessage(text,true,recoveryId,true);}
    finally{importing=false;updateControls();renderSourcesHealth();flushPendingView();}
  }
  function teamRoleLabel(role){return role==='admin'?'Администратор':role==='member'?'Сотрудник':'Роль не определена';}
  function teamCanSubmit(){return bootstrap?.user?.isAdmin===true&&teamData?.canManage===true&&Array.isArray(teamData.members);}
  function renderTeamAccess(){
    $('br-team-open').hidden=bootstrap?.user?.isAdmin!==true;$('br-team-panel').hidden=!teamOpen;
    const main=root.querySelector('.br-main');if(main)main.inert=teamOpen;
    if(!teamOpen)return;
    const status=$('br-team-status');status.classList.toggle('br-error',!!teamError);status.textContent=teamError||teamMessage||(teamLoading?'Проверяем доступ команды…':'');
    const list=$('br-team-members');list.replaceChildren();
    for(const member of teamData?.members||[]){const row=document.createElement('li'),email=document.createElement('span'),role=document.createElement('span');email.textContent=String(member.email||'');role.textContent=teamRoleLabel(member.role);row.append(email,role);list.append(row);}
    $('br-team-members-section').hidden=!teamData;
  }
  async function refreshTeamAccess(){
    if(!teamOpen||bootstrap?.user?.isAdmin!==true||requesting())return;
    teamLoading=true;teamError=null;renderTeamAccess();updateControls();
    try{const result=await rpc('getTeamAccess');if(result?.canManage!==true||!Array.isArray(result.members))throw new Error('Не удалось подтвердить права управления доступом.');teamData=result;}
    catch(error){teamError=failure(error).message;}
    finally{teamLoading=false;renderTeamAccess();updateControls();flushPendingView();}
  }
  async function openTeamAccess(){
    if(bootstrap?.user?.isAdmin!==true||requesting()||formIsOpen())return;
    teamOpen=true;teamData=null;teamError=null;teamMessage=null;formMode='team';renderTeamAccess();await refreshTeamAccess();if(teamOpen)$('br-team-email').focus();
  }
  async function submitTeamMember(){
    if(!teamOpen||requesting()||!teamCanSubmit())return;
    const email=$('br-team-email').value.trim(),role=$('br-team-role').value;if(!email){teamError='Укажите email Google-аккаунта.';renderTeamAccess();return;}
    teamSaving=true;teamError=null;teamMessage=null;renderTeamAccess();updateControls();
    try{const result=await rpc('addTeamMember',{email,role});const current=teamData.members.find((item)=>item.email===result.email);if(current)current.role=result.role;else teamData.members.push({email:result.email,role:result.role});teamData.members.sort((a,b)=>a.email.localeCompare(b.email));teamMessage=(result.alreadyAllowed?'Доступ проверен и обновлён: ':'Доступ добавлен: ')+result.email+' · '+teamRoleLabel(result.role)+'.';}
    catch(error){teamError=failure(error).message;}
    finally{teamSaving=false;renderTeamAccess();updateControls();flushPendingView();}
  }
  function render(){
    $('br-sources-view').hidden=activeView!=='sources';$('br-segments-view').hidden=activeView!=='segments';$('br-mailings-view').hidden=activeView!=='mailings';$('br-retarget-view').hidden=activeView!=='retarget';
    for(const view of ['sources','segments','retarget'])$('br-view-'+view).setAttribute('aria-pressed',String(activeView===view||view==='segments'&&activeView==='mailings'));
    root.dataset.view=activeView;renderSources();renderSegments();renderMailings();renderTeamAccess();updateControls();
  }
  function updateControls(){
    const waiting=requesting();$('br-refresh').disabled=waiting||teamOpen;
    $('br-team-open').hidden=bootstrap?.user?.isAdmin!==true;$('br-team-open').disabled=waiting||formIsOpen();$('br-team-open').title=formIsOpen()&&!teamOpen?'Сначала сохраните или отмените текущие изменения.':'';
    for(const view of ['sources','segments','retarget'])$('br-view-'+view).disabled=teamOpen;
    $('br-team-close').disabled=teamSaving;$('br-team-refresh').disabled=waiting;$('br-team-email').disabled=waiting;$('br-team-role').disabled=waiting;$('br-team-submit').disabled=waiting||!teamCanSubmit();$('br-team-submit').textContent=teamSaving?'Добавляем…':'Добавить доступ';$('br-refresh').hidden=activeView==='retarget';
    for(const row of root.querySelectorAll('.br-source-item')){const item=sourceItem(row.dataset.sourceId),draft=sourceDrafts.get(item?.id),badContents=draft&&Object.prototype.hasOwnProperty.call(draft.values,'contents')&&!normalizeContents(draft.values.contents).length;for(const field of row.querySelectorAll('.br-source-fields select,.br-source-fields input'))field.disabled=!sourceCanEdit(sourceData,item)||waiting||!!segmentEditor;for(const action of row.querySelectorAll('.br-source-actions button'))action.disabled=action.dataset.sourceCancel?!!sourceSaving||importing||segmentSaving:!sourceCanEdit(sourceData,item)||waiting||!!segmentEditor||badContents;const add=row.querySelector('[data-add-source]');if(add){add.disabled=!readySource(item)||sourceDrafts.has(item.id)||waiting||importOpen||!!segmentEditor;add.title=importOpen?'Сначала закройте форму загрузки.':segmentEditor?'Сначала завершите работу с сегментом.':'';}}
    $('br-import-open').disabled=importOpen||waiting||!!segmentEditor||sourceData?.state!=='ready'||sourceData?.canEdit!==true;updateImportView();
    $('br-add-segment').disabled=waiting||importOpen||!!segmentEditor||dashboard&&dashboard.state!=='ready';
    for(const edit of root.querySelectorAll('[data-edit-segment]'))edit.disabled=waiting||importOpen||!!segmentEditor;
    $('br-segment-close').disabled=segmentSaving;$('br-segment-name').disabled=segmentSaving||segmentRecoveryLocked();$('br-segment-target').disabled=waiting||segmentRecoveryLocked();$('br-segment-refresh-sources').disabled=waiting||segmentRecoveryLocked();$('br-segment-submit').disabled=waiting||!!segmentEditor?.loadingLists;$('br-segment-submit').textContent=segmentSaving?'Сохраняем…':segmentRecoveryLocked()?'Повторить запрос':segmentEditor?.id?'Сохранить изменения':'Создать сегмент';$('br-segment-reread').disabled=waiting;
    for(const control of root.querySelectorAll('#br-segment-source-options input,#br-segment-source-options select,#br-segment-source-options button')){if(waiting||segmentRecoveryLocked())control.disabled=true;}
  }
  function clearViewTimer(){if(viewTimer!==null){clearInterval(viewTimer);viewTimer=null;}}
  function armViewTimer(){clearViewTimer();if(!document.hidden&&['sources','segments','mailings'].includes(activeView))viewTimer=setInterval(()=>refreshActiveView({automatic:true}),60000);}
  async function refreshActiveView(options={}){
    if(requesting()){if(options.opening)pendingView=activeView;return;}
    if(options.automatic&&(document.hidden||formIsOpen()))return;
    if(activeView==='sources')return refreshSourceBases(Object.assign({},options,{preserveNotice:!options.manual}));
    if(activeView==='segments')return refreshSegments(options);
    if(activeView==='mailings')return refreshMailings(options);
  }
  function flushPendingView(){if(requesting())return;if(segmentEditor)renderSegmentSources();updateControls();if(!pendingView)return;const view=pendingView;pendingView=null;if(view===activeView)refreshActiveView({opening:true,preserveNotice:true});}
  function setView(view,options={}){activeView=view;render();armViewTimer();if(!options.cached)refreshActiveView({opening:true});}
  $('br-team-open').addEventListener('click',openTeamAccess);$('br-team-refresh').addEventListener('click',refreshTeamAccess);$('br-team-form').addEventListener('submit',(event)=>{event.preventDefault();submitTeamMember();});$('br-team-close').addEventListener('click',()=>{if(teamSaving)return;teamOpen=false;formMode=null;teamError=null;teamMessage=null;renderTeamAccess();updateControls();$('br-team-open').focus();flushPendingView();});
  $('br-source-search').addEventListener('input',updateSourceFilters);$('br-source-contents-filter').addEventListener('change',updateSourceFilters);$('br-source-unassigned-filter').addEventListener('change',updateSourceFilters);$('br-source-filters-reset').addEventListener('click',resetSourceFilters);
  $('br-view-sources').addEventListener('click',()=>setView('sources'));$('br-view-segments').addEventListener('click',()=>setView('segments'));$('br-view-retarget').addEventListener('click',()=>setView('retarget'));
  $('br-refresh').addEventListener('click',()=>refreshActiveView({manual:true}));
  $('br-mailings-back').addEventListener('click',()=>{setView('segments',{cached:true});setTimeout(()=>{window.scrollTo(0,segmentBackScroll);Array.from(root.querySelectorAll('[data-segment-focus]')).find((node)=>node.dataset.segmentFocus===mailingSegmentId+'/mailings')?.focus({preventScroll:true});},0);});
  $('br-add-segment').addEventListener('click',()=>openSegmentEditor());
  $('br-segment-close').addEventListener('click',()=>{if(segmentSaving)return;segmentEditor=null;formMode=null;segmentError=null;segmentEditorEpoch++;renderSegmentEditor();updateControls();});
  $('br-segment-target').addEventListener('change',()=>{if(!segmentEditor)return;const item=segmentById($('br-segment-target').value);segmentEditor.id=item?.id||null;segmentEditor.baselineName=item?.name||'';$('br-segment-name').value=item?.name||'';renderSegmentEditor();});
  $('br-segment-refresh-sources').addEventListener('click',()=>refreshSourceBases({forEditor:true,preserveNotice:true}));
  $('br-segment-reread').addEventListener('click',()=>refreshSegments({forEditor:true}));
  $('br-segment-form').addEventListener('submit',(event)=>{event.preventDefault();submitSegment();});
  $('br-import-open').addEventListener('click',()=>{if(requesting()||segmentEditor)return;importOpen=true;updateControls();renderSourcesHealth();$('br-'+(importMode==='file'?'upload':'link')+'-name').focus();});
  $('br-import-cancel').addEventListener('click',()=>{if(importing)return;importOpen=false;updateControls();renderSourcesHealth();$('br-import-open').focus();});
  $('br-import-mode-file').addEventListener('click',()=>switchImportMode('file'));$('br-import-mode-link').addEventListener('click',()=>switchImportMode('link'));
  for(const prefix of ['upload','link'])for(const kind of ['companies','lpr'])$('br-'+prefix+'-'+kind).addEventListener('change',updateImportView);
  for(const radio of $('br-import-link-form').querySelectorAll('input[type="radio"]'))radio.addEventListener('change',updateImportView);
  $('br-upload-file').addEventListener('change',()=>{importFileSelection++;});
  $('br-import-file-form').addEventListener('submit',(event)=>{event.preventDefault();submitSourceImport('file',event.currentTarget);});$('br-import-link-form').addEventListener('submit',(event)=>{event.preventDefault();submitSourceImport('link',event.currentTarget);});
  $('br-import-reread').addEventListener('click',()=>refreshSourceBases({preserveNotice:true}));
  window.addEventListener('focus',()=>refreshActiveView({automatic:true}));document.addEventListener('visibilitychange',()=>{armViewTimer();if(!document.hidden)refreshActiveView({automatic:true});});window.addEventListener('beforeunload',(event)=>{clearViewTimer();if(importing||segmentSaving||teamSaving){event.preventDefault();event.returnValue='';}});
  render();armViewTimer();
  (async()=>{busy=true;updateControls();try{bootstrap=await rpc('getAppBootstrap');$('br-user').textContent=bootstrap.user.email||'';}catch(error){notice(failure(error).message,'error');}finally{busy=false;$('br-loading').hidden=true;renderTeamAccess();updateControls();pendingView=activeView;flushPendingView();}})();
})();
</script>
