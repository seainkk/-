<script>
(() => {
  'use strict';
  const root=document.getElementById('bases-registry-app');
  const $=(id)=>document.getElementById(id);
  let bootstrap=null, selectedFolder=null, busy=false, formMode=null, renameId=null, creationRequest=null;
  let collapsed=matchMedia('(max-width:640px)').matches;
  const expanded=new Set();
  const sorted=(items)=>items.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  const failure=(error)=>{const text=String(error?.message||error||'Неизвестная ошибка.');const match=text.match(/\[([A-Z_]+)\]\s*(.*)/s);return {code:match?.[1]||'ERROR',message:match?.[2]||text};};
  function rpc(name,payload){return new Promise((resolve,reject)=>{if(!globalThis.google?.script?.run){reject(new Error('Нет соединения с сервером Google. Откройте опубликованное веб-приложение Apps Script.'));return;}const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);payload===undefined?runner[name]():runner[name](payload);});}
  function nativeUrl(id,sheetId){return 'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(id)+'/edit'+(sheetId===undefined?'':'#gid='+encodeURIComponent(sheetId));}
  function notice(message,kind='info',link=null){const node=$('br-notice');node.hidden=!message;node.className='br-notice'+(kind==='error'?' br-error':'');node.replaceChildren();if(message)node.append(document.createTextNode(message));if(link){const anchor=document.createElement('a');anchor.href=nativeUrl(link.id);anchor.target='_blank';anchor.rel='noopener noreferrer';anchor.textContent=link.label||'Открыть созданную базу';node.append(anchor);}}
  function folderById(id){if(!bootstrap)return null;return id===bootstrap.registry.id?bootstrap.registry:bootstrap.folders.find((folder)=>folder.id===id);}
  function folderName(id){return folderById(id)?.name||'Папка';}
  function folderPath(id){const names=[],seen=new Set();while(id&&bootstrap&&id!==bootstrap.registry.id&&!seen.has(id)){seen.add(id);const folder=folderById(id);if(!folder)break;names.unshift(folder.name);id=folder.parentId;}return [bootstrap?.registry.name,...names].filter(Boolean).join(' / ');}
  function button(className,text){const node=document.createElement('button');node.type='button';node.className='br-button '+className;if(text)node.textContent=text;return node;}
  function sheetLink(file,className){const anchor=document.createElement('a');anchor.className=className;anchor.href=nativeUrl(file.id);anchor.target='_blank';anchor.rel='noopener noreferrer';anchor.dataset.file=file.id;anchor.title=file.name;return anchor;}
  function openFolder(id){if(busy||!folderById(id))return;selectedFolder=id;expanded.add(id);render();}
  function renderTree(){
    const target=$('br-tree');target.replaceChildren();if(!bootstrap)return;
    const seen=new Set();
    function makeFolder(folder,depth){
      if(seen.has(folder.id)||depth>20)return null;seen.add(folder.id);
      const group=document.createElement('div');group.className='br-tree-group';
      const node=button('br-folder-button');node.style.paddingLeft=(Math.min(depth,8)*12+5)+'px';node.dataset.folder=folder.id;node.setAttribute('aria-expanded',String(expanded.has(folder.id)));node.setAttribute('aria-current',String(selectedFolder===folder.id));node.title=folder.name;
      const arrow=document.createElement('span');arrow.className='br-tree-arrow';arrow.textContent=expanded.has(folder.id)?'▾':'▸';
      const symbol=document.createElement('span');symbol.className='br-tree-symbol';symbol.textContent='▱';
      const label=document.createElement('span');label.className='br-tree-name';label.textContent=folder.name;node.append(arrow,symbol,label);
      node.addEventListener('click',()=>{if(busy)return;selectedFolder=folder.id;expanded.has(folder.id)?expanded.delete(folder.id):expanded.add(folder.id);render();});group.append(node);
      if(expanded.has(folder.id)){
        const folders=sorted(bootstrap.folders.filter((item)=>item.parentId===folder.id));
        const files=sorted(bootstrap.files.filter((item)=>item.parentId===folder.id));
        for(const child of folders){const subtree=makeFolder(child,depth+1);if(subtree)group.append(subtree);}
        for(const file of files){const anchor=sheetLink(file,'br-button br-file-link');anchor.style.paddingLeft=(Math.min(depth,8)*12+26)+'px';const icon=document.createElement('span');icon.className='br-tree-symbol';icon.textContent='▦';const name=document.createElement('span');name.className='br-tree-name';name.textContent=file.name;anchor.append(icon,name);group.append(anchor);}
        if(!folders.length&&!files.length){const empty=document.createElement('div');empty.className='br-empty-folder';empty.textContent='Папка пуста';group.append(empty);}
      }
      return group;
    }
    const tree=makeFolder(bootstrap.registry,0);if(tree)target.append(tree);
    $('br-destination').textContent='Создание в папке: '+folderName(selectedFolder);
  }
  function renderFolder(){
    $('br-folder-view').hidden=!bootstrap;if(!bootstrap)return;
    $('br-folder-title').textContent=folderName(selectedFolder);$('br-breadcrumb').textContent=folderPath(selectedFolder);
    const folders=sorted(bootstrap.folders.filter((item)=>item.parentId===selectedFolder));
    const files=sorted(bootstrap.files.filter((item)=>item.parentId===selectedFolder));
    $('br-folder-summary').textContent='Папок: '+folders.length+' · Таблиц: '+files.length;
    const entries=$('br-entries');entries.replaceChildren();
    function appendEntry(item,isFolder){
      const row=document.createElement('div');row.className='br-entry';
      const main=isFolder?button('br-entry-main'):sheetLink(item,'br-entry-main');
      if(isFolder){main.dataset.openFolder=item.id;main.addEventListener('click',()=>openFolder(item.id));}
      const icon=document.createElement('span');icon.className='br-entry-icon';icon.textContent=isFolder?'▱':'▦';icon.setAttribute('aria-hidden','true');
      const details=document.createElement('span');details.className='br-entry-details';const name=document.createElement('span');name.className='br-entry-name';name.textContent=item.name;const kind=document.createElement('span');kind.className='br-entry-kind';kind.textContent=isFolder?'Папка':'Google Таблица';details.append(name,kind);main.append(icon,details);row.append(main);
      if(isFolder){const arrow=document.createElement('span');arrow.className='br-entry-arrow';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');row.append(arrow);}else{const rename=button('br-rename','✎');rename.dataset.rename=item.id;rename.setAttribute('aria-label','Переименовать базу «'+item.name+'»');rename.title='Переименовать базу';rename.addEventListener('click',()=>showForm('rename',item.id));row.append(rename);}
      entries.append(row);
    }
    folders.forEach((folder)=>appendEntry(folder,true));files.forEach((file)=>appendEntry(file,false));
    $('br-empty').hidden=folders.length+files.length!==0;
  }
  function setCollapsed(){root.dataset.collapsed=String(collapsed);$('br-menu-toggle').setAttribute('aria-label',collapsed?'Показать меню':'Свернуть меню');$('br-menu-toggle').setAttribute('aria-expanded',String(!collapsed));}
  function updateControls(){
    $('br-refresh').disabled=busy;
    for(const id of ['br-new-base','br-new-folder','br-empty-create'])$(id).disabled=busy||!bootstrap;
    for(const node of root.querySelectorAll('#br-tree button,#br-entries button'))node.disabled=busy;
    $('br-item-submit').disabled=busy;$('br-item-name').disabled=busy;$('br-item-cancel').disabled=busy;
  }
  function renderForm(){const node=$('br-item-form');node.hidden=!formMode;if(!formMode)return;const rename=formMode==='rename';$('br-item-label').textContent=rename?'Название базы':formMode==='folder'?'Новая папка':'Новая база';$('br-item-destination').textContent=rename?'':'В папке «'+folderName(selectedFolder)+'»';$('br-item-submit').textContent=rename?'Сохранить':'Создать';}
  function render(){renderTree();renderFolder();renderForm();updateControls();}
  function showForm(mode,id){if(busy||!bootstrap)return;const file=mode==='rename'?bootstrap.files.find((item)=>item.id===id):null;if(mode==='rename'&&!file)return;formMode=mode;renameId=file?.id||null;$('br-item-name').value=file?.name||'';$('br-form-error').textContent='';renderForm();$('br-item-name').focus();}
  async function runAction(action,label){if(busy)return;busy=true;$('br-loading').textContent=label||'Обновляем реестр…';$('br-loading').hidden=false;updateControls();try{await action();}catch(error){notice(failure(error).message,'error');}finally{busy=false;$('br-loading').hidden=true;updateControls();}}
  async function refreshRegistry(){const result=await rpc('getBootstrap');bootstrap=result;if(!folderById(selectedFolder))selectedFolder=result.registry.id;expanded.add(result.registry.id);$('br-user').textContent=result.user.email||'';render();}
  $('br-menu-toggle').addEventListener('click',()=>{collapsed=!collapsed;setCollapsed();});
  $('br-refresh').addEventListener('click',()=>runAction(async()=>{notice(null);await refreshRegistry();}));
  $('br-new-base').addEventListener('click',()=>showForm('file'));$('br-empty-create').addEventListener('click',()=>showForm('file'));$('br-new-folder').addEventListener('click',()=>showForm('folder'));
  $('br-item-cancel').addEventListener('click',()=>{if(busy)return;formMode=null;renameId=null;renderForm();});
  $('br-item-form').addEventListener('submit',(event)=>{
    event.preventDefault();const name=$('br-item-name').value.trim();if(!name||!formMode)return;const mode=formMode,parentId=selectedFolder,id=renameId;
    runAction(async()=>{
      notice(null);$('br-form-error').textContent='';
      if(mode==='rename'){
        try{const result=await rpc('renameItem',{id,name,kind:'file'});const file=bootstrap.files.find((item)=>item.id===result.id);if(file)file.name=result.name;formMode=null;renameId=null;render();notice('Название базы изменено.');}
        catch(error){$('br-form-error').textContent=failure(error).message;throw error;}return;
      }
      const signature=JSON.stringify({mode,parentId,name});if(creationRequest?.signature!==signature)creationRequest={signature,id:globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2)};
      let created;try{created=await rpc(mode==='file'?'createBase':'createFolder',{parentId,name,requestId:creationRequest.id});}catch(error){$('br-form-error').textContent=failure(error).message;throw error;}
      formMode=null;creationRequest=null;
      if(mode==='file'){if(!bootstrap.files.some((file)=>file.id===created.file.id))bootstrap.files.push(created.file);selectedFolder=parentId;}
      else{if(!bootstrap.folders.some((folder)=>folder.id===created.folder.id))bootstrap.folders.push(created.folder);selectedFolder=created.folder.id;expanded.add(selectedFolder);}
      expanded.add(parentId);render();
      try{await refreshRegistry();notice(mode==='file'?'База создана в Google Диске.':'Папка создана в реестре.','info',mode==='file'?{id:created.file.id}:null);}
      catch(error){notice((mode==='file'?'База':'Папка')+' «'+name+'» создана. Обновить реестр не удалось: '+failure(error).message,'error',mode==='file'?{id:created.file.id}:null);}
    },mode==='rename'?'Сохраняем название…':mode==='file'?'Создаём базу…':'Создаём папку…');
  });
  setCollapsed();runAction(async()=>{await refreshRegistry();notice(null);},'Подключаем Google Диск…');
})();
</script>
