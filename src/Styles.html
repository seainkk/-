<style>
:root{color-scheme:light}
body{margin:0;background:#fff}
#bases-registry-app{
  --br-bg:#fff;--br-nav:#f7f7f9;--br-ink:#09090d;--br-muted:#686872;--br-line:#e6e6ec;
  --br-blue:#4753ff;--br-blue-hover:#3441ed;--br-soft:#eef0ff;--br-green:#19834a;
  --br-error:#b33d32;--br-error-bg:#fff0ed;
  width:100%;min-height:100vh;box-sizing:border-box;background:var(--br-bg);color:var(--br-ink);
  font:14px/1.55 "Vela Sans",VelaSans,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased
}
#bases-registry-app *{box-sizing:border-box}
#bases-registry-app [hidden]{display:none!important}
#bases-registry-app .br-main[inert]{pointer-events:none}
#bases-registry-app button,#bases-registry-app input,#bases-registry-app select{font:inherit}
#bases-registry-app button{cursor:pointer}
#bases-registry-app button:disabled{cursor:default;opacity:.43}
#bases-registry-app :is(button,a,input,select,summary):focus-visible{outline:3px solid #a7adff;outline-offset:3px}
#bases-registry-app a{color:var(--br-blue)}
#bases-registry-app .br-button{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;
  padding:10px 17px;border:1px solid var(--br-line);border-radius:100px;background:#fff;
  color:var(--br-ink);font-size:12px;font-weight:500;line-height:1.35;white-space:nowrap;text-decoration:none;
  transition:background-color .16s,border-color .16s,color .16s
}
#bases-registry-app .br-button:hover:not(:disabled){background:var(--br-soft);border-color:#d8dcff;color:var(--br-blue)}
#bases-registry-app .br-primary{min-height:44px;padding:12px 21px;background:var(--br-blue);border-color:var(--br-blue);color:#fff;font-weight:600}
#bases-registry-app .br-primary:hover:not(:disabled){background:var(--br-blue-hover);border-color:var(--br-blue-hover);color:#fff}
#bases-registry-app .br-muted{color:var(--br-muted);font-size:12px}
#bases-registry-app .br-error{color:var(--br-error)}
#bases-registry-app .br-header{
  display:flex;align-items:center;flex-wrap:wrap;gap:20px;min-height:90px;

#bases-registry-app .br-source-projects{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:6px 0;border:1px solid var(--br-line);border-radius:10px;padding:5px 12px 9px}

#bases-registry-app .br-source-projects input{width:auto;min-height:auto}
#bases-registry-app .br-brand{display:flex;align-items:center;gap:11px;min-width:0;max-width:18rem;line-height:1.12}
#bases-registry-app .br-brand-mark{display:block;flex:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,#52bff4 0%,#4753ff 70%);box-shadow:inset -4px -3px 8px #3439c52b}
#bases-registry-app .br-brand strong{font-size:23px;font-weight:600;letter-spacing:-.8px}

#bases-registry-app .br-view-nav .br-button[aria-pressed="true"]:hover{background:var(--br-blue-hover);color:#fff}
#bases-registry-app .br-user{margin-left:auto;color:var(--br-muted);font-size:11px;max-width:180px;overflow-wrap:anywhere}

#bases-registry-app .br-main{width:100%;min-width:0}
