<style>
:root{color-scheme:light}
body{margin:0;background:#fff}
#bases-registry-app{
  --br-bg:#fff;--br-nav:#f7f7f9;--br-ink:#09090d;--br-muted:#686872;--br-line:#e6e6ec;
  --br-blue:#4753ff;--br-blue-hover:#3441ed;--br-soft:#eef0ff;--br-green:#19834a;
  --br-error:#b33d32;--br-error-bg:#fff0ed;
  width:100%;min-height:100vh;box-sizing:border-box;background:var(--br-bg);color:var(--br-ink);
  font:14px/1.55 "Vela Sans",VelaSans,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased
}
#bases-registry-app *{box-sizing:border-box}
#bases-registry-app [hidden]{display:none!important}
#bases-registry-app .br-main[inert]{pointer-events:none}
#bases-registry-app button,#bases-registry-app input,#bases-registry-app select{font:inherit}
#bases-registry-app button{cursor:pointer}
#bases-registry-app button:disabled{cursor:default;opacity:.43}
#bases-registry-app :is(button,a,input,select,summary):focus-visible{outline:3px solid #a7adff;outline-offset:3px}
#bases-registry-app a{color:var(--br-blue)}
#bases-registry-app .br-button{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;
  padding:10px 17px;border:1px solid var(--br-line);border-radius:100px;background:#fff;
  color:var(--br-ink);font-size:12px;font-weight:500;line-height:1.35;white-space:nowrap;text-decoration:none;
  transition:background-color .16s,border-color .16s,color .16s
}
#bases-registry-app .br-button:hover:not(:disabled){background:var(--br-soft);border-color:#d8dcff;color:var(--br-blue)}
#bases-registry-app .br-primary{min-height:44px;padding:12px 21px;background:var(--br-blue);border-color:var(--br-blue);color:#fff;font-weight:600}
#bases-registry-app .br-primary:hover:not(:disabled){background:var(--br-blue-hover);border-color:var(--br-blue-hover);color:#fff}
#bases-registry-app .br-muted{color:var(--br-muted);font-size:12px}
#bases-registry-app .br-error{color:var(--br-error)}
#bases-registry-app .br-header{
  display:flex;align-items:center;flex-wrap:wrap;gap:20px;min-height:90px;
  padding:20px max(28px,calc((100% - 1300px)/2));border-bottom:1px solid var(--br-line);background:#fff
}
#bases-registry-app .br-brand{display:flex;align-items:center;gap:11px;flex-shrink:0;white-space:nowrap}
#bases-registry-app .br-brand-mark{display:block;width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,#52bff4 0%,#4753ff 70%);box-shadow:inset -4px -3px 8px #3439c52b}
#bases-registry-app .br-brand strong{font-size:23px;font-weight:600;letter-spacing:-.8px}
#bases-registry-app .br-brand strong span{color:var(--br-blue)}
#bases-registry-app .br-view-nav{display:flex;align-items:center;gap:4px;border-radius:100px;background:var(--br-nav);padding:5px}
#bases-registry-app .br-view-nav .br-button{min-height:37px;padding:9px 14px;border-color:transparent;background:transparent;font-size:12px}
#bases-registry-app .br-view-nav .br-button[aria-pressed="true"]{background:var(--br-blue);color:#fff;font-weight:600}
#bases-registry-app .br-view-nav .br-button[aria-pressed="true"]:hover{background:var(--br-blue-hover);color:#fff}
#bases-registry-app .br-user{margin-left:auto;color:var(--br-muted);font-size:11px;max-width:180px;overflow-wrap:anywhere}
#bases-registry-app .br-header-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#bases-registry-app .br-header-actions .br-button{font-size:11px;min-height:37px;padding:9px 12px}
#bases-registry-app .br-provider-dialog{box-sizing:border-box;width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);margin:auto;padding:clamp(16px,4vw,28px);border:1px solid var(--br-line);border-radius:24px;background:var(--br-nav);color:inherit;overflow:auto}

#bases-registry-app .br-provider-fields{display:grid;gap:12px;min-width:0;border:0;margin:0;padding:0}
#bases-registry-app .br-provider-fields label{display:grid;gap:6px}
#bases-registry-app .br-provider-fields .br-provider-choice{display:flex;align-items:center}
#bases-registry-app .br-provider-fields input:not([type=checkbox]){min-width:0;width:100%}
#bases-registry-app .br-provider-fields p,#bases-registry-app .br-provider-automation p{margin:0}
#bases-registry-app .br-provider-actions{display:flex;flex-wrap:wrap;gap:8px}
#bases-registry-app .br-provider-automation{display:grid;justify-items:start;gap:8px;border-top:1px solid var(--br-line);padding-top:16px}
#bases-registry-app #br-refresh{border-color:transparent;color:var(--br-muted)}
#bases-registry-app .br-main{width:100%;min-width:0}
#bases-registry-app .br-sources-view,#bases-registry-app .br-segments-view,#bases-registry-app .br-retarget-view,#bases-registry-app .br-mailings-view{max-width:1360px;margin:0 auto;padding:38px 32px 52px;min-width:0}
#bases-registry-app h1{font-size:38px;line-height:1.12;letter-spacing:-1.3px;font-weight:600;margin:0;overflow-wrap:anywhere}
#bases-registry-app .br-segments-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
#bases-registry-app .br-segments-heading p{margin:10px 0 0}
#bases-registry-app :is(.br-sources-view,.br-segments-view){padding-top:20px}
#bases-registry-app .br-list-heading{display:flex;align-items:center;flex-wrap:wrap;gap:8px 24px;margin-bottom:8px}
#bases-registry-app .br-list-heading h1{font-size:clamp(26px,3vw,32px)}
#bases-registry-app .br-list-heading p{margin:2px 0 0}
#bases-registry-app .br-list-heading .br-registry-sections{margin:0;gap:5px}
#bases-registry-app .br-list-heading>:last-child{margin-left:auto}
#bases-registry-app .br-back-row{max-width:1360px;margin:5px auto;padding:0 clamp(12px,2.5vw,32px)}
#bases-registry-app #br-action-back{padding:6px 12px;min-height:32px}
#bases-registry-app :is(#br-segment-close,#br-import-cancel,#br-contact-preview-close,#br-origin-close,#br-coldy-close,#br-provider-close)::before{content:"←";font-weight:600}
@media(pointer:coarse){#bases-registry-app #br-action-back{min-height:44px}}
#bases-registry-app .br-source-lineage{margin:8px 0;color:var(--br-ink)}
#bases-registry-app .br-source-lineage summary{width:fit-content;padding:5px 0;color:var(--br-blue);font-weight:600;cursor:pointer}
#bases-registry-app .br-lineage-scroll{max-width:100%;overflow:auto;margin-top:4px;border:1px solid var(--br-line);border-radius:12px}
#bases-registry-app .br-lineage-scroll table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
#bases-registry-app .br-lineage-scroll :is(th,td){padding:7px 12px;border-bottom:1px solid var(--br-line);text-align:left;vertical-align:top;overflow-wrap:anywhere}

#bases-registry-app .br-lineage-scroll tr:last-child td{border-bottom:0}
#bases-registry-app .br-route-fields{margin:14px 0 0;padding:0;border:0;display:flex;align-items:end;flex-wrap:wrap;gap:8px 14px;min-width:0}
#bases-registry-app .br-route-fields label{display:grid;gap:4px;min-width:min(235px,100%);max-width:100%;color:var(--br-muted);font-size:12px}
#bases-registry-app .br-route-fields :is(select,input){background:white}
#bases-registry-app .br-directed .br-segment-form>:is(label,.br-segment-source-heading,#br-segment-sources-health,#br-segment-source-options,#br-segment-upload,.br-muted):not(#br-segment-selection-summary){display:none}
#bases-registry-app :is(.br-sources-view,.br-segments-view)>.br-segments-health{margin:4px 0 8px}
#bases-registry-app .br-source-heading-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

#bases-registry-app .br-notice{padding:15px 32px;background:var(--br-soft);border-bottom:1px solid #dfe2ff;color:#343e9c;font-size:13px;overflow-wrap:anywhere}
#bases-registry-app .br-notice a{color:inherit;margin-left:8px;text-decoration:underline;text-underline-offset:3px}
#bases-registry-app .br-notice.br-error{background:var(--br-error-bg);border-color:#f2d8d1;color:var(--br-error)}
#bases-registry-app .br-loading{padding:36px 32px;color:var(--br-muted);font-size:15px}
#bases-registry-app .br-source-filters{display:flex;align-items:flex-end;gap:6px 12px;flex-wrap:wrap;margin:12px 0 6px;padding:9px 14px;background:var(--br-nav);border-radius:16px}

#bases-registry-app input:not([type="checkbox"]):not([type="radio"]),#bases-registry-app select{min-width:0;max-width:100%;min-height:46px;border:1px solid transparent;border-radius:100px;padding:11px 16px;background:#f1f1f4;color:var(--br-ink)}

#bases-registry-app select{width:100%;padding-right:28px}
#bases-registry-app .br-source-filters input[type="search"],#bases-registry-app .br-source-filters select{width:100%;background:#fff}

#bases-registry-app .br-source-filters-note,#bases-registry-app .br-source-filter-pinned{font-size:12px;line-height:1.6;color:var(--br-muted);margin:10px 0;overflow-wrap:anywhere}

#bases-registry-app .br-segments-health{color:var(--br-muted);font-size:12px;line-height:1.6;margin:0 0 23px;min-height:19px;overflow-wrap:anywhere}

#bases-registry-app .br-source-item>*{grid-column:1/-1;min-width:0}
#bases-registry-app .br-source-head,#bases-registry-app .br-source-identity,#bases-registry-app .br-source-meta{display:flex;align-items:center;flex-wrap:wrap}
#bases-registry-app .br-source-head{justify-content:space-between;gap:6px 12px}

#bases-registry-app .br-source-item h2{margin:0;font-size:18px;line-height:1.25;font-weight:600;letter-spacing:-.3px;overflow-wrap:anywhere}
#bases-registry-app .br-source-meta{flex-basis:100%;gap:0 10px;color:var(--br-muted);font-size:12px}
#bases-registry-app .br-source-file{min-width:0;max-width:100%;color:var(--br-blue);text-underline-offset:3px;overflow-wrap:anywhere}
#bases-registry-app .br-source-status{padding:2px 8px;border-radius:100px;background:#ebebf0;color:#484854;font-size:12px;font-weight:600}
#bases-registry-app .br-source-status[data-status="ready"]{background:#e4f4ea;color:#19643c}

#bases-registry-app .br-source-status[data-status="rework"]{background:#fff0d7;color:#80521b}
#bases-registry-app .br-source-settings summary{width:fit-content;max-width:100%;padding:5px 0;color:var(--br-blue);font-size:13px;cursor:pointer}
#bases-registry-app .br-source-settings[open]{padding-top:5px;border-top:1px solid var(--br-line)}
@container(min-width:500px){
  #bases-registry-app .br-source-item>.br-source-associations{grid-column:1}
  #bases-registry-app .br-source-settings:not([open]){grid-column:2;justify-self:end}
}
#bases-registry-app .br-source-criterion{margin:10px 0 14px;color:var(--br-muted);font-size:12px;line-height:1.65;overflow-wrap:anywhere}
#bases-registry-app .br-source-fields{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(2,minmax(0,1fr));gap:16px;max-width:900px;margin:20px 0 12px}
#bases-registry-app .br-source-fields>label{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:11px;color:var(--br-muted)}
#bases-registry-app .br-source-fields select{width:100%;font-size:13px;background:#fff;border-color:#e2e3eb}
#bases-registry-app .br-contents-choice{min-width:0;margin:0;border:1px solid #e1e2eb;border-radius:20px;padding:8px 13px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:10px 15px;background:#fff}
#bases-registry-app .br-contents-choice legend{padding:0 4px;color:var(--br-muted);font-size:11px}

#bases-registry-app .br-source-persisted{margin:10px 0;color:var(--br-muted);font-size:11px;line-height:1.7;overflow-wrap:anywhere}
#bases-registry-app .br-source-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:13px 0}

@media(max-width:640px){#bases-registry-app .br-contact-preview{padding:21px 18px;border-radius:24px}#bases-registry-app .br-contact-preview-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}#bases-registry-app .br-contact-preview h2{font-size:20px}#bases-registry-app .br-contact-preview-metrics dd{font-size:26px}}

#bases-registry-app .br-source-associations p{margin:0;overflow-wrap:anywhere}
