<style>

#bases-registry-app .pj-forecast-body .pj-metrics dd{font-size:21px}

#bases-registry-app .pj-sender-list ul{list-style:none;margin:6px 0;padding:0}

#bases-registry-app .pj-table td{padding:13px 17px;border-bottom:1px solid var(--br-line);vertical-align:top;overflow-wrap:anywhere}

#bases-registry-app .pj-completion-count{font-size:11px;color:var(--br-muted)}
#bases-registry-app .pj-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--br-blue);margin:2px 0}
#bases-registry-app .pj-table tr[data-unavailable="true"]{background:#fcfcfd}

#bases-registry-app .pj-account-error{max-width:300px;color:var(--br-error);white-space:pre-line;font-size:11px}

#bases-registry-app .pj-footnote{padding:12px 20px 15px;margin:0;border-top:1px solid var(--br-line);line-height:1.6}

#bases-registry-app .pj-mailbox-fields input[type=search]{display:block;box-sizing:border-box;width:100%;padding:12px 14px;border:1px solid var(--br-line);border-radius:12px;margin:8px 0 14px;font:inherit;background:#fff}
#bases-registry-app .pj-mailbox-rows{margin-top:12px;max-height:40vh;overflow:auto;border:1px solid var(--br-line);border-radius:12px}
#bases-registry-app .pj-mailbox-row{display:flex;align-items:flex-start;gap:12px;padding:12px;border-bottom:1px solid var(--br-line);font-size:13px;overflow-wrap:anywhere}

#bases-registry-app .pj-mailbox-row small{display:block;color:var(--br-muted);margin-top:3px}
#bases-registry-app .pj-mailbox-footer{margin-top:16px}
@media(max-width:720px){
  #bases-registry-app :is(.pj-pool-table,.pj-schedule-table){display:block;min-width:0}
  #bases-registry-app :is(.pj-pool-table,.pj-schedule-table) thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  #bases-registry-app :is(.pj-pool-table,.pj-schedule-table) tbody{display:block}
  #bases-registry-app :is(.pj-pool-table,.pj-schedule-table) tr{display:grid;gap:5px;padding:11px 14px;border-top:1px solid var(--br-line)}

  #bases-registry-app :is(.pj-pool-table,.pj-schedule-table) td::before{content:attr(data-label);grid-row:1 / span 12;color:var(--br-muted);font-size:11px}
  #bases-registry-app :is(.pj-pool-table,.pj-schedule-table) td>*{grid-column:2;justify-self:start;margin:0}
  #bases-registry-app :is(.pj-pool-table,.pj-schedule-table) td:first-child{display:block;margin-bottom:3px}
  #bases-registry-app :is(.pj-pool-table,.pj-schedule-table) td:first-child::before{display:none}
}
@media(max-width:760px){#bases-registry-app .br-header{padding-inline:14px;gap:12px}#bases-registry-app .br-view-nav{order:3;flex-basis:100%;max-width:100%;flex-wrap:wrap;border-radius:16px;gap:3px}#bases-registry-app .br-view-nav .br-button{flex:1 1 auto;min-width:0;padding:9px 10px;font-size:11px}#bases-registry-app .br-header-actions{max-width:100%;gap:5px}#bases-registry-app .br-header-actions .br-button{white-space:normal}}
@media(max-width:650px){#bases-registry-app .pj-view{padding:20px 14px 32px}#bases-registry-app .pj-heading{gap:13px}#bases-registry-app .pj-toolbar .br-button{min-height:40px;padding:9px 13px;font-size:11px}#bases-registry-app .pj-filter{align-items:flex-start;gap:8px}#bases-registry-app .pj-filter label{flex-basis:100%}#bases-registry-app .pj-filter select{flex:1;min-width:0}#bases-registry-app .pj-filter>span{flex-basis:100%;margin:3px 0 0}#bases-registry-app .pj-card-heading{padding:16px 14px 10px}#bases-registry-app .pj-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#bases-registry-app .pj-metrics>div{padding:13px}#bases-registry-app .pj-metrics dd{font-size:24px}#bases-registry-app .pj-table :is(th,td){padding:11px 13px}#bases-registry-app .pj-footnote{padding:12px 14px}}

</style>
