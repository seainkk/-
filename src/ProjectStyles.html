<style>
#bases-registry-app .pj-view{max-width:1360px;margin:0 auto;padding:24px 32px 52px;min-width:0}
#bases-registry-app .pj-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:16px}
#bases-registry-app .pj-heading h1{font-size:clamp(27px,3vw,34px);letter-spacing:-1px}
#bases-registry-app .pj-heading p{margin:6px 0 0}
#bases-registry-app .pj-heading .pj-eyebrow{margin:0 0 5px;color:var(--br-muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
#bases-registry-app .pj-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bases-registry-app .pj-health{min-height:20px;margin:8px 0 12px;color:var(--br-muted);font-size:12px;overflow-wrap:anywhere}
#bases-registry-app .pj-health[data-error="true"]{color:var(--br-error)}
#bases-registry-app .pj-connection{padding:14px 17px;background:var(--br-soft);border:1px solid #dce0ff;border-radius:14px;margin:12px 0 18px;font-size:13px}
#bases-registry-app .pj-filter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0}
#bases-registry-app .pj-filter label{font-weight:600;font-size:13px}
#bases-registry-app .pj-filter select{min-width:220px;max-width:100%;min-height:42px;padding:9px 36px 9px 14px;border:1px solid var(--br-line);border-radius:12px;background:#fff;font-size:13px}
#bases-registry-app .pj-filter>span{margin-left:auto}
#bases-registry-app .pj-card{border:1px solid var(--br-line);border-radius:18px;background:#fff;overflow:hidden;margin-top:18px;min-width:0}
#bases-registry-app .pj-card-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:19px 20px 12px}
#bases-registry-app .pj-card-heading h2{font-size:16px;line-height:1.3;margin:0;font-weight:600}
#bases-registry-app .pj-card-heading p{margin:6px 0 0}
#bases-registry-app .pj-card>.pj-health{padding:0 20px;margin-top:0}
#bases-registry-app .pj-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:18px 0 20px}
#bases-registry-app .pj-metrics>div{padding:16px 18px;border:1px solid var(--br-line);border-radius:15px;background:var(--br-nav);min-width:0}
#bases-registry-app .pj-metrics dt{font-size:12px;color:var(--br-muted);margin-bottom:8px}
#bases-registry-app .pj-metrics dd{font-size:27px;line-height:1.2;font-weight:600;letter-spacing:-.5px;margin:0;overflow-wrap:anywhere}
#bases-registry-app .pj-table-wrap{max-width:100%;overflow:auto;overscroll-behavior-x:contain}
#bases-registry-app .pj-table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
#bases-registry-app .pj-campaign-table{min-width:690px}
#bases-registry-app .pj-infrastructure-table{min-width:780px}
#bases-registry-app .pj-table th{padding:10px 17px;background:var(--br-nav);font-size:11px;font-weight:500;color:var(--br-muted);white-space:nowrap}
#bases-registry-app .pj-table td{padding:13px 17px;border-bottom:1px solid var(--br-line);vertical-align:top;overflow-wrap:anywhere}
#bases-registry-app .pj-table tbody tr:last-child td{border-bottom:0}
#bases-registry-app .pj-table .pj-name{display:block;min-width:160px;max-width:330px;font-size:13px;font-weight:500;color:var(--br-ink)}
#bases-registry-app .pj-table .pj-cell-note{display:block;margin-top:5px;font-size:11px;color:var(--br-muted);max-width:320px}
#bases-registry-app .pj-table .pj-number{font-variant-numeric:tabular-nums;white-space:nowrap}
#bases-registry-app .pj-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--br-blue);margin:2px 0}
#bases-registry-app .pj-table tr[data-unavailable="true"]{background:#fcfcfd}
#bases-registry-app .pj-badge{display:inline-flex;align-items:center;gap:5px;max-width:230px;padding:4px 9px;border-radius:100px;background:#f1f1f4;color:var(--br-muted);font-size:11px;line-height:1.35;overflow-wrap:anywhere}
#bases-registry-app .pj-badge[data-tone="success"]{color:#117541;background:#eaf8ef}
#bases-registry-app .pj-badge[data-tone="warning"]{color:#936407;background:#fff5d9}
#bases-registry-app .pj-badge[data-tone="error"]{color:var(--br-error);background:var(--br-error-bg)}
#bases-registry-app .pj-account-error{max-width:300px;color:var(--br-error);white-space:pre-line;font-size:11px}
#bases-registry-app .pj-empty{padding:30px 22px;border:1px dashed var(--br-line);border-radius:16px;color:var(--br-muted);font-size:13px;line-height:1.65;margin:18px 0}
#bases-registry-app .pj-footnote{padding:12px 20px 15px;margin:0;border-top:1px solid var(--br-line);line-height:1.6}
#bases-registry-app .pj-sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){#bases-registry-app .br-header{padding-inline:14px;gap:12px}#bases-registry-app .br-view-nav{order:3;flex-basis:100%;max-width:100%;flex-wrap:wrap;border-radius:16px;gap:3px}#bases-registry-app .br-view-nav .br-button{flex:1 1 auto;min-width:0;padding:9px 10px;font-size:11px}#bases-registry-app .br-header-actions{max-width:100%;gap:5px}#bases-registry-app .br-header-actions .br-button{white-space:normal}}
@media(max-width:650px){#bases-registry-app .pj-view{padding:20px 14px 32px}#bases-registry-app .pj-heading{gap:13px}#bases-registry-app .pj-toolbar .br-button{min-height:40px;padding:9px 13px;font-size:11px}#bases-registry-app .pj-filter{align-items:flex-start;gap:8px}#bases-registry-app .pj-filter label{flex-basis:100%}#bases-registry-app .pj-filter select{flex:1;min-width:0}#bases-registry-app .pj-filter>span{flex-basis:100%;margin:3px 0 0}#bases-registry-app .pj-card-heading{padding:16px 14px 10px}#bases-registry-app .pj-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#bases-registry-app .pj-metrics>div{padding:13px}#bases-registry-app .pj-metrics dd{font-size:24px}#bases-registry-app .pj-table :is(th,td){padding:11px 13px}#bases-registry-app .pj-footnote{padding:12px 14px}}
</style>
