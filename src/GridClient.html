<script>
(() => {

  let session=null,generation=0,dragging=false;
  function gridColumnName(value){let text='';for(let n=value;n>0;n=Math.floor((n-1)/26))text=String.fromCharCode(65+(n-1)%26)+text;return text;}

  function gridParseTsv(value){const text=String(value||'').replace(/\r\n?/g,'\n'),rows=[],row=[];let cell='',quoted=false,start=true;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(ch==='"')quoted=false;else cell+=ch;continue;}if(ch==='"'&&start){quoted=true;start=false;}else if(ch==='\t'){row.push(cell);cell='';start=true;}else if(ch==='\n'){row.push(cell);rows.push(row.splice(0));cell='';start=true;}else{cell+=ch;start=false;}}if(quoted)throw new Error('Не закрыты кавычки в скопированном диапазоне.');row.push(cell);rows.push(row);if(text.endsWith('\n')&&rows.length>1&&rows[rows.length-1].length===1&&rows[rows.length-1][0]==='')rows.pop();const width=Math.max(1,...rows.map(item=>item.length));return rows.map(item=>Array.from({length:width},(_,i)=>item[i]??''));}

  function setError(error,current=session){if(!alive(current))return;current.error=gridFailure(error);notify(current);settle(current);}

    $('rg-grid-discard').disabled=!!current.inFlight;$('rg-grid-copy-draft').disabled=!current.dirty.size;
    $('rg-grid-reload').disabled=pending||!!current.inFlight||current.transition;
    $('rg-grid-undo').disabled=readonly||pending||current.transition||!current.undo.length;
    $('rg-grid-redo').disabled=readonly||pending||current.transition||!current.redo.length;
    $('rg-grid-add-rows').disabled=readonly||pending||current.transition||!current.book;
    $('rg-grid-add-columns').disabled=readonly||pending||current.transition||!current.book;
    $('rg-grid-formula').disabled=readonly||current.transition||!current.cache.has(key(current.active.row,current.active.column));
    $('rg-grid-address').disabled=!current.book||current.transition;
    for(const tab of $('rg-grid-tabs').querySelectorAll('button'))tab.disabled=current.transition;
    if(!current.formulaFocused){$('rg-grid-formula').value=effective(current.active.row,current.active.column,current);current.formulaDirty=false;}

    $('rg-grid-viewport').setAttribute('aria-rowcount',String(meta?.rowCount||0));$('rg-grid-viewport').setAttribute('aria-colcount',String(meta?.columnCount||0));

  }
  function renderTabs(){const current=session,list=$('rg-grid-tabs');list.replaceChildren();if(!current?.book)return;for(const item of current.book.sheets){const button=document.createElement('button');button.type='button';button.className='rg-grid-tab';button.dataset.sheetId=String(item.id);button.textContent=gridText(item.name);button.setAttribute('role','tab');button.setAttribute('aria-selected',String(String(item.id)===String(current.sheetId)));button.addEventListener('click',()=>switchSheet(item.id));list.append(button);}}
  function paintSelection(){const current=session;if(!current)return;const area=rect(current);for(const td of $('rg-grid-body').querySelectorAll('td[data-row][data-column]')){const r=Number(td.dataset.row),c=Number(td.dataset.column),selected=r>=area.row&&r<area.row+area.rows&&c>=area.column&&c<area.column+area.columns;td.classList.toggle('rg-grid-selected',selected);td.classList.toggle('rg-grid-active',r===current.active.row&&c===current.active.column);td.setAttribute('aria-selected',String(selected));}for(const th of $('rg-grid-head').querySelectorAll('th[data-column]'))th.classList.toggle('rg-grid-axis-active',Number(th.dataset.column)===current.active.column);for(const th of $('rg-grid-body').querySelectorAll('th[data-row-number]'))th.classList.toggle('rg-grid-axis-active',Number(th.dataset.rowNumber)===current.active.row);update();}

    const span=1+columns+(before?1:0)+(right?1:0),vertical=height=>{if(!height)return;const tr=document.createElement('tr'),td=document.createElement('td');td.className='rg-grid-spacer';td.colSpan=span;td.style.height=height+'px';td.setAttribute('aria-hidden','true');tr.append(td);body.append(tr);};vertical((top-1)*ROW_HEIGHT);

      for(let c=left;c<left+columns;c++){const td=document.createElement('td'),value=document.createElement('div'),id=key(r,c);td.id='rg-cell-'+r+'-'+c;td.className='rg-grid-cell';td.dataset.row=String(r);td.dataset.column=String(c);td.setAttribute('role','gridcell');td.setAttribute('aria-rowindex',String(r));td.setAttribute('aria-colindex',String(c));const selected=r>=selection.row&&r<selection.row+selection.rows&&c>=selection.column&&c<selection.column+selection.columns;td.setAttribute('aria-selected',String(selected));if(selected)td.classList.add('rg-grid-selected');if(r===current.active.row&&c===current.active.column)td.classList.add('rg-grid-active');if(current.dirty.has(id))td.classList.add('rg-grid-dirty');value.className='rg-grid-cell-content';value.textContent=cellDisplay(r,c,current);td.append(value);tr.append(td);}if(right)tr.append(spacerCell('td',right*COLUMN_WIDTH));body.append(tr);}
    vertical(Math.max(0,meta.rowCount-top-rows+1)*ROW_HEIGHT);$('rg-grid-table').style.width=(ROW_GUTTER+meta.columnCount*COLUMN_WIDTH)+'px';update();
  }
  function mergeRange(current,data){
    if(!alive(current)||String(data.sheetId??current.sheetId)!==String(current.sheetId))return;
    const values=data.values||[],inputs=data.inputs||values,versions=data.versions||[];
    for(let r=0;r<values.length;r++)for(let c=0;c<values[r].length;c++){const id=key((data.row||1)+r,(data.column||1)+c);current.cache.set(id,{display:gridText(values[r][c]),input:gridText(inputs[r]?.[c]),version:versions[r]?.[c]});}

  }
  async function loadWindow(row,column,options={}){
    const current=session,meta=sheet(current);if(!current||!meta)return;
    row=Math.max(1,Math.min(row,meta.rowCount));column=Math.max(1,Math.min(column,meta.columnCount));
    current.window={row,column};const request=++current.loadSequence,sheetId=current.sheetId;current.loading=true;draw();

  }
  function selectedCell(){return document.getElementById('rg-cell-'+session?.active.row+'-'+session?.active.column);}
  function revealActive(){const cell=selectedCell(),view=$('rg-grid-viewport');if(!cell)return;const a=cell.getBoundingClientRect(),b=view.getBoundingClientRect();if(a.top<b.top+ROW_HEIGHT)view.scrollTop-=b.top+ROW_HEIGHT-a.top;else if(a.bottom>b.bottom)view.scrollTop+=a.bottom-b.bottom;if(a.left<b.left+ROW_GUTTER)view.scrollLeft-=b.left+ROW_GUTTER-a.left;else if(a.right>b.right)view.scrollLeft+=a.right-b.right;}
  function select(row,column,extend=false){const current=session,meta=sheet(current);if(!meta)return;row=Math.max(1,Math.min(row,meta.rowCount));column=Math.max(1,Math.min(column,meta.columnCount));if(extend){current.selection.r2=row;current.selection.c2=column;}else{current.active={row,column};current.selection={r1:row,c1:column,r2:row,c2:column};}if(row<current.window.row||row>=current.window.row+WINDOW_ROWS||column<current.window.column||column>=current.window.column+WINDOW_COLUMNS){const view=$('rg-grid-viewport');view.scrollTop=(row-1)*ROW_HEIGHT;view.scrollLeft=(column-1)*COLUMN_WIDTH;loadWindow(Math.max(1,row-2),Math.max(1,column-1));}else{paintSelection();revealActive();}}
  function beginEdit(replace=false,initial=''){
    const current=session;if(!editAllowed())return;const cell=selectedCell();if(!cell)return;
    const editor=$('rg-grid-editor'),a=cell.getBoundingClientRect(),b=panel.getBoundingClientRect();current.editorBefore=effective(current.active.row,current.active.column,current);current.editorCell={...current.active};editor.value=replace?initial:current.editorBefore;editor.hidden=false;editor.style.left=Math.max(0,a.left-b.left)+'px';editor.style.top=Math.max(0,a.top-b.top)+'px';editor.style.width=Math.max(40,Math.min(Math.max(a.width,200),b.right-a.left-4))+'px';editor.style.height='30px';editor.focus({preventScroll:true});editor.setSelectionRange(editor.value.length,editor.value.length);notify();
  }
  function commitEditor(cancel=false){const current=session,editor=$('rg-grid-editor');if(!current||editor.hidden)return;const value=editor.value,location=current.editorCell;editor.hidden=true;current.editorCell=null;if(!cancel&&value!==current.editorBefore)queueRange(location.row,location.column,[[value]]);notify(current);}
  function commitFormula(cancel=false){const current=session;if(!current)return;const value=$('rg-grid-formula').value,currentValue=effective(current.active.row,current.active.column,current),changed=current.formulaDirty;current.formulaFocused=false;current.formulaDirty=false;if(!cancel&&changed&&value!==currentValue)queueRange(current.active.row,current.active.column,[[value]]);update();}
  function requestId(){return globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);}
  function queueRange(row,column,values,mode='user',history=null){
    const current=session,meta=sheet(current);if(!current||current.book?.canEdit!==true||current.transition)return false;
    const height=values.length,width=values[0]?.length||0;if(!height||!width||height*width>MAX_WRITE){hint('За один раз можно изменить до '+MAX_WRITE+' ячеек. Выберите меньший диапазон.');return false;}
    if(row<1||column<1||row+height-1>meta.rowCount||column+width-1>meta.columnCount){hint('Диапазон выходит за границы листа. Сначала добавьте строки или столбцы.');return false;}

    for(let r=0;r<height;r++){expected[r]=[];before[r]=[];for(let c=0;c<width;c++){const id=key(row+r,column+c),cached=current.cache.get(id),draft=current.dirty.get(id);before[r][c]=draft?draft.value:cached?cached.input:null;expected[r][c]=draft?null:typeof cached?.version==='string'?cached.version:'';}}

  }
  async function ensureRectangle(current,row,column,height,width){
    let missing=false;for(let r=0;r<height;r++)for(let c=0;c<width;c++)if(!current.cache.has(key(row+r,column+c)))missing=true;
    if(!missing)return;const sheetId=current.sheetId,data=await rpc(current,'getGridRange',{id:current.id,sheetId,row,column,rowCount:height,columnCount:width});if(alive(current)&&String(current.sheetId)===String(sheetId)){const saved=new Map();for(let r=0;r<height;r++)for(let c=0;c<width;c++){const id=key(row+r,column+c);if(current.cache.has(id))saved.set(id,current.cache.get(id));}mergeRange(current,data);for(const [id,value] of saved)current.cache.set(id,value);}

  function settle(current){if(!alive(current))return;if(current.error){for(const item of current.waiters.splice(0))item.reject(current.error);return;}if(!current.queue.length&&!current.inFlight&&!current.failed){for(const item of current.waiters.splice(0))item.resolve();}}

      if(data.recovered&&current.queue.some(item=>item.expected?.some(row=>row.includes(null)))&&op.values.some((row,r)=>row.some((value,c)=>gridText(data.inputs?.[r]?.[c])!==value)))throw new Error('[GRID_CONFLICT] После сохранения эти ячейки изменились. Ваши последующие правки сохранены локально; перечитайте данные перед продолжением.');

  }
  function flush(current=session){if(!alive(current))return Promise.resolve();commitEditor();if(current.formulaDirty)commitFormula();clearTimeout(current.saveTimer);if(current.error)return Promise.reject(current.error);if(!current.queue.length&&!current.inFlight&&!current.failed)return Promise.resolve();const done=new Promise((resolve,reject)=>current.waiters.push({resolve,reject}));drain(current);return done;}

  async function refreshBook(current,selected=current.sheetId){const data=await rpc(current,'getGridWorkbook',{id:current.id});if(!alive(current))return;current.book=data;if(!Array.isArray(data.sheets)||!data.sheets.length)throw new Error('В таблице нет доступных листов.');current.sheetId=data.sheets.some(item=>String(item.id)===String(selected))?selected:data.sheets[0].id;$('rg-grid-title').textContent=gridText(data.name||'Таблица');$('rg-grid-native').href='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(current.id)+'/edit#gid='+encodeURIComponent(current.sheetId);renderTabs();}

  async function copySelection(draftOnly=false){const current=session;if(!current)return;let area=rect(current);if(draftOnly){const cells=Array.from(current.dirty.keys()).map(id=>id.split(':').map(Number));if(!cells.length)return;const row=Math.min(...cells.map(item=>item[0])),column=Math.min(...cells.map(item=>item[1]));area={row,column,rows:Math.max(...cells.map(item=>item[0]))-row+1,columns:Math.max(...cells.map(item=>item[1]))-column+1};}
    if(area.rows*area.columns>MAX_READ){if(draftOnly){await writeClipboard(gridEncodeTsv([['Ячейка','Несохранённое значение'],...Array.from(current.dirty,([id,item])=>{const [r,c]=id.split(':').map(Number);return[gridAddress(r,c),item.value];})]));return;}hint('Выберите до '+MAX_READ+' ячеек для копирования.');return;}if(draftOnly){let full=true;for(let r=0;r<area.rows;r++)for(let c=0;c<area.columns;c++)if(!current.dirty.has(key(area.row+r,area.column+c)))full=false;const values=full?Array.from({length:area.rows},(_,r)=>Array.from({length:area.columns},(_,c)=>current.dirty.get(key(area.row+r,area.column+c)).value)):[['Ячейка','Несохранённое значение'],...Array.from(current.dirty,([id,item])=>{const [r,c]=id.split(':').map(Number);return[gridAddress(r,c),item.value];})];await writeClipboard(gridEncodeTsv(values));return;}try{let missing=false;for(let r=0;r<area.rows;r++)for(let c=0;c<area.columns;c++)if(!current.cache.has(key(area.row+r,area.column+c))&&!current.dirty.has(key(area.row+r,area.column+c)))missing=true;if(missing)await ensureRectangle(current,area.row,area.column,area.rows,area.columns);if(!alive(current))return;const values=Array.from({length:area.rows},(_,r)=>Array.from({length:area.columns},(_,c)=>effective(area.row+r,area.column+c,current)));await writeClipboard(gridEncodeTsv(values));}catch(error){if(alive(current))hint(gridFailure(error).message);}}
  async function paste(text){const current=session;if(!current||current.book?.canEdit!==true||current.transition)return;commitEditor();let values;try{values=gridParseTsv(text);}catch(error){hint(error.message);return;}const row=current.active.row,column=current.active.column,meta=sheet(current);if(values.length*values[0].length>MAX_WRITE){hint('За один раз можно вставить до '+MAX_WRITE+' ячеек.');return;}if(row+values.length-1>meta.rowCount||column+values[0].length-1>meta.columnCount){hint('Для вставки сначала добавьте строки или столбцы.');return;}if(queueRange(row,column,values)){current.selection={r1:row,c1:column,r2:row+values.length-1,c2:column+values[0].length-1};paintSelection();}}
  function move(dr,dc,extend=false){const current=session;if(!current)return;select((extend?current.selection.r2:current.active.row)+dr,(extend?current.selection.c2:current.active.column)+dc,extend);}
  async function close(){const current=session;if(!current)return;if(current.transition&&hasPending())return;try{commitEditor();if(!hasPending()){lock(false);return;}await flush(current);if(alive(current))lock(false);}catch(error){if(alive(current))hint('Есть несохранённые правки. Повторите сохранение или явно отмените их перед выходом.');}}
  function lock(locked=true){const current=session;if(!current)return;generation++;session=null;clearTimeout(current.saveTimer);clearTimeout(current.scrollTimer);for(const item of current.waiters.splice(0))item.reject(new Error('[GRID_CLOSED] Таблица закрыта.'));current.queue=[];current.failed=null;current.dirty.clear();current.cache.clear();current.committed.clear();current.undo=[];current.redo=[];panel.hidden=true;$('rg-grid-body').replaceChildren();$('rg-grid-head').replaceChildren();$('rg-grid-colgroup').replaceChildren();$('rg-grid-tabs').replaceChildren();$('rg-grid-title').textContent='Таблица';$('rg-grid-native').removeAttribute('href');$('rg-grid-formula').value='';$('rg-grid-editor').value='';$('rg-grid-editor').hidden=true;$('rg-grid-error-text').textContent='';$('rg-grid-error').hidden=true;hint('');document.body.style.overflow=current.bodyOverflow;try{current.onClose?.({locked});}catch(ignored){}try{if(current.returnFocus?.isConnected&&!current.returnFocus.disabled)current.returnFocus.focus({preventScroll:true});}catch(ignored){}try{window.dispatchEvent(new CustomEvent('registry-grid-state',{detail:{open:false,pending:false}}));}catch(ignored){}}
  async function open(options={}){
    if(!panel)throw new Error('Редактор таблиц недоступен. Обновите страницу.');if(session){if(hasPending())return false;lock(false);}if(typeof options.transport!=='function'||!options.id)throw new Error('Не указана таблица для открытия.');
    const current={epoch:++generation,id:String(options.id),transport:options.transport,onClose:options.onClose,bodyOverflow:document.body.style.overflow,returnFocus:document.activeElement,book:null,sheetId:null,cache:new Map(),committed:new Map(),dirty:new Map(),queue:[],failed:null,inFlight:null,error:null,waiters:[],rpcTail:Promise.resolve(),active:{row:1,column:1},selection:{r1:1,c1:1,r2:1,c2:1},window:{row:1,column:1},loadSequence:0,editSequence:0,undo:[],redo:[],loading:true,transition:false,formulaFocused:false,formulaDirty:false};session=current;panel.hidden=false;document.body.style.overflow='hidden';$('rg-grid-title').textContent='Открываем таблицу…';$('rg-grid-editor').hidden=true;hint('Двойной щелчок или F2 — изменить ячейку. Enter — подтвердить, Esc — отменить ввод.');notify(current);
    try{await refreshBook(current);if(alive(current))await loadWindow(1,1,{focus:true});return alive(current);}catch(error){if(alive(current)){current.loading=false;setError(error,current);}return false;}
  }
  window.RegistryGrid={open,lock,isOpen:()=>!!session,hasPending};
  if(!panel)return;
  $('rg-grid-close').addEventListener('click',close);$('rg-grid-reload').addEventListener('click',()=>reload());$('rg-grid-discard').addEventListener('click',()=>reload(true));$('rg-grid-retry').addEventListener('click',retry);$('rg-grid-copy-draft').addEventListener('click',()=>copySelection(true));$('rg-grid-copy').addEventListener('click',()=>copySelection());$('rg-grid-undo').addEventListener('click',()=>undo());$('rg-grid-redo').addEventListener('click',()=>undo(true));$('rg-grid-add-rows').addEventListener('click',()=>runAppend('rows'));$('rg-grid-add-columns').addEventListener('click',()=>runAppend('columns'));
  $('rg-grid-address').addEventListener('keydown',event=>{if(event.key!=='Enter')return;event.preventDefault();const address=gridParseAddress(event.target.value);if(!address){hint('Введите адрес ячейки, например A1 или AB120.');return;}const meta=sheet();if(!meta)return;if(address.row>meta.rowCount||address.column>meta.columnCount){hint('Этой ячейки пока нет. Добавьте строки или столбцы.');return;}commitEditor();select(address.row,address.column);$('rg-grid-viewport').focus();});
  $('rg-grid-formula').addEventListener('focus',()=>{if(session)session.formulaFocused=true;});$('rg-grid-formula').addEventListener('input',()=>{if(session){session.formulaDirty=true;notify();}});$('rg-grid-formula').addEventListener('blur',()=>commitFormula());$('rg-grid-formula').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();commitFormula();$('rg-grid-viewport').focus();}else if(event.key==='Escape'){event.preventDefault();commitFormula(true);$('rg-grid-viewport').focus();}});
  $('rg-grid-editor').addEventListener('input',()=>{const editor=$('rg-grid-editor');editor.style.height=Math.min(140,Math.max(30,editor.scrollHeight+4))+'px';notify();});$('rg-grid-editor').addEventListener('blur',()=>commitEditor());$('rg-grid-editor').addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();commitEditor(true);$('rg-grid-viewport').focus();}else if(event.key==='Tab'){event.preventDefault();commitEditor();move(0,event.shiftKey?-1:1);$('rg-grid-viewport').focus();}else if(event.key==='Enter'&&!event.altKey){event.preventDefault();commitEditor();if(!event.ctrlKey&&!event.metaKey)move(event.shiftKey?-1:1,0);$('rg-grid-viewport').focus();}});
  $('rg-grid-table').addEventListener('mousedown',event=>{const current=session;if(!current||event.button!==0||current.transition)return;const cell=event.target.closest('td[data-row][data-column]'),column=event.target.closest('th[data-column]'),row=event.target.closest('th[data-row-number]');if(!cell&&!column&&!row&&!event.target.closest('[data-corner]'))return;commitEditor();if(current.formulaDirty)commitFormula();event.preventDefault();if(cell){select(Number(cell.dataset.row),Number(cell.dataset.column),event.shiftKey);dragging=true;}else if(column){const c=Number(column.dataset.column);current.active={row:current.window.row,column:c};current.selection={r1:1,c1:c,r2:sheet(current).rowCount,c2:c};draw();}else if(row){const r=Number(row.dataset.rowNumber);current.active={row:r,column:current.window.column};current.selection={r1:r,c1:1,r2:r,c2:sheet(current).columnCount};draw();}else{current.selection={r1:1,c1:1,r2:sheet(current).rowCount,c2:sheet(current).columnCount};draw();}$('rg-grid-viewport').focus({preventScroll:true});});
  $('rg-grid-table').addEventListener('mousemove',event=>{if(!dragging||!session)return;const cell=event.target.closest('td[data-row][data-column]');if(cell){session.selection.r2=Number(cell.dataset.row);session.selection.c2=Number(cell.dataset.column);paintSelection();}});window.addEventListener('mouseup',()=>dragging=false);$('rg-grid-table').addEventListener('dblclick',event=>{if(event.target.closest('td[data-row][data-column]'))beginEdit();});

  $('rg-grid-viewport').addEventListener('keydown',event=>{const current=session;if(!current||current.transition)return;const ctrl=event.ctrlKey||event.metaKey,k=event.key.toLowerCase();if(ctrl&&k==='c'){event.preventDefault();copySelection();return;}if(ctrl&&k==='z'){event.preventDefault();undo(event.shiftKey);return;}if(ctrl&&k==='y'){event.preventDefault();undo(true);return;}if(ctrl&&k==='a'){event.preventDefault();current.selection={r1:1,c1:1,r2:sheet(current).rowCount,c2:sheet(current).columnCount};draw();return;}if(event.key==='ArrowDown'||event.key==='ArrowUp'||event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();move(event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0,event.key==='ArrowRight'?1:event.key==='ArrowLeft'?-1:0,event.shiftKey);return;}if(event.key==='Tab'||event.key==='Enter'){event.preventDefault();move(event.key==='Enter'?(event.shiftKey?-1:1):0,event.key==='Tab'?(event.shiftKey?-1:1):0);return;}if(event.key==='F2'){event.preventDefault();beginEdit();return;}if(event.key==='Delete'||event.key==='Backspace'){event.preventDefault();const area=rect(current);if(area.rows*area.columns>MAX_WRITE){hint('Для очистки выделите до '+MAX_WRITE+' ячеек.');return;}queueRange(area.row,area.column,Array.from({length:area.rows},()=>Array(area.columns).fill('')));return;}if(!ctrl&&!event.altKey&&event.key.length===1){event.preventDefault();beginEdit(true,event.key);}});
  panel.addEventListener('keydown',event=>{if(event.key!=='Tab'||event.defaultPrevented)return;const nodes=Array.from(panel.querySelectorAll('button,a[href],input,textarea,[tabindex="0"]')).filter(node=>!node.disabled&&node.getClientRects().length),first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}});
