<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id),panel=$('rg-grid-panel');
  const ROW_HEIGHT=28,COLUMN_WIDTH=120,ROW_GUTTER=52,WINDOW_ROWS=80,WINDOW_COLUMNS=50,MAX_READ=5000,MAX_WRITE=5000;
  let session=null,generation=0,dragging=false;
  function gridColumnName(value){let text='';for(let n=value;n>0;n=Math.floor((n-1)/26))text=String.fromCharCode(65+(n-1)%26)+text;return text;}
  function gridAddress(row,column){return gridColumnName(column)+row;}
  function gridParseAddress(value){const found=String(value||'').trim().match(/^\$?([A-Za-z]{1,4})\$?([1-9]\d*)$/);if(!found)return null;let column=0;for(const letter of found[1].toUpperCase())column=column*26+letter.charCodeAt(0)-64;const row=Number(found[2]);return Number.isSafeInteger(row)&&Number.isSafeInteger(column)?{row,column}:null;}
  function gridText(value){return value===null||value===undefined?'':String(value);}
  function gridEncodeTsv(values){return values.map(row=>row.map(value=>{const text=gridText(value);return /[\t\n\r"]/.test(text)?'"'+text.replace(/"/g,'""')+'"':text;}).join('\t')).join('\n');}
  function gridParseTsv(value){const text=String(value||'').replace(/\r\n?/g,'\n'),rows=[],row=[];let cell='',quoted=false,start=true;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(ch==='"')quoted=false;else cell+=ch;continue;}if(ch==='"'&&start){quoted=true;start=false;}else if(ch==='\t'){row.push(cell);cell='';start=true;}else if(ch==='\n'){row.push(cell);rows.push(row.splice(0));cell='';start=true;}else{cell+=ch;start=false;}}if(quoted)throw new Error('Не закрыты кавычки в скопированном диапазоне.');row.push(cell);rows.push(row);if(text.endsWith('\n')&&rows.length>1&&rows[rows.length-1].length===1&&rows[rows.length-1][0]==='')rows.pop();const width=Math.max(1,...rows.map(item=>item.length));return rows.map(item=>Array.from({length:width},(_,i)=>item[i]??''));}
  function gridFailure(error){const message=String(error?.message||error||'Не удалось выполнить действие.'),match=message.match(/\[([A-Z_]+)\]\s*([\s\S]*)/);return{code:match?.[1]||'ERROR',message:match?.[2]||message};}
  function key(row,column){return row+':'+column;}
  function alive(current){return !!current&&session===current&&current.epoch===generation;}
  function sheet(current=session){return current?.book?.sheets?.find(item=>String(item.id)===String(current.sheetId));}
  function rect(current=session){const selection=current?.selection||{r1:1,c1:1,r2:1,c2:1};return{row:Math.min(selection.r1,selection.r2),column:Math.min(selection.c1,selection.c2),rows:Math.abs(selection.r1-selection.r2)+1,columns:Math.abs(selection.c1-selection.c2)+1};}
  function dirtyEditor(){return !!session&&(!$('rg-grid-editor').hidden&&$('rg-grid-editor').value!==session.editorBefore||session.formulaDirty);}
  function hasPending(){return !!session&&(!!session.inFlight||!!session.failed||session.queue.length>0||session.dirty.size>0||dirtyEditor()||session.contactBusy||session.validationBusy);}
  function notify(current=session){if(!alive(current))return;update();try{window.dispatchEvent(new CustomEvent('registry-grid-state',{detail:{open:true,pending:hasPending()}}));}catch(ignored){}}
  function hint(text){$('rg-grid-hint').textContent=text||'';}
  function rpc(current,method,payload,canDispatch){const next=current.rpcTail.catch(()=>{}).then(()=>{if(!alive(current))throw new Error('[GRID_CLOSED] Таблица закрыта.');if(canDispatch&&!canDispatch())return null;return current.transport(method,payload,canDispatch);});current.rpcTail=next.then(()=>{},()=>{});return next;}
  function effective(row,column,current=session){const id=key(row,column),draft=current?.dirty.get(id),cell=current?.cache.get(id);return draft?draft.value:cell?.input??'';}
  function cellDisplay(row,column,current=session){const draft=current?.dirty.get(key(row,column));return draft?draft.value:current?.cache.get(key(row,column))?.display??'';}
  function setError(error,current=session){if(!alive(current))return;current.error=gridFailure(error);notify(current);settle(current);}
  function editAllowed(){return !!session&&session.book?.canEdit===true&&!session.transition&&!!sheet()&&session.cache.has(key(session.active.row,session.active.column));}
  function update(){
    const current=session;if(!current||!panel)return;
    if(current.closeAfterOperation&&!current.contactBusy&&!current.validationBusy&&!current.transition){
      current.closeAfterOperation=false;

    $('rg-grid-new-contacts').disabled=readonly||current.contactBusy||current.validationBusy||current.transition||!current.book||current.workspace?.canSync===false;
    $('rg-grid-new-contacts').textContent=current.contactBusy?'Проверяем новые…':'Проверить новые контакты';
    $('rg-grid-contact-retry').disabled=current.contactBusy;
    $('rg-grid-readonly').hidden=!current.book||!readonly;
    $('rg-grid-error').hidden=!error;$('rg-grid-error-text').textContent=error?error.message+(current.dirty.size||dirtyEditor()?' Несохранённые значения остаются в редакторе.':' Перечитайте текущее состояние таблицы.'):'';$('rg-grid-discard').textContent=current.failed?.kind==='append'?'Проверить текущее состояние таблицы':'Отменить несохранённые правки и перечитать';
    $('rg-grid-retry').hidden=!current.failed||error?.code==='GRID_CONFLICT';$('rg-grid-retry').disabled=!!current.inFlight;
    $('rg-grid-discard').disabled=!!current.inFlight;$('rg-grid-copy-draft').disabled=!current.dirty.size;
    $('rg-grid-reload').disabled=pending||!!current.inFlight||current.transition;
    $('rg-grid-undo').disabled=readonly||pending||current.transition||!current.undo.length;
    $('rg-grid-redo').disabled=readonly||pending||current.transition||!current.redo.length;
    $('rg-grid-add-rows').disabled=readonly||pending||current.transition||!current.book;
    $('rg-grid-add-columns').disabled=readonly||pending||current.transition||!current.book;
    $('rg-grid-formula').disabled=readonly||current.transition||!current.cache.has(key(current.active.row,current.active.column));
    $('rg-grid-address').disabled=!current.book||current.transition;
    for(const tab of $('rg-grid-tabs').querySelectorAll('button'))tab.disabled=current.transition;
    if(!current.formulaFocused){$('rg-grid-formula').value=effective(current.active.row,current.active.column,current);current.formulaDirty=false;}
    if(document.activeElement!==$('rg-grid-address'))$('rg-grid-address').value=gridAddress(current.active.row,current.active.column);
    const selected=rect(current),meta=sheet(current);$('rg-grid-position').textContent=meta?selected.rows+' × '+selected.columns+' · '+meta.rowCount+' строк':'';
    $('rg-grid-viewport').setAttribute('aria-rowcount',String(meta?.rowCount||0));$('rg-grid-viewport').setAttribute('aria-colcount',String(meta?.columnCount||0));
    $('rg-grid-viewport').setAttribute('aria-activedescendant','rg-cell-'+current.active.row+'-'+current.active.column);
  }
  function renderTabs(){const current=session,list=$('rg-grid-tabs');list.replaceChildren();if(!current?.book)return;for(const item of current.book.sheets){const button=document.createElement('button');button.type='button';button.className='rg-grid-tab';button.dataset.sheetId=String(item.id);button.textContent=gridText(item.name);button.setAttribute('role','tab');button.setAttribute('aria-selected',String(String(item.id)===String(current.sheetId)));button.addEventListener('click',()=>switchSheet(item.id));list.append(button);}}
  function paintSelection(){const current=session;if(!current)return;const area=rect(current);for(const td of $('rg-grid-body').querySelectorAll('td[data-row][data-column]')){const r=Number(td.dataset.row),c=Number(td.dataset.column),selected=r>=area.row&&r<area.row+area.rows&&c>=area.column&&c<area.column+area.columns;td.classList.toggle('rg-grid-selected',selected);td.classList.toggle('rg-grid-active',r===current.active.row&&c===current.active.column);td.setAttribute('aria-selected',String(selected));}for(const th of $('rg-grid-head').querySelectorAll('th[data-column]'))th.classList.toggle('rg-grid-axis-active',Number(th.dataset.column)===current.active.column);for(const th of $('rg-grid-body').querySelectorAll('th[data-row-number]'))th.classList.toggle('rg-grid-axis-active',Number(th.dataset.rowNumber)===current.active.row);update();}
  function draw(){
    const current=session,meta=sheet(current);if(!current||!meta)return;
    const top=current.window.row,left=current.window.column,rows=Math.min(WINDOW_ROWS,meta.rowCount-top+1),columns=Math.min(WINDOW_COLUMNS,meta.columnCount-left+1),right=Math.max(0,meta.columnCount-left-columns+1),before=Math.max(0,left-1);
    const colgroup=$('rg-grid-colgroup');colgroup.replaceChildren();const addCol=width=>{const col=document.createElement('col');col.style.width=width+'px';colgroup.append(col);};addCol(ROW_GUTTER);if(before)addCol(before*COLUMN_WIDTH);for(let i=0;i<columns;i++)addCol(COLUMN_WIDTH);if(right)addCol(right*COLUMN_WIDTH);
    const head=$('rg-grid-head'),body=$('rg-grid-body'),header=document.createElement('tr'),corner=document.createElement('th');head.replaceChildren();body.replaceChildren();corner.className='rg-grid-corner';corner.scope='col';corner.setAttribute('aria-label','Выделить лист');corner.dataset.corner='true';header.append(corner);
    const spacerCell=(tag,width)=>{const item=document.createElement(tag);item.className='rg-grid-spacer';item.style.width=width+'px';item.setAttribute('aria-hidden','true');return item;};if(before)header.append(spacerCell('th',before*COLUMN_WIDTH));
    for(let c=left;c<left+columns;c++){const th=document.createElement('th');th.scope='col';th.textContent=gridColumnName(c);th.dataset.column=String(c);if(c===current.active.column)th.className='rg-grid-axis-active';header.append(th);}if(right)header.append(spacerCell('th',right*COLUMN_WIDTH));head.append(header);
    const span=1+columns+(before?1:0)+(right?1:0),vertical=height=>{if(!height)return;const tr=document.createElement('tr'),td=document.createElement('td');td.className='rg-grid-spacer';td.colSpan=span;td.style.height=height+'px';td.setAttribute('aria-hidden','true');tr.append(td);body.append(tr);};vertical((top-1)*ROW_HEIGHT);
    const selection=rect(current);
    for(let r=top;r<top+rows;r++){const tr=document.createElement('tr'),th=document.createElement('th');tr.dataset.row=String(r);th.scope='row';th.className='rg-grid-row-number'+(r===current.active.row?' rg-grid-axis-active':'');th.textContent=String(r);th.dataset.rowNumber=String(r);tr.append(th);if(before)tr.append(spacerCell('td',before*COLUMN_WIDTH));
      for(let c=left;c<left+columns;c++){const td=document.createElement('td'),value=document.createElement('div'),id=key(r,c);td.id='rg-cell-'+r+'-'+c;td.className='rg-grid-cell';td.dataset.row=String(r);td.dataset.column=String(c);td.setAttribute('role','gridcell');td.setAttribute('aria-rowindex',String(r));td.setAttribute('aria-colindex',String(c));const selected=r>=selection.row&&r<selection.row+selection.rows&&c>=selection.column&&c<selection.column+selection.columns;td.setAttribute('aria-selected',String(selected));if(selected)td.classList.add('rg-grid-selected');if(r===current.active.row&&c===current.active.column)td.classList.add('rg-grid-active');if(current.dirty.has(id))td.classList.add('rg-grid-dirty');value.className='rg-grid-cell-content';value.textContent=cellDisplay(r,c,current);td.append(value);tr.append(td);}if(right)tr.append(spacerCell('td',right*COLUMN_WIDTH));body.append(tr);}
    vertical(Math.max(0,meta.rowCount-top-rows+1)*ROW_HEIGHT);$('rg-grid-table').style.width=(ROW_GUTTER+meta.columnCount*COLUMN_WIDTH)+'px';update();
  }
  function mergeRange(current,data){
    if(!alive(current)||String(data.sheetId??current.sheetId)!==String(current.sheetId))return;
    const values=data.values||[],inputs=data.inputs||values,versions=data.versions||[];
    for(let r=0;r<values.length;r++)for(let c=0;c<values[r].length;c++){const id=key((data.row||1)+r,(data.column||1)+c);current.cache.set(id,{display:gridText(values[r][c]),input:gridText(inputs[r]?.[c]),version:versions[r]?.[c]});}
    const meta=sheet(current);if(Number.isSafeInteger(data.totalRows)&&data.totalRows>0)meta.rowCount=data.totalRows;if(Number.isSafeInteger(data.totalColumns)&&data.totalColumns>0)meta.columnCount=data.totalColumns;
    if(current.cache.size>25000){for(const id of current.cache.keys()){const [r,c]=id.split(':').map(Number);if(!current.dirty.has(id)&&(r<current.window.row||r>=current.window.row+WINDOW_ROWS||c<current.window.column||c>=current.window.column+WINDOW_COLUMNS))current.cache.delete(id);if(current.cache.size<=20000)break;}}
  }
  async function loadWindow(row,column,options={}){
    const current=session,meta=sheet(current);if(!current||!meta)return;
    row=Math.max(1,Math.min(row,meta.rowCount));column=Math.max(1,Math.min(column,meta.columnCount));
    current.window={row,column};const request=++current.loadSequence,sheetId=current.sheetId,height=Math.min(WINDOW_ROWS,meta.rowCount-row+1),width=Math.min(WINDOW_COLUMNS,meta.columnCount-column+1);let cached=true;for(let r=0;r<height&&cached;r++)for(let c=0;c<width;c++)if(!current.cache.has(key(row+r,column+c))){cached=false;break;}if(cached){current.loading=false;draw();if(options.focus)$('rg-grid-viewport').focus({preventScroll:true});return;}current.loading=true;draw();
    try{const data=await rpc(current,'getGridRange',{id:current.id,sheetId,row,column,rowCount:Math.min(WINDOW_ROWS,meta.rowCount-row+1),columnCount:Math.min(WINDOW_COLUMNS,meta.columnCount-column+1)},()=>alive(current)&&request===current.loadSequence&&String(current.sheetId)===String(sheetId));if(!data||!alive(current)||request!==current.loadSequence||String(current.sheetId)!==String(sheetId))return;mergeRange(current,data);current.loading=false;draw();if(options.focus)$('rg-grid-viewport').focus({preventScroll:true});}
    catch(error){if(alive(current)&&request===current.loadSequence){current.loading=false;setError(error,current);}}
  }
  function contactProgress(current,message,error=false){if(!alive(current))return;current.contactMessage=message||'';current.contactError=error;const box=$('rg-grid-contact-progress');box.hidden=!message;box.dataset.error=String(error);$('rg-grid-contact-message').textContent=message;$('rg-grid-contact-retry').hidden=!current.contactFailed;update();}
  async function loadContactWorkspace(current){if(current.workspacePending)return current.workspacePending;const pending=(async()=>{try{if(!alive(current))return;const workspace=await current.transport('getContactWorkspace',{id:current.id});if(alive(current)){current.workspace=workspace;current.workspaceLoaded=true;current.workspaceError=null;update();}}catch(error){if(alive(current)){current.workspaceLoaded=true;current.workspaceError=gridFailure(error);update();}}})();current.workspacePending=pending;try{await pending;}finally{if(current.workspacePending===pending)current.workspacePending=null;}}
  function sourceSheet(current,id){return (current.workspace?.sourceSheetIds||[]).some(value=>String(value)===String(id));}
  function scheduleContactSync(current,sheetId){if(!alive(current)||current.workspaceLoaded&&!sourceSheet(current,sheetId))return;current.contactDirty=true;clearTimeout(current.contactTimer);current.contactTimer=setTimeout(async()=>{current.contactTimer=null;if(!alive(current)||!current.contactDirty)return;if(current.contactBusy||current.transition||hasPending()||current.loading){scheduleContactSync(current,sheetId);return;}if(!current.workspaceLoaded)await loadContactWorkspace(current);if(!alive(current))return;if(!sourceSheet(current,sheetId)){current.contactDirty=false;return;}runContactSync(true);},2000);}
  function contactSummary(counts){return 'Добавлено: '+Number(counts?.addedEmail||0)+' email, '+Number(counts?.addedPhone||0)+' телефонов, '+Number(counts?.addedTelegram||0)+' Telegram. Уже проверенные контакты сохранены.';}
  async function contactCall(current,method,payload){current.contactStep={method,payload};return rpc(current,method,payload);}
  async function runContactSync(automatic=false,retry=false){
    const current=session;if(!current||current.contactBusy||current.validationBusy||current.transition||current.book?.canEdit!==true)return;
    if(automatic&&(current.error||current.contactFailed))return;retry=retry||current.contactFailed;
    clearTimeout(current.contactTimer);current.contactTimer=null;current.contactBusy=true;current.contactFailed=false;current.contactError=false;contactProgress(current,'Сохраняем изменения перед проверкой новых контактов…');
    try{
      await flush(current);if(!alive(current))return;current.transition=true;notify(current);
      if(!current.workspace)await loadContactWorkspace(current);if(!alive(current))return;
      if(!current.workspace)throw new Error(current.workspaceError?.message||'Не удалось определить исходные листы. Повторите проверку.');

      if(retry&&current.contactStep){data=await contactCall(current,current.contactStep.method,current.contactStep.payload);}
      else{
        current.contactDirty=false;current.contactRequestId=requestId();current.contactStep=null;
        if(current.workspace.role==='segment-companies'){
          contactProgress(current,'Обновляем связанные записи ЛПР, в том числе без контактов…');
          data=await contactCall(current,'syncSegmentPeople',{companyFileId:current.id,requestId:current.contactRequestId});
          while(alive(current)&&data?.state==='processing'){current.contactRequestId=data.requestId||current.contactRequestId;contactProgress(current,data.progress?.label||'Дополняем таблицу ЛПР…');await new Promise(resolve=>setTimeout(resolve,450));data=await contactCall(current,'continueSegmentRecords',{segmentId:data.segment?.id||current.workspace.segmentId,jobId:data.jobId,requestId:current.contactRequestId});}
        }
        contactProgress(current,'Ищем новые email, телефоны и Telegram в исходных листах…');
        data=await contactCall(current,'syncWorkbookContacts',{id:current.id,requestId:current.contactRequestId});
      }
      // A retry resumes precisely the failed mutation, with its original UUID.
      if(['syncSegmentPeople','continueSegmentRecords'].includes(current.contactStep?.method)){
        while(alive(current)&&data?.state==='processing'){current.contactRequestId=data.requestId||current.contactRequestId;contactProgress(current,data.progress?.label||'Дополняем таблицу ЛПР…');await new Promise(resolve=>setTimeout(resolve,450));data=await contactCall(current,'continueSegmentRecords',{segmentId:data.segment?.id||current.workspace.segmentId,jobId:data.jobId,requestId:current.contactRequestId});}
        data=await contactCall(current,'syncWorkbookContacts',{id:current.id,requestId:current.contactRequestId});
      }
      while(alive(current)&&data?.state==='processing'){current.contactRequestId=data.requestId||current.contactRequestId;contactProgress(current,data.progress?.label||'Добавляем только новые контакты…');await new Promise(resolve=>setTimeout(resolve,450));data=await contactCall(current,'continueContactSync',{id:current.id,jobId:data.jobId,requestId:current.contactRequestId});}
      if(!alive(current))return;current.contactStep=null;current.contactFailed=false;current.contactResult=data;if(data?.sourceChanged)current.contactDirty=true;
      let completionMessage=contactSummary(data?.counts)+(data?.warnings?.length?' '+data.warnings.join(' '):'');

      // avoids a second full provider scan while the extraction button is busy.
      try{const queued=data?.validation;current.validation=queued&&typeof queued.configured==='boolean'&&typeof queued.enabled==='boolean'?queued:await rpc(current,'getValidationState',{id:current.id});if(!alive(current))return;current.validationMessage=null;if(current.validation.configured===false)completionMessage+=' Для API-проверки подключите Promouser в разделе «Валидация».';else if(current.validation.enabled===true&&current.validation.state==='pending')completionMessage+=' Предпросмотр и ручной запуск новых проверок — в разделе «Валидация».';if(current.validation.enabled===true&&validationPollDelay(current.validation,Date.now())!==null){$('rg-grid-validation').hidden=false;if(!current.providerSettings)$('rg-grid-provider-settings').open=false;$('rg-grid-provider-form').inert=!current.providerSettings;}renderValidation(current);scheduleValidationPoll(current);}catch(error){if(alive(current)){current.validationMessage=gridFailure(error).message;renderValidation(current);}}
      if(!alive(current))return;contactProgress(current,'Контакты сохранены. Обновляем листы…');current.cache.clear();current.committed.clear();current.undo=[];current.redo=[];await refreshBook(current);if(alive(current))await loadWindow(current.window.row,current.window.column);if(alive(current))contactProgress(current,completionMessage);

    }catch(error){if(alive(current)){const failure=gridFailure(error);if(['CONTACT_SOURCE_CHANGED','CONTACT_SYNC_JOB_MISSING','SEGMENT_PREVIEW_CHANGED','SEGMENT_PREVIEW_EXPIRED','SEGMENT_JOB_MISSING','SEGMENT_JOB_EXPIRED'].includes(failure.code)){current.contactStep=null;current.workspace=null;}current.contactFailed=!!current.contactStep;contactProgress(current,failure.message+(current.contactFailed?' Продолжение использует тот же запрос и не создаёт повторную проверку.':' Нажмите «Проверить новые контакты», чтобы перечитать данные.'),true);}}
    finally{if(alive(current)){current.contactBusy=false;current.transition=false;notify(current);if(current.contactDirty&&!current.contactFailed)scheduleContactSync(current,(current.workspace?.sourceSheetIds||[])[0]);}}
  }
  function validationTime(value){if(typeof value==='number')return value<1e12?value*1000:value;const parsed=Date.parse(String(value||''));return Number.isFinite(parsed)?parsed:0;}
  function renderValidation(current=session){
    if(!alive(current))return;const data=current.validation,list=$('rg-grid-validation-jobs');list.replaceChildren();
    $('rg-grid-validation-summary').textContent=current.validationMessage||(data?(data.configured===false?'Подключите Promouser ниже. Новые контакты уже разнесены по листам.':'В очереди: '+Number(data.counts?.queued||0)+' · В работе: '+Number(data.counts?.processing||0)+' · Проверено: '+Number(data.counts?.checked||0)+' · Ручная проверка: '+Number(data.counts?.review||0)):'Загружаем состояние проверки…');

  $('rg-grid-table').addEventListener('mousedown',event=>{const current=session;if(!current||event.button!==0||current.transition)return;const cell=event.target.closest('td[data-row][data-column]'),column=event.target.closest('th[data-column]'),row=event.target.closest('th[data-row-number]');if(!cell&&!column&&!row&&!event.target.closest('[data-corner]'))return;commitEditor();if(current.formulaDirty)commitFormula();event.preventDefault();if(cell){select(Number(cell.dataset.row),Number(cell.dataset.column),event.shiftKey);dragging=true;}else if(column){const c=Number(column.dataset.column);current.active={row:current.window.row,column:c};current.selection={r1:1,c1:c,r2:sheet(current).rowCount,c2:c};draw();}else if(row){const r=Number(row.dataset.rowNumber);current.active={row:r,column:current.window.column};current.selection={r1:r,c1:1,r2:r,c2:sheet(current).columnCount};draw();}else{current.selection={r1:1,c1:1,r2:sheet(current).rowCount,c2:sheet(current).columnCount};draw();}$('rg-grid-viewport').focus({preventScroll:true});});
  $('rg-grid-table').addEventListener('mousemove',event=>{if(!dragging||!session)return;const cell=event.target.closest('td[data-row][data-column]');if(cell){session.selection.r2=Number(cell.dataset.row);session.selection.c2=Number(cell.dataset.column);paintSelection();}});window.addEventListener('mouseup',()=>dragging=false);$('rg-grid-table').addEventListener('dblclick',event=>{if(event.target.closest('td[data-row][data-column]'))beginEdit();});
  $('rg-grid-viewport').addEventListener('scroll',()=>{const current=session;if(!current||!current.book)return;commitEditor();clearTimeout(current.scrollTimer);current.scrollTimer=setTimeout(()=>{if(!alive(current))return;const view=$('rg-grid-viewport'),meta=sheet(current),row=Math.max(1,Math.min(Math.floor(view.scrollTop/ROW_HEIGHT)+1,meta.rowCount)),column=Math.max(1,Math.min(Math.floor(view.scrollLeft/COLUMN_WIDTH)+1,meta.columnCount));if(row!==current.window.row||column!==current.window.column)loadWindow(row,column);},70);});
  $('rg-grid-viewport').addEventListener('paste',event=>{if(!session)return;event.preventDefault();paste(event.clipboardData?.getData('text/plain')||'');});
  $('rg-grid-viewport').addEventListener('keydown',event=>{const current=session;if(!current||current.transition)return;const ctrl=event.ctrlKey||event.metaKey,k=event.key.toLowerCase();if(ctrl&&k==='c'){event.preventDefault();copySelection();return;}if(ctrl&&k==='z'){event.preventDefault();undo(event.shiftKey);return;}if(ctrl&&k==='y'){event.preventDefault();undo(true);return;}if(ctrl&&k==='a'){event.preventDefault();current.selection={r1:1,c1:1,r2:sheet(current).rowCount,c2:sheet(current).columnCount};draw();return;}if(event.key==='ArrowDown'||event.key==='ArrowUp'||event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();move(event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0,event.key==='ArrowRight'?1:event.key==='ArrowLeft'?-1:0,event.shiftKey);return;}if(event.key==='Tab'||event.key==='Enter'){event.preventDefault();move(event.key==='Enter'?(event.shiftKey?-1:1):0,event.key==='Tab'?(event.shiftKey?-1:1):0);return;}if(event.key==='F2'){event.preventDefault();beginEdit();return;}if(event.key==='Delete'||event.key==='Backspace'){event.preventDefault();const area=rect(current);if(area.rows*area.columns>MAX_WRITE){hint('Для очистки выделите до '+MAX_WRITE+' ячеек.');return;}queueRange(area.row,area.column,Array.from({length:area.rows},()=>Array(area.columns).fill('')));return;}if(!ctrl&&!event.altKey&&event.key.length===1){event.preventDefault();beginEdit(true,event.key);}});
  panel.addEventListener('keydown',event=>{if(event.key!=='Tab'||event.defaultPrevented)return;const nodes=Array.from(panel.querySelectorAll('button,a[href],input,textarea,[tabindex="0"]')).filter(node=>!node.disabled&&node.getClientRects().length),first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}});
  window.addEventListener('beforeunload',event=>{if(hasPending()){event.preventDefault();event.returnValue='';}});
})();
</script>
