<script>
(() => {
  'use strict';
  const el=id=>document.getElementById('sc-'+id);
  const kinds={companies:'Компании',lpr:'ЛПР'},channels={email:'Email',telegram:'Telegram'};
  const count=value=>Number.isSafeInteger(value)?value.toLocaleString('ru-RU'):'—';
  const when=value=>value&&Number.isFinite(Date.parse(value))?new Date(value).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' МСК':'';
  // First pages live only in this authorized frame. clear() also runs on every project/key change.
  const firstPages=new Map(),pageLifetime=120000;
  const initialFilters=Object.freeze({channel:'all',owner:'all',queue:'all',query:'',offset:0});
  function pageParams(s){return {channel:s.channel,owner:s.owner,queue:s.queue,query:s.query,offset:s.offset,limit:60,prepared:true,...(s.offset?{revision:s.revision}:{})};}
  function firstPageRequest(id){return {segmentId:id,...pageParams(initialFilters)};}
  let config,current=null;
  function node(tag,text){const item=document.createElement(tag);item.textContent=text;return item;}
  function action(label,fn){const item=node('button',label);item.type='button';item.className='br-button';item.addEventListener('click',fn);return item;}
  function link(label,url){const item=node('a',label);item.href=url;item.target='_blank';item.rel='noopener noreferrer';return item;}
  function message(id,text){el(id).textContent=text||'';el(id).hidden=!text;}
  function alive(state){return state&&state===current&&!state.previewOnly&&!el('view').hidden&&config.active();}
  function run(state,method,params,guard){return config.rpc(method,{segmentId:state.id,...params},()=>alive(state)&&(!guard||guard()));}
  function clearWorkStatus(){
    const host=el('work-status');delete host.dataset.pendingFor;host.replaceChildren();
  }
  function resetView(){
    current=null;el('view').hidden=true;
    clearWorkStatus();
    window.dispatchEvent(new Event('segment-card-clear'));
    for(const id of ['project','title','warnings','queues','validation','coldy-status','campaigns','rows','status','files','sources','history','preview','origin-status','legacy-note','export-status'])el(id).replaceChildren();
  }
  function clear(){firstPages.clear();resetView();}
  function keepFirst(page){
    if(!page?.segmentId||!page.revision||!page.summary?.email||!page.summary?.telegram||page.offset!==0||!Array.isArray(page.rows))return;
    const saved=firstPages.get(page.segmentId);
    if(saved&&saved.at+pageLifetime>Date.now()&&saved.page.revision===page.revision&&!saved.page.preview&&page.preview)return;
    firstPages.delete(page.segmentId);
    firstPages.set(page.segmentId,{page,at:Date.now()});
    if(firstPages.size>12)firstPages.delete(firstPages.keys().next().value);
  }
  function acceptDashboard(data){
    const items=new Map((data.state==='ready'?data.items||[]:[]).map(item=>[item.id,item]));
    function scoped(id,page){
      const item=items.get(id);if(!item)return false;
      const files=new Set((item.files||[]).map(file=>file.id));
      return Object.values(page?.files||{}).every(file=>!file?.id||files.has(file.id));
    }
    if(current&&!scoped(current.id,current.data))resetView();
    for(const [id,saved] of firstPages)if(saved.at+pageLifetime<=Date.now()||!scoped(id,saved.page))firstPages.delete(id);
    for(const [id,page] of Object.entries(data.cardPreviews||{})){
      if(page?.preview!==true||page.segmentId!==id||!scoped(id,page))continue;
      keepFirst(page);
      if(current?.id===id&&alive(current)&&!current.data&&!current.offset&&!current.query&&current.channel==='all'&&current.owner==='all'&&current.queue==='all')restoreFirst(current);
    }
  }
  function restoreFirst(s){
    if(s.previewOnly||!defaultFilters(s))return;
    const saved=firstPages.get(s.id);
    if(!saved||saved.at+pageLifetime<=Date.now())return;
    s.data=saved.page;s.revision=s.data.revision;s.updated=saved.at;
    s.pages.set(pageKey(s),s.data);
    paintSummary(s);paintRows(s);
    if(alive(s))window.dispatchEvent(new Event('segment-card-update'));
  }
  function defaultFilters(s){return Object.keys(initialFilters).every(key=>initialFilters[key]===s[key]);}
  function privateActions(disabled){
    for(const id of ['add','prepare','coldy','origins','mailings','settings'])el(id).disabled=disabled;
  }
  function openState(id,name,project,firstRead,previewOnly){
    resetView();current={id,name,project,...initialFilters,firstRead,previewOnly,previous:[],seq:0,originSeq:0,coldSeq:0,
      panel:null,data:null,pages:new Map(),catalog:null,comparisons:new Map(),loading:false,exporting:false,updated:0};
    el('title').textContent=name;el('project').textContent=project;el('owner').value='all';el('query').value='';el('secondary').open=false;
    el('table-wrap').hidden=false;el('pages').hidden=true;el('export').disabled=true;
    for(const id of ['warnings','export-status','legacy-note'])el(id).hidden=true;
    privateActions(previewOnly);paintPanels(current);paintFilters(current);restoreFirst(current);
    if(!current.data)paintSummary(current);
    if(previewOnly)message('status','Проверяем доступ к контактам…');
  }
  function preview(id,name,project){
    if(current?.id===id&&current.previewOnly&&current.project===project)return;
    openState(id,name,project,null,true);
  }
  function select(id,name,project,firstRead){
    if(current?.id!==id){openState(id,name,project,firstRead,false);return;}
    if(!current.previewOnly)return;
    // Promote the existing form in place, including a query entered while Google was responding.
    const s=current;s.previewOnly=false;s.name=name;s.project=project;s.firstRead=firstRead;
    el('title').textContent=name;el('project').textContent=project;
    privateActions(false);message('status','Читаем контакты сегмента…');restoreFirst(s);
    if(!el('view').hidden)window.RegistrySegmentWorkStatus?.mount(el('work-status'),id);
  }
  el('secondary').addEventListener('toggle',()=>{
    if(el('secondary').open&&current&&!current.previewOnly)window.RegistrySegmentWorkStatus?.mount(el('work-status'),current.id);
  });
  function show(visible){
    const hidden=!visible||!current,opening=!hidden&&el('view').hidden;
    if(hidden&&!el('view').hidden&&current){
      current.seq++;current.originSeq++;current.coldSeq++;current.loading=false;current.exporting=false;current.scanning=false;
      if(current.panel==='coldy'||current.panel==='origins')current.panel=null;
      el('secondary').open=false;clearWorkStatus();
      window.dispatchEvent(new Event('segment-card-clear'));
    }
    if(!hidden&&el('view').hidden&&current.data&&current.updated+pageLifetime<=Date.now()){
      current.data=null;current.pages.clear();current.offset=0;current.previous=[];
      for(const id of ['rows','warnings','queues','validation','status','legacy-note'])el(id).replaceChildren();
      el('table-wrap').hidden=false;el('pages').hidden=true;el('export').disabled=true;paintSummary(current);
    }
    el('view').hidden=hidden;
    if(!hidden)paintPanels(current);
    if(opening){
      if(!current.previewOnly)window.RegistrySegmentWorkStatus?.mount(el('work-status'),current.id);
      window.dispatchEvent(new Event('segment-card-update'));
    }
  }
  function paintFilters(s){
    for(const item of el('view').querySelectorAll('[data-sc-channel]'))item.setAttribute('aria-pressed',String(item.dataset.scChannel===s.channel));
    el('owner').value=s.owner;
    el('query').value=s.query;el('export-hint').hidden=s.queue==='ready';
    for(const item of el('view').querySelectorAll('[data-sc-state]'))item.setAttribute('aria-pressed',String(item.dataset.scState===s.queue));
  }
  function paintPanels(s){
    for(const [id,panel] of [['prepare','prep'],['coldy','coldy'],['origins','origins']]){
      el(id).setAttribute('aria-expanded',String(s.panel===panel));el(panel+'-panel').hidden=s.panel!==panel;
    }
  }
  function paintSummary(s){
    const summary=s.data?.summary||{email:{},telegram:{}};
    message('warnings',(s.data?.warnings||[]).join(' '));el('queues').replaceChildren();el('validation').replaceChildren();
    const queues=[['all','Все контакты'],['email','Проверить новые email']];
    if(summary.email.toReview)queues.push(['emailReview','Разобрать проверенные email']);
    queues.push(['telegram','Проверить Telegram по мобильным']);
    if(summary.telegram.toReview)queues.push(['telegramReview','Ручная проверка Telegram']);
    if(summary.telegram.addressBook)queues.push(['telegramBook','Записная книжка']);
    queues.push(['ownership','Разобрать принадлежность']);
    for(const [queue,label] of queues){
      const item=action(label,()=>changeFilters({queue,channel:'all'}));
      item.dataset.scQueue=queue;item.setAttribute('aria-pressed',String(s.queue===queue));el('queues').append(item);
    }
    for(const [kind,file] of Object.entries(s.data?.files||{}))if(file?.id&&kinds[kind]){
      el('validation').append(action('Предпросмотр проверки · '+kinds[kind],()=>config.validate(file.id)));
    }
  }
  function paintRows(s){
    const body=el('rows'),fragment=document.createDocumentFragment();
    for(const row of s.data.rows){
      const tr=document.createElement('tr'),addr=node('td',row.value),owner=node('td',row.owners.map(k=>kinds[k]).filter(Boolean).join(' · '));
      addr.append(node('small',channels[row.channel]));if(row.ownerNames?.length)owner.append(node('small',row.ownerNames.join(', ')));
      if(row.sources?.length||s.data.prepared)owner.append(sourceDetails(s,row,s.data.offset+fragment.childNodes.length));
      const manual=node('td',row.manualStatuses.join(' · ')||'—'),readiness=node('td',row.readiness);
      if(row.validationStatuses.length)readiness.append(node('small',row.validationStatuses.join(' · ')));
      const events=node('td','');
      if(row.channel==='telegram')events.textContent='—';
      else if(row.channelFacts?.length)for(const fact of row.channelFacts){
        const entry=node('div',[fact.campaign,(fact.statuses||[]).join(' · ')].filter(Boolean).join(' — '));
        if(fact.checkedAt)entry.append(node('small','Сверка · '+when(fact.checkedAt)));events.append(entry);
      }
      else{events.textContent=row.coldyStatuses.join(' · ')||'Нет данных о событиях';if(row.campaigns.length)events.append(node('small',row.campaigns.join(' · ')));}
      tr.append(addr,owner,manual,readiness,events);fragment.append(tr);
    }
    body.replaceChildren(fragment);paintPageInfo(s);
  }
  function paintPageInfo(s){
    const {rows,nextOffset}=s.data;
    el('table-wrap').hidden=!rows.length;el('pages').hidden=!s.previous.length&&nextOffset==null;
    el('prev').disabled=!s.previous.length;el('next').disabled=nextOffset==null;
    const asOf=s.data.preparedAt||s.data.checkedAt;
    message('status',[rows.length?'':'Контакты по этому отбору отсутствуют.',asOf?(s.data.prepared?'Карточка собрана ':'Проверено ')+when(asOf):''].filter(Boolean).join(' '));
  }
  function sourceDetails(s,row,offset){
    const details=document.createElement('details'),summary=node('summary','Источники'),list=document.createElement('div');
    details.append(summary,list);
    function paint(sources){
      list.replaceChildren();
      for(const src of sources||[]){
        if(!/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[A-Za-z0-9_-]+(?:\/|$)/.test(src.url||''))continue;
        const origin=node('div','');origin.append(link(src.name,src.url));
        if(src.column||src.sourceRows)origin.append(node('small',[src.column,src.sourceRows&&'Строки '+src.sourceRows].filter(Boolean).join(' · ')));
        list.append(origin);
      }
      summary.textContent='Источники'+(list.children.length?' · '+count(list.children.length):'');
    }
    paint(row.sources);
    if(!s.data.prepared)return details;
    const page=s.data,filter={channel:s.channel,owner:s.owner,queue:s.queue,query:s.query,revision:page.revision,limit:1,offset};
    const status=node('small','');let loaded=false,loading=false;
    details.addEventListener('toggle',async()=>{
      const valid=()=>alive(s)&&s.data===page&&details.isConnected;
      if(!details.open||loading||loaded||!valid())return;
      loading=true;status.textContent='Проверяем исходные строки…';list.append(status);
      try{
        const full=await run(s,'getSegmentContactCard',filter,valid);
        if(!valid())return;
        const found=full?.rows?.[0];
        if(full.segmentId!==s.id||full.revision!==page.revision||found?.value!==row.value||found.channel!==row.channel)throw new Error('Карточка изменилась. Обновите её для проверки источников.');
        paint(found.sources);if(!list.childNodes.length)list.append(node('small','Исходные строки не указаны.'));
        loaded=true;
      }catch(error){
        if(!valid())return;
        const failure=config.error(error);
        if(discardRevoked(s,failure.code))message('status',failure.message);
        else status.textContent=failure.message;
      }
      finally{loading=false;}
    });
    return details;
  }
  function firstPage(s){s.offset=0;s.previous=[];}
  function pageKey(s){return JSON.stringify([s.channel,s.owner,s.queue,s.query,s.offset]);}
  function discardRevoked(s,code){
    if(!['OUTSIDE_PROJECT','OUTSIDE_SEGMENTS','OUTSIDE_REGISTRY','ACCESS_DENIED','NOT_FOUND','SEGMENT_NOT_FOUND','GRID_PROTECTED','SEGMENT_TARGET_CHANGED','SOURCE_CHANGED','COLDY_BINDING_CHANGED','COLDY_SCOPE_CHANGED','COLDY_CREDENTIAL_CHANGED'].includes(code))return false;
    firstPages.delete(s.id);s.pages.clear();s.data=null;s.catalog=null;s.comparisons.clear();s.originSeq++;s.coldSeq++;s.scanning=false;
    clearWorkStatus();
    for(const id of ['rows','warnings','queues','validation','sources','history','files','campaigns','coldy-status','preview','legacy-note'])el(id).replaceChildren();
    el('table-wrap').hidden=true;el('pages').hidden=true;el('export').disabled=true;
    window.dispatchEvent(new Event('segment-card-clear'));
    return true;
  }
  async function refresh(options={}){
    const s=current;if(!alive(s))return;
    if(s.exporting||options.opening&&s.loading||options.automatic&&(s.loading||s.panel||s.offset>0))return;
    if(options.opening&&!s.firstRead&&s.data&&!s.data.preview&&s.updated&&Date.now()-s.updated<15000){el('export').disabled=false;window.dispatchEvent(new Event('segment-card-update'));return;}
    const seq=++s.seq;const valid=()=>alive(s)&&s.seq===seq;
    s.loading=true;el('export').disabled=true;
    // A refresh of the visible page can finish after the user has already moved on.
    if(s.data?.offset!==s.offset){el('prev').disabled=true;el('next').disabled=true;}
    if(!s.data)message('status','Читаем контакты сегмента…');
    try{
      const firstRead=s.firstRead&&defaultFilters(s)?s.firstRead:null;
      s.firstRead=null;
      let response;
      if(firstRead){
        const result=await firstRead;
        if(result.error)throw result.error;
        response=result.page;
      }else response=await run(s,'getSegmentContactCard',pageParams(s),valid);
      if(!valid()||!response)return;
      if(response.segmentId!==s.id)throw new Error('Не удалось подтвердить сегмент.');
      if(s.revision&&s.revision!==response.revision){
        s.pages.clear();s.catalog=null;s.comparisons.clear();s.originSeq++;s.scanning=false;s.originFailed=false;s.previewId=null;
        message('legacy-note','');el('preview').replaceChildren();
      }
      const key=pageKey(s),previous=s.data;
      const unchanged=previous&&s.pages.get(key)===previous&&previous.revision===response.revision&&
        !!previous.preview===!!response.preview&&!!previous.prepared===!!response.prepared&&
        previous.total===response.total&&previous.rows.length===response.rows.length&&previous.nextOffset===response.nextOffset;
      if(unchanged){
        // Keep expanded sources and focused actions, including a source request in flight.
        previous.checkedAt=response.checkedAt;previous.preparedAt=response.preparedAt;
        paintPageInfo(s);
      }else{
        s.data=response;paintSummary(s);paintRows(s);
      }
      s.revision=response.revision;s.updated=Date.now();s.pages.set(key,s.data);
      if(s.pages.size>12)s.pages.delete(s.pages.keys().next().value);
      if(!s.offset&&s.channel==='all'&&s.owner==='all'&&s.queue==='all'&&!s.query)keepFirst(s.data);
      window.dispatchEvent(new Event('segment-card-update'));
      if(s.panel==='origins'){if(s.catalog)paintCatalog(s);else void discover(s);}
      else if(!response.summary.email.total&&!s.catalog&&!s.scanning&&!s.originFailed)void discover(s,true);
    }catch(error){
      if(!valid())return;
      const failure=config.error(error);
      discardRevoked(s,failure.code);
      if(s.offset&&failure.code==='SEGMENT_CARD_CHANGED'){firstPage(s);return refresh();}
      message('status',failure.message+' Обновите карточку, чтобы повторить.');
    }finally{if(valid()){s.loading=false;el('export').disabled=!s.data||s.exporting;}}
  }
  function changeFilters(changes){
    const s=current;
    if(s?.previewOnly&&!el('view').hidden){
      Object.assign(s,changes);paintFilters(s);return;
    }
    if(!alive(s))return;
    Object.assign(s,changes);firstPage(s);s.exporting=false;message('export-status','');
    s.data=s.pages.get(pageKey(s))||null;
    if(s.data){paintSummary(s);paintRows(s);}
    else{el('rows').replaceChildren();el('table-wrap').hidden=false;el('pages').hidden=true;}
    paintFilters(s);
    void refresh();
  }
  function dismiss(){
    const s=current;if(!alive(s)||!s.panel)return false;
    const trigger={prep:'prepare',coldy:'coldy',origins:'origins'}[s.panel];
    s.panel=null;paintPanels(s);
    const focus=el(trigger).closest('details:not([open])')?.querySelector('summary')||el(trigger);
    focus.focus({preventScroll:true});if(['email','telegram','ownership'].includes(s.queue))changeFilters({queue:'all'});return true;
  }
  function openPanel(panel){
    const s=current;if(!alive(s))return;
    if(s.panel===panel){dismiss();return;}
    if(['email','telegram','ownership'].includes(s.queue))changeFilters({queue:'all'});
    s.panel=panel;el('secondary').open=false;paintPanels(s);
    const title=el(panel+'-title');title.tabIndex=-1;title.focus({preventScroll:true});
    if(panel==='coldy'){el('coldy-title').scrollIntoView({block:'nearest'});void checkColdy(s);}
    if(panel==='origins'){if(s.catalog)paintCatalog(s);else void discover(s);}
  }
  async function checkColdy(s){
    const seq=++s.coldSeq,valid=()=>alive(s)&&s.coldSeq===seq&&s.panel==='coldy';
    el('campaigns').replaceChildren();message('coldy-status','Сверяем привязанные рассылки…');
    try{
      const service=await run(s,'refreshColdyMailings',{monitor:true},valid);
      if(!valid()||!service)return;
      for(const campaign of service.campaigns||[]){
        const item=node('li',campaign.name||campaign.id),detail=config.syncText(campaign.recipientSync);
        if(detail)item.append(node('p',detail));el('campaigns').append(item);
      }
      message('coldy-status',service.message||(!service.campaigns?.length?'В этом сегменте нет привязанных рассылок.':'Контактные статусы обновляет фоновая сверка листов Email.'));
      void refresh();
    }catch(error){if(valid())message('coldy-status',config.error(error).message);}
  }
  function paintLegacyNote(s){
    const sources=[...s.comparisons.values()].filter(p=>Object.values(p.channels||{}).some(c=>c.added>0));
    message('legacy-note',sources.length?'Есть данные в старой базе, в рабочую не перенесены. Откройте «Исходники и история импортов» для сравнения.':'');
  }
  async function discover(s,background=false){
    if(s.scanning)return;
    s.scanning=true;const seq=++s.originSeq,valid=()=>alive(s)&&seq===s.originSeq;
    message('origin-status','Получаем список исходников…');
    try{
      const data=await run(s,'getSegmentLegacyPreview',{},valid);if(!valid()||data?.segmentId!==s.id)return;
      s.catalog=data;s.originFailed=false;paintCatalog(s);
      if(background&&data.sources?.length&&!s.data?.summary.email.total){
        // Compare one candidate at a time. Stop once the empty working list is explained.
        for(const src of data.sources){
          if(!valid()||s.panel==='origins')break;
          const result=await run(s,'getSegmentLegacyPreview',{sourceId:src.id},valid);if(!valid())return;
          if(result?.segmentId===s.id&&result.preview?.source.id===src.id){
            s.comparisons.set(src.id,result.preview);paintLegacyNote(s);
            if(result.preview.channels.email.added>0){s.previewId=src.id;break;}
          }
        }
      }
    }catch(error){if(valid()){s.originFailed=true;message('origin-status',config.error(error).message);}}
    finally{if(valid())s.scanning=false;}
  }
  function paintCatalog(s){
    if(s.panel!=='origins')return;
    el('files').replaceChildren(link('Папка сегмента','https://drive.google.com/drive/folders/'+encodeURIComponent(s.id)));
    for(const [kind,file] of Object.entries(s.data?.files||{}))if(file?.id&&kinds[kind])el('files').append(link(kinds[kind],'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(file.id)+'/edit'));
    el('history').replaceChildren();el('sources').replaceChildren();
    for(const entry of s.catalog.history||[])el('history').append(node('li',[entry.name,kinds[entry.kind]||entry.kind,when(entry.updatedAt)].filter(Boolean).join(' · ')));
    if(!el('history').children.length)el('history').append(node('li','Записей о сохранённых импортах пока нет.'));
    message('origin-status',[s.catalog.sources?.length?'Сравнение с рабочими таблицами доступно до импорта.':'Старых исходников для сравнения не найдено.',...(s.catalog.warnings||[])].join(' '));
    for(const src of s.catalog.sources||[]){const line=node('div','');line.append(link(src.name,'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(src.id)+'/edit'),action('Сравнить с рабочими',()=>compare(s,src)));el('sources').append(line);}
    paintComparison(s.comparisons.get(s.previewId));
  }
  async function compare(s,source){
    const seq=++s.originSeq;const valid=()=>alive(s)&&s.originSeq===seq&&s.panel==='origins';
    s.scanning=false;s.previewId=source.id;el('preview').textContent='Сравниваем '+source.name+'…';
    try{
      const result=await run(s,'getSegmentLegacyPreview',{sourceId:source.id},valid);
      if(!valid()||result?.segmentId!==s.id||result.preview?.source.id!==source.id)return;
      s.comparisons.set(source.id,result.preview);paintLegacyNote(s);paintComparison(result.preview);
    }catch(error){if(valid())el('preview').textContent=config.error(error).message;}
  }
  function paintComparison(p){
    const area=el('preview');area.replaceChildren();if(!p)return;
    area.append(node('h3','Предпросмотр · '+p.source.name));
    for(const [key,c] of Object.entries(p.channels))area.append(node('p',channels[key]+' · новых '+count(c.added)+' · уже в сегменте '+count(c.existing)+' · повторов в исходнике '+count(c.duplicates)));
    const e=p.entities||{};
    area.append(node('p','Компаний '+count(e.companies)+' · ЛПР '+count(e.people)+' · дополнений '+count(e.additions)+' · спорных совпадений '+count(e.ambiguous)));
    if(!p.complete)area.append(node('p','Сравнение частичное.'));
    for(const warning of p.warnings||[])area.append(node('p',warning));
  }
  function csv(value,field){
    let safe=String(value??'');
    const address=field===1&&/^(?:\+\d{7,15}|@[A-Za-z0-9_]{1,32})$/.test(safe);
    if(!address&&(/^[\s\uFEFF]*[=+@-]|^[\t\r\n]/.test(safe)))safe="'"+safe;
    return '"'+safe.replaceAll('"','""')+'"';
  }
  async function download(){
    const s=current;if(!alive(s)||s.exporting||s.loading||!s.data)return;
    const filters=getFilters(),version=filters.revision,seq=s.seq,valid=()=>alive(s)&&s.seq===seq;
    s.exporting=true;el('export').disabled=true;message('export-status','Собираем контакты по текущему отбору…');
    try{
      const lines=[['Канал','Контакт','Принадлежность','Связанные записи','Ручной статус','Проверка','Готовность','События Coldy','Источники']],seen=new Set(),records=[];let offset=0;
      do{
        const page=await run(s,'getSegmentContactCard',{queue:filters.queue,channel:filters.channel,owner:filters.owner,query:filters.query,revision:version,offset,limit:200},valid);
        if(!valid()||!page)return;
        if(page.segmentId!==s.id||page.revision!==version||page.offset!==offset)throw new Error('Данные изменились во время выгрузки. Обновите карточку.');
        for(const row of page.rows){
          const key=row.channel+'|'+row.value;
          if(seen.has(key))continue;
          seen.add(key);records.push(row);lines.push([channels[row.channel],row.value,row.owners.map(k=>kinds[k]).join(', '),row.ownerNames.join(', '),row.manualStatuses.join(', '),row.validationStatuses.join(', '),row.readiness,row.coldyStatuses.join(', '),(row.sources||[]).map(src=>src.url).join(', ')]);
        }
        if(page.nextOffset!=null&&(!Number.isSafeInteger(page.nextOffset)||page.nextOffset<=offset))throw new Error('Не удалось получить следующую страницу.');
        offset=page.nextOffset;
      }while(offset!=null);
      if(lines.length===1){message('export-status','В выбранном отборе пока нет контактов.');return;}
      await window.RegistrySegmentSelections?.recordExport(filters,records);if(!valid())return;
      const blob=new Blob(['\uFEFF'+lines.map(row=>row.map(csv).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=s.name+' — '+(channels[s.channel]||'контакты')+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      message('export-status','Контактов в выгрузке · '+count(lines.length-1));
    }catch(error){if(valid())message('export-status',config.error(error).message);}
    finally{if(valid()){s.exporting=false;el('export').disabled=false;}}
  }
  function configure(options){
    config=options;el('add').onclick=()=>{if(alive(current))config.add(current.id);};el('prepare').onclick=()=>openPanel('prep');el('coldy').onclick=()=>openPanel('coldy');
    el('origins').onclick=()=>openPanel('origins');el('mailings').onclick=()=>{if(alive(current))config.mailings(current.id);};el('export').onclick=download;
    el('settings').onclick=()=>{if(alive(current))config.settings(current.id);};el('owner').onchange=()=>changeFilters({owner:el('owner').value});
    el('query').oninput=()=>{if(current?.previewOnly)current.query=el('query').value.trim();};
    el('search').onsubmit=event=>{event.preventDefault();changeFilters({query:el('query').value.trim()});};
    for(const item of el('view').querySelectorAll('[data-sc-channel]'))item.onclick=()=>changeFilters({channel:item.dataset.scChannel,queue:['ready','inCampaign'].includes(current.queue)?current.queue:'all'});
    for(const item of el('view').querySelectorAll('[data-sc-state]'))item.onclick=()=>changeFilters({queue:current.queue===item.dataset.scState?'all':item.dataset.scState});
    for(const item of el('view').querySelectorAll('[data-sc-dismiss]'))item.onclick=dismiss;
    el('prev').onclick=()=>{if(current.previous.length){current.offset=current.previous.pop();void refresh();}};
    el('next').onclick=()=>{if(current.data?.nextOffset!=null){current.previous.push(current.offset);current.offset=current.data.nextOffset;void refresh();}};
  }
  function getFilters(){
    const s=current;if(!alive(s)||!s.data)return null;
    return {segmentId:s.id,name:s.name,channel:s.channel,owner:s.owner,queue:s.queue,query:s.query,revision:s.data.revision};
  }
  function setFilters({channel='all',owner='all',queue='all',query=''}={}){
    if(!['all','email','telegram'].includes(channel)||!['all','companies','lpr'].includes(owner)||!['all','ready','inCampaign','email','emailReview','telegram','telegramReview','telegramBook','ownership'].includes(queue))return;
    changeFilters({channel,owner,queue,query:String(query).trim().slice(0,120)});
  }
  window.RegistrySegmentCard={configure,clear,acceptDashboard,firstPageRequest,preview,select,show,refresh,dismiss:()=>window.RegistrySegmentSelections?.dismiss?.()||dismiss(),id:()=>current?.id,getFilters,setFilters};
})();
</script>
