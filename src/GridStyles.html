<style>
#rg-grid-panel[hidden],#rg-grid-panel [hidden]{display:none!important}
#rg-grid-panel{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;background:#fff;color:#202124;font:13px Arial,sans-serif;min-width:0;overflow:hidden}
#rg-grid-panel *{box-sizing:border-box}
#rg-grid-panel button,#rg-grid-panel input,#rg-grid-panel textarea{font:inherit}
#rg-grid-panel .rg-grid-header{display:flex;align-items:center;gap:18px;padding:12px 18px;background:#f8fafd;min-height:74px;border-bottom:1px solid #e2e5e9;flex:none;min-width:0}
#rg-grid-panel .rg-grid-document{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
#rg-grid-panel .rg-grid-document-icon{display:grid;place-items:center;width:34px;height:42px;border-radius:5px;background:#188038;color:white;font-size:28px;flex:none}
#rg-grid-panel .rg-grid-document h1{font-size:18px;line-height:1.3;margin:0 0 5px;font-weight:400;letter-spacing:normal;overflow-wrap:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
#rg-grid-panel .rg-grid-document a{font-size:12px;color:#5f6368;text-decoration:none}
#rg-grid-panel .rg-grid-document a:hover{text-decoration:underline}
#rg-grid-panel .rg-grid-status{color:#5f6368;font-size:12px;max-width:260px;text-align:right;line-height:1.4}
#rg-grid-panel .rg-grid-status[data-state="error"],#rg-grid-panel .rg-grid-status[data-state="conflict"]{color:#b3261e}
#rg-grid-panel .rg-grid-status[data-state="saved"]{color:#188038}
#rg-grid-panel .rg-grid-button,#rg-grid-panel .rg-grid-icon-button{border:1px solid transparent;background:transparent;border-radius:5px;color:#3c4043;padding:7px 10px;cursor:pointer;white-space:nowrap;line-height:1.3}
#rg-grid-panel .rg-grid-button:hover,#rg-grid-panel .rg-grid-icon-button:hover{background:#e8eef7}
#rg-grid-panel .rg-grid-button:focus-visible,#rg-grid-panel .rg-grid-icon-button:focus-visible{outline:2px solid #1a73e8;outline-offset:-2px}
#rg-grid-panel button:disabled{color:#a0a4aa;cursor:default;background:transparent}
#rg-grid-panel .rg-grid-icon-button{font-size:23px;padding:2px 9px;min-width:35px}
#rg-grid-panel .rg-grid-toolbar{display:flex;gap:4px;align-items:center;padding:5px 14px;background:#edf2fa;border-bottom:1px solid #dadce0;min-height:42px;overflow-x:auto;flex:none}
#rg-grid-panel .rg-grid-toolbar-divider{height:22px;border-left:1px solid #d4d9e2;margin:0 5px;flex:none}
#rg-grid-panel .rg-grid-readonly{color:#7c5800;background:#fff0c2;padding:5px 8px;border-radius:4px;white-space:nowrap}
#rg-grid-panel .rg-grid-formula-bar{display:flex;align-items:center;height:33px;min-height:33px;border-bottom:1px solid #c7cacf;flex:none;min-width:0}
#rg-grid-panel .rg-grid-address-label{display:block;width:100px;flex:none;border-right:1px solid #dadce0}
#rg-grid-panel .rg-grid-address-label input{border:0;border-radius:0;width:100%;padding:7px 10px;text-align:center;outline:none;background:white}
#rg-grid-panel .rg-grid-fx{padding:0 14px;color:#7b8086;font-style:italic;font-size:17px;flex:none}
#rg-grid-panel .rg-grid-formula-bar>input{flex:1;min-width:0;border:0;border-radius:0;padding:7px 9px;background:white;color:#202124;outline:none}
#rg-grid-panel .rg-grid-formula-bar:focus-within{box-shadow:inset 0 -1px #1a73e8}
#rg-grid-panel .rg-grid-viewport{flex:1;min-height:70px;min-width:0;overflow:auto;position:relative;outline:none;overscroll-behavior:contain;background:#fff;scrollbar-gutter:stable}
#rg-grid-panel .rg-grid-table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;line-height:27px;user-select:none}
#rg-grid-panel .rg-grid-table th,#rg-grid-panel .rg-grid-table td{padding:0;border:0;border-right:1px solid #e2e5e9;border-bottom:1px solid #e2e5e9;height:28px;font-weight:400;overflow:hidden;vertical-align:top}
#rg-grid-panel .rg-grid-table thead{position:sticky;top:0;z-index:5}
#rg-grid-panel .rg-grid-table thead th{height:28px;background:#f0f2f4;color:#5f6368;text-align:center;border-color:#d4d7dc;cursor:pointer}
#rg-grid-panel .rg-grid-table th.rg-grid-corner{position:sticky;left:0;z-index:7;background:#e9edf1}
#rg-grid-panel .rg-grid-table th.rg-grid-row-number{position:sticky;left:0;z-index:3;background:#f0f2f4;text-align:center;color:#5f6368;cursor:pointer;border-color:#d4d7dc}
#rg-grid-panel .rg-grid-table td.rg-grid-cell{position:relative;background:#fff;cursor:cell}
#rg-grid-panel .rg-grid-cell-content{height:27px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:clip;color:#202124}
#rg-grid-panel .rg-grid-table .rg-grid-selected{background:#e8f0fe!important}
#rg-grid-panel .rg-grid-table td.rg-grid-active{box-shadow:inset 0 0 0 2px #1a73e8;z-index:2}
#rg-grid-panel .rg-grid-table td.rg-grid-dirty .rg-grid-cell-content:after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#1a73e8}
#rg-grid-panel .rg-grid-table .rg-grid-axis-active{background:#d3e3fd!important;color:#174ea6!important}
#rg-grid-panel .rg-grid-table .rg-grid-spacer{padding:0!important;border:0!important;background:#fff;pointer-events:none;line-height:0;font-size:0}
#rg-grid-panel .rg-grid-editor{position:absolute;z-index:15;margin:0;border:2px solid #1a73e8;border-radius:0;padding:4px;background:#fff;color:#202124;outline:none;resize:none;line-height:18px;font:13px Arial,sans-serif;box-shadow:0 2px 5px #0002}
#rg-grid-panel .rg-grid-footer{display:flex;align-items:center;gap:12px;min-height:42px;border-top:1px solid #dadce0;background:#f8fafd;padding:0 12px;flex:none;min-width:0}
#rg-grid-panel .rg-grid-tabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;flex:1;min-width:0;min-height:42px}
#rg-grid-panel .rg-grid-tab{border:0;border-radius:0;padding:10px 16px;background:transparent;color:#5f6368;white-space:nowrap;font-weight:500!important;cursor:pointer}
#rg-grid-panel .rg-grid-tab[aria-selected="true"]{background:#d3e3fd;color:#174ea6;border-bottom:3px solid #1a73e8;padding-bottom:7px}
#rg-grid-panel .rg-grid-position{font-size:11px;white-space:nowrap;color:#6b7077}
#rg-grid-panel .rg-grid-error{background:#fce8e6;color:#8c1d18;border-bottom:1px solid #f2b8b5;padding:8px 15px;flex:none;max-height:28vh;overflow:auto}
#rg-grid-panel .rg-grid-error p{margin:0 0 5px;line-height:1.5}
#rg-grid-panel .rg-grid-error-actions{display:flex;flex-wrap:wrap;gap:5px}
#rg-grid-panel .rg-grid-error .rg-grid-button{border-color:#dfb0ac;background:#fff7f6;color:#8c1d18;font-size:12px;white-space:normal}
#rg-grid-panel .rg-grid-hint{font-size:12px;background:#f8fafd;color:#5f6368;margin:0;padding:0 13px;line-height:23px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rg-grid-panel .rg-grid-hint:empty{display:none}
#rg-grid-panel .rg-grid-visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

#rg-grid-panel #rg-grid-address,#rg-grid-panel #rg-grid-formula{height:32px;min-height:0;max-width:100%;border:0;border-radius:0;padding:7px 10px;background:#fff;color:#202124;outline:none;font:inherit;line-height:18px}

@media(max-width:600px){
#rg-grid-panel .rg-grid-header{padding:8px;gap:5px;flex-wrap:wrap;min-height:68px}
#rg-grid-panel .rg-grid-header>.rg-grid-button{font-size:11px;padding:5px}
#rg-grid-panel .rg-grid-document{gap:6px}
#rg-grid-panel .rg-grid-document-icon{width:25px;height:33px;font-size:22px}
#rg-grid-panel .rg-grid-document h1{font-size:15px;max-width:52vw}
#rg-grid-panel .rg-grid-document a{font-size:10px}
#rg-grid-panel .rg-grid-status{width:100%;max-width:none;text-align:left;padding-left:3px;font-size:11px}
#rg-grid-panel .rg-grid-toolbar{padding:3px 4px}
#rg-grid-panel .rg-grid-toolbar .rg-grid-button{padding:6px;font-size:11px}
#rg-grid-panel .rg-grid-footer{padding:0 4px;gap:4px}
#rg-grid-panel .rg-grid-tab{padding:9px 10px}
#rg-grid-panel .rg-grid-position{display:none}
#rg-grid-panel .rg-grid-address-label{width:75px}
#rg-grid-panel .rg-grid-fx{padding:0 8px}
#rg-grid-panel .rg-grid-error{padding:7px}
#rg-grid-panel .rg-grid-error .rg-grid-button{font-size:11px}
}
</style>
