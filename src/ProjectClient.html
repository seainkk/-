<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id), views=new Set(['analytics','infrastructure']);
  let config=null, view=null, ready=false, accessEpoch=null, generation=0;
  let catalog=null,catalogLoading=false,catalogError='',catalogSequence=0,catalogLoadedAt=0,segmentId='';
  let infrastructure=null,infraLoading=false,infraError='',infraNotice='',infraSequence=0,infraLoadedAt=0,initialSyncAttempted=false;
  let mailboxPicker=null,infraSyncMode='';
  let recipientImport=null;
  const recipientRequests=new Map();
  const campaignPageSize=40;
  let campaignLimit=campaignPageSize;
  function resetCampaignSearch(){campaignLimit=campaignPageSize;$('pj-campaign-search').value='';}
  const contexts=new Map();
  const text=value=>value===undefined||value===null?'':String(value);
  const number=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0?new Intl.NumberFormat('ru-RU').format(value):'—';
  const failure=error=>{const message=text(error?.message||error||'Не удалось получить данные.');const match=message.match(/\[([A-Z_]+)\]\s*([\s\S]*)/);return {code:match?.[1]||'ERROR',message:match?.[2]||message};};
  const uuid=()=>globalThis.crypto?.randomUUID?.()||'project-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  const timestamp=value=>{if(!value)return '';const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString('ru-RU',{timeZone:'Europe/Moscow'}):'';};
  function currentContext(){return contexts.get(segmentId)||null;}
  function token(){return {generation,epoch:accessEpoch};}
  function alive(mark){return ready&&mark.generation===generation&&mark.epoch===accessEpoch;}
  function notify(){try{config?.onStateChange?.();}catch(ignored){}}
  function mutation(details){try{config?.onMutation?.(details);}catch(ignored){}}
  function health(id,message,error=false){const node=$(id);if(!node)return;node.textContent=message||'';node.dataset.error=String(error);}
  function node(tag,className,value){const element=document.createElement(tag);if(className)element.className=className;if(value!==undefined)element.textContent=text(value);return element;}
  function connection(configured,connected){return !configured?'Подключите API Coldy, чтобы получать рассылки и показатели проекта.':!connected?'Ключ Coldy сохранён. Проверьте подключение в настройках.':'';}
  function connectionBox(id,configured,connected){const box=$(id),message=connection(configured,connected);box.textContent=message;box.hidden=!message;}
  function metrics(id,values){const root=$(id);root.replaceChildren();for(const [label,value] of values){const group=node('div');group.append(node('dt','',label),node('dd','',number(value)));root.append(group);}}
  function badge(value){
    const labels={Active:['Активна','success'],Draft:['Черновик','neutral'],Completed:['Завершена','neutral'],Paused:['На паузе','warning'],
      active:['Подключена','success'],connected:['Подключена','success'],ready:['Готова','success'],enabled:['Подключена','success'],
      disabled:['Отключена','neutral'],paused:['На паузе','warning'],error:['Ошибка','error'],failed:['Ошибка','error']};
    const result=labels[value]||labels[text(value).toLowerCase()]||[value||'Неизвестно','neutral'],element=node('span','pj-badge',result[0]);element.dataset.tone=result[1];return element;
  }
  function selected(context){return context.draft||new Set((context.data?.campaigns||[]).filter(item=>item.selected).map(item=>item.id));}
  function dirty(context){if(!context?.data)return false;const draft=selected(context),saved=new Set((context.data.campaigns||[]).filter(item=>item.selected).map(item=>item.id));return draft.size!==saved.size||[...draft].some(id=>!saved.has(id));}
  function configure(options){config=options||{};render();}
  function clear(){
    closeMailboxPicker(true);
    closeRecipientImport();recipientImport=null;recipientRequests.clear();
    generation++;catalog=null;catalogLoading=false;catalogError='';catalogSequence++;catalogLoadedAt=0;segmentId='';contexts.clear();
    infrastructure=null;infraLoadedAt=0;infraLoading=false;infraError='';infraNotice='';infraSequence++;initialSyncAttempted=false;infraSyncMode='';
    scrub();
  }
  function lock(){ready=false;clear();view=null;render();}
  function invalidate(options={}){
    if(options.credentialsChanged){clear();}
    else{
      catalogLoadedAt=0;catalogSequence++;catalogLoading=false;catalogError='';
      for(const context of contexts.values()){context.loadedAt=0;if(context.data){delete context.data.configured;delete context.data.connected;}context.sequence++;context.loading=false;context.metricsLoading=false;}
      infraSequence++;infraLoadedAt=0;infraLoading=false;infraError='';
    }
    render();notify();
  }
  function show(next,options={}){
    if(options.epoch!==undefined&&options.epoch!==accessEpoch){clear();accessEpoch=options.epoch;}
    ready=options.ready===true;view=views.has(next)?next:null;
    if(view!=='infrastructure'||!ready)closeMailboxPicker();
    if(view!=='analytics'||!ready)closeRecipientImport();
    if(!ready){view=null;if(catalog||infrastructure||contexts.size)clear();}
    render();
  }
  async function invoke(method,payload,mark,canDispatch){
    if(!config?.transport||!alive(mark))throw new Error('Доступ закрыт.');
    const permitted=()=>alive(mark)&&(!canDispatch||canDispatch());
    if(!permitted())return null;
    const result=await config.transport(method,payload,permitted);
    if(!permitted())return null;
    return result;
  }
  async function loadCatalog(){
    if(!ready||catalogLoading)return;
    const mark=token(),sequence=++catalogSequence;
    if(!catalog&&view==='analytics'){
      const cached=config?.peekSegments?.();
      if(cached?.state==='ready'&&Array.isArray(cached.segments))catalog={state:'ready',source:cached.source,segments:cached.segments};
    }
    catalogLoading=true;catalogError='';render();notify();
    try{const data=await invoke('getProjectAnalytics',{},mark);if(!alive(mark)||sequence!==catalogSequence||!data)return;catalog=data;catalogLoadedAt=Date.now();
      if(segmentId&&!data.segments?.some(item=>item.id===segmentId)){segmentId='';resetCampaignSearch();}
    }catch(error){if(alive(mark)&&sequence===catalogSequence)catalogError=failure(error).message;}
    finally{if(alive(mark)&&sequence===catalogSequence){catalogLoading=false;render();notify();}}
  }
  async function loadSegment(id,options={}){
    if(!ready||!id)return;
    let context=contexts.get(id);if(!context){context={data:null,mailings:null,loading:false,error:'',message:'',draft:null,operation:null,sequence:0};contexts.set(id,context);}
    if(context.loading||context.metricsLoading||context.operation?.running||recipientImport?.open)return;
    const mark=token(),sequence=++context.sequence,current=()=>alive(mark)&&context.sequence===sequence;
    context.loading=true;context.error='';context.metricsError='';render();notify();
    async function loadMetrics(){
      if(!current())return;
      context.metricsLoading=true;
      try{
        let service;
        if(options.manual){
          service=await invoke('refreshColdyMailings',{segmentId:id},mark,current);
          if(current()&&service)mutation({kind:'metrics',segmentId:id});
        }else{
          const mailings=await invoke('getSegmentMailings',{segmentId:id},mark,current);
          service=mailings?.services?.find(item=>item.id==='coldy'||item.key==='coldy');
        }
        if(current()&&context.data?.configured!==false)context.mailings=service||null;
      }catch(error){if(current())context.metricsError=failure(error).message;}
      finally{if(current()){context.metricsLoading=false;render();notify();}}
    }
    // Let the actionable selection take the first available transport slot.
    const campaignsRead=invoke('getProjectAnalyticsCampaigns',{segmentId:id,...(options.manual?{refresh:true}:{})},mark,current);
    const metricsRead=!options.manual&&catalog?.coldy?.configured!==false?loadMetrics():null;
    try{
      const data=await campaignsRead;
      if(!current()||!data)return;
      const before=context.data;
      context.data=data;context.loadedAt=Date.now();
      // Rebase only the user's explicit delta. A teammate's new bindings are
      // preserved instead of silently becoming removals in an absolute draft.
      if(context.draft){
        const savedBefore=new Set((before?.campaigns||[]).filter(item=>item.selected).map(item=>item.id));
        const added=[...context.draft].filter(id=>!savedBefore.has(id)),removed=[...savedBefore].filter(id=>!context.draft.has(id));
        if(!added.length&&!removed.length)context.draft=null;
        else{const rebased=new Set(data.campaigns.filter(item=>item.selected).map(item=>item.id));for(const id of added)rebased.add(id);for(const id of removed)rebased.delete(id);context.draft=rebased;}
        if(context.draft){const known=new Set(data.campaigns.map(item=>item.id));for(const chosen of context.draft){if(!known.has(chosen)){const old=before?.campaigns?.find(item=>item.id===chosen);data.campaigns.push({id:chosen,name:old?.name||'Недоступная рассылка',selected:false,selectable:false,available:false,missing:true,removable:false,unavailableDraft:true,blockedReason:'Рассылка больше недоступна. Снимите её выбор перед сохранением.'});}}}
      }
      context.loading=false;render();notify();
      if(!data.configured)context.mailings=null;
      else if(!metricsRead)await loadMetrics();
    }catch(error){if(current())context.error=failure(error).message;}
    finally{if(current()){context.loading=false;render();notify();}}
    if(metricsRead)await metricsRead;
  }
  async function refresh(options={}){
    if(!ready||!view)return;
    if(view==='analytics'&&(recipientImport?.open||recipientImport?.running))return;
    const mark=token(),requestedView=view;
    if(view==='analytics'){
      if(options.automatic&&isEditing())return;
      if(!catalog||options.manual||catalogLoadedAt===0||!isEditing()&&Date.now()-catalogLoadedAt>=30000)await loadCatalog();
      if(!alive(mark)||view!==requestedView)return;
      if(ready&&view==='analytics'&&segmentId){const context=currentContext();if(!options.manual&&context?.data&&!context.error&&(isEditing()||Date.now()-(context.loadedAt||0)<30000)){render();return;}await loadSegment(segmentId,options);}
    }else{
      if(options.manual)return syncInfrastructure();
      if((options.opening||options.automatic)&&infrastructureFresh())return;
      return loadInfrastructure();
    }
  }
  function changeSelection(id,checked){
    const context=currentContext();if(!context?.data||context.operation||context.loading)return;
    if(!context.draft)context.draft=selected(context);
    if(checked)context.draft.add(id);else context.draft.delete(id);
    context.message='';render();notify();
  }
  // Store only the identifiers and acknowledged cursor. Addresses remain in Coldy and Sheets.
  function rememberRecipient(current){
    const step=current.request,key=current.key;
    if(step)recipientRequests.set(key,step);else recipientRequests.delete(key);
    try{if(step)sessionStorage.setItem(key,JSON.stringify(step));else sessionStorage.removeItem(key);}catch(ignored){}
  }
  function pendingRecipient(key){
    if(recipientRequests.has(key))return recipientRequests.get(key);
    try{
      const saved=JSON.parse(sessionStorage.getItem(key));
      if(saved&&['companies','lpr'].includes(saved.targetKind)&&typeof saved.requestId==='string'&&/^[A-Za-z0-9_-]{8,128}$/.test(saved.requestId)
          &&(saved.cursor===undefined||typeof saved.cursor==='string'))return {targetKind:saved.targetKind,requestId:saved.requestId,...(saved.cursor?{cursor:saved.cursor}:{})};
    }catch(ignored){}
    return null;
  }
  function openRecipientImport(binding,campaign){
    const context=currentContext();
    if(!ready||view!=='analytics'||!context?.data||context.loading||context.operation||dirty(context)||recipientImport?.running||
        binding.segmentId!==segmentId||!context.data.bindings.some(item=>item.id===binding.id&&item.campaignId===campaign.id))return;
    const key='registry-recipient-import:'+segmentId+':'+binding.id,request=pendingRecipient(key);
    recipientImport={segmentId,bindingId:binding.id,key,request,open:true,running:false,completed:false,
      message:request?'Есть подтверждённый запрос. Продолжите его для этой же таблицы.':'',error:false};
    $('pj-recipient-campaign').textContent=(context.data.segment?.name||'')+' · '+text(campaign.name);
    $('pj-recipient-target').value=request?.targetKind||'';
    renderRecipient();$('pj-recipient-dialog').showModal();notify();
  }
  function closeRecipientImport(){
    if(!recipientImport)return;
    recipientImport.open=false;
    if($('pj-recipient-dialog')?.open)$('pj-recipient-dialog').close();
    $('pj-recipient-campaign').textContent='';$('pj-recipient-target').value='';health('pj-recipient-health','');
    $('pj-recipient-sheet').hidden=true;$('pj-recipient-sheet').removeAttribute('href');
    if(!recipientImport.running)recipientImport=null;
    notify();
  }
  function renderRecipient(){
    const current=recipientImport;
    if(!current?.open)return;
    const target=$('pj-recipient-target'),confirm=$('pj-recipient-confirm');
    target.disabled=current.running||!!current.request||current.completed;
    confirm.hidden=current.completed;confirm.disabled=current.running||!target.value;
    confirm.textContent=current.running?'Переносим…':current.request?'Продолжить тот же запрос':'Заполнить вкладку Email';
    $('pj-recipient-close').textContent=current.request||current.completed?'Закрыть':'← Назад';
    $('pj-recipient-sheet').hidden=!current.sheetUrl;
    if(current.sheetUrl)$('pj-recipient-sheet').href=current.sheetUrl;
    health('pj-recipient-health',current.message,current.error);
  }
  async function syncRecipients(){
    const current=recipientImport,kind=$('pj-recipient-target').value;
    if(!current?.open||current.running||current.completed||view!=='analytics'||segmentId!==current.segmentId||!['companies','lpr'].includes(kind))return;
    if(!current.request)current.request={requestId:uuid(),targetKind:kind};
    if(kind!==current.request.targetKind)return;
    rememberRecipient(current);
    const mark=token(),step=current.request,seen=new Set();
    current.running=true;current.error=false;current.message='Получаем адресатов и историю из Coldy…';renderRecipient();notify();
    try{
      while(alive(mark)&&current.open&&recipientImport===current){
        const payload={segmentId:current.segmentId,bindingId:current.bindingId,...step};
        const result=await invoke('syncColdyRecipients',payload,mark,()=>current===recipientImport&&segmentId===current.segmentId);
        if(!alive(mark)||!result||current!==recipientImport)return;
        if(result.state==='complete'){
          current.completed=true;current.request=null;rememberRecipient(current);
          current.message='Перенос завершён. Обработано '+number(result.processed)+', добавлено '+number(result.added)+', обновлено '+number(result.updated)+'.';
          if(result.skipped>0)current.message+=' Пропущено '+number(result.skipped)+'.';
          if(result.excluded>0)current.message+=' Сохранено ручных исключений '+number(result.excluded)+'.';
          if(typeof result.fileId==='string'&&/^[A-Za-z0-9_-]{10,200}$/.test(result.fileId)&&Number.isSafeInteger(result.sheetId)&&result.sheetId>=0)
            current.sheetUrl='https://docs.google.com/spreadsheets/d/'+result.fileId+'/edit#gid='+result.sheetId;
          mutation({kind:'recipients',segmentId:current.segmentId});break;
        }
        if(result.state!=='processing'||typeof result.nextCursor!=='string'||!result.nextCursor||result.nextCursor===step.cursor||seen.has(result.nextCursor))
          throw new Error('Сервер не подтвердил следующую часть переноса.');
        seen.add(result.nextCursor);step.cursor=result.nextCursor;rememberRecipient(current);
        current.message='Обработано '+number(result.processed)+(Number.isSafeInteger(result.total)?' из '+number(result.total):'')+'.';renderRecipient();
      }
    }catch(error){
      if(alive(mark)&&current===recipientImport){current.error=true;current.message=failure(error).message+' Повторите тот же запрос.';}
    }finally{
      current.running=false;
      if(alive(mark)&&current===recipientImport){
        if(current.open)renderRecipient();else recipientImport=null;
        render();notify();
      }
    }
  }
  function setConfirmed(context,step,result){
    if(step.kind==='add'){
      const binding=result.binding,existing=context.data.bindings||[];
      if(!binding?.id||binding.segmentId!==step.segmentId||binding.campaignId!==step.campaignId)throw new Error('Сервер не подтвердил параметры связи.');
      context.data.bindings=existing.filter(item=>item.id!==binding.id);context.data.bindings.push(binding);
      const campaign=context.data.campaigns.find(item=>item.id===step.campaignId);
      if(campaign)Object.assign(campaign,{selected:true,bindingId:binding.id,ownerSegmentId:step.segmentId,selectable:true,removable:true});
    }else{
      if(result.removed!==true)throw new Error('Сервер не подтвердил удаление связи.');
      context.data.bindings=context.data.bindings.filter(item=>item.id!==step.bindingId);
      const campaign=context.data.campaigns.find(item=>item.id===step.campaignId);
      if(campaign)Object.assign(campaign,{selected:false,bindingId:null,ownerSegmentId:null,ownerSegmentName:null,selectable:campaign.available!==false,removable:false});
    }
  }
  async function saveSelection(retry=false){
    const context=currentContext();if(!context?.data||context.loading||context.operation?.running)return;
    const id=segmentId,mark=token();
    if(!context.operation){
      if(!dirty(context))return;
      const wanted=selected(context),steps=[];
      if(context.data.campaigns.some(campaign=>wanted.has(campaign.id)&&!campaign.selected&&!campaign.selectable)){context.error='Одна из выбранных рассылок стала недоступна для этого сегмента. Снимите её выбор перед сохранением.';render();return;}
      for(const campaign of context.data.campaigns){
        if(wanted.has(campaign.id)&&!campaign.selected&&campaign.selectable)steps.push({kind:'add',campaignId:campaign.id,segmentId:id,requestId:uuid()});
        else if(!wanted.has(campaign.id)&&campaign.selected&&campaign.bindingId)steps.push({kind:'remove',campaignId:campaign.id,bindingId:campaign.bindingId,segmentId:id,requestId:uuid()});
      }
      context.operation={steps,index:0,running:false,failed:false};
    }else if(!retry)return;
    const operation=context.operation;operation.running=true;operation.failed=false;context.error='';context.message='Сохраняем выбор…';context.sequence++;context.metricsLoading=false;render();notify();
    try{
      while(operation.index<operation.steps.length){
        const step=operation.steps[operation.index];
        const result=await invoke(step.kind==='add'?'saveColdyBinding':'removeColdyBinding',step.kind==='add'?{
          segmentId:id,campaignId:step.campaignId,includeCompanies:true,includeLpr:true,autoUpload:false,allowActive:false,preserveExisting:true,requestId:step.requestId,
        }:{segmentId:id,bindingId:step.bindingId,requestId:step.requestId},mark);
        if(!alive(mark)||context.operation!==operation||!result)return;
        setConfirmed(context,step,result);operation.index++;infraSequence++;infraLoadedAt=0;infraLoading=false;mutation({kind:'binding',segmentId:id});render();
      }
      context.operation=null;context.draft=null;context.mailings=null;context.message='Выбор рассылок сохранён.';
    }catch(error){if(alive(mark)&&context.operation===operation){operation.failed=true;context.message='Подтверждено изменений: '+operation.index+' из '+operation.steps.length+'.';context.error=failure(error).message+' Подтвердите результат кнопкой «Продолжить тот же запрос».';}}
    finally{if(alive(mark)){operation.running=false;render();notify();}}
    if(alive(mark)&&!context.operation)await loadSegment(id);
  }
  function infrastructureFresh(){
    const data=infrastructure;
    if(!data||!infraLoadedAt||Date.now()-infraLoadedAt>=30000||infraError||data.error||data.nextCursor||data.syncPaused||data.retryAfterMs>0)return false;
    if(!data.monitoring?.accountIds?.length)return true;
    return !data.stale&&!data.capacity?.stale&&Date.now()-Date.parse(data.capacity?.updatedAt)<300000;
  }
  async function loadInfrastructure(){
    if(!ready||infraLoading||mailboxPicker?.open)return;
    const mark=token(),sequence=++infraSequence;infraLoading=true;infraError='';infraNotice='';render();notify();
    let initial=false;
    try{const data=await invoke('getProjectInfrastructure',{},mark);if(!alive(mark)||sequence!==infraSequence||!data)return;infrastructure=data;infraLoadedAt=Date.now();
      initial=data.configured===true&&data.monitoring?.accountIds?.length>0&&!initialSyncAttempted&&!data.nextCursor&&!data.syncPaused&&!data.error&&!(data.retryAfterMs>0)&&(data.state==='not_synced'||data.stale===true||!data.capacity?.updatedAt||data.capacity.stale===true);
      if(initial)initialSyncAttempted=true;
    }catch(error){if(alive(mark)&&sequence===infraSequence)infraError=failure(error).message;}
    finally{if(alive(mark)&&sequence===infraSequence){infraLoading=false;render();notify();}}
    if(initial&&alive(mark)&&view==='infrastructure')await syncInfrastructure();
  }
  async function syncInfrastructure(continuation=false,diagnostics=false){
    if(!ready||infraLoading||mailboxPicker?.open||!infrastructure?.monitoring?.accountIds?.length)return;
    let cursor=continuation?infrastructure?.nextCursor:null;
    if(continuation&&!cursor)return;
    const mark=token(),sequence=++infraSequence;infraLoading=true;infraSyncMode=diagnostics?'diagnostics':'pool';infraError='';infraNotice='';initialSyncAttempted=true;render();notify();
    const seen=new Set();let previous=continuation?((infrastructure?.syncProgress||infrastructure?.detailProgress)?.completed??-1):-1;
    try{
      for(let batch=0;batch<1001;batch++){
        if(!alive(mark)||sequence!==infraSequence||view!=='infrastructure')break;
        if(cursor&&seen.has(cursor)){infraError='Синхронизация приостановлена: Coldy не подтвердил переход к следующей порции.';break;}
        if(cursor)seen.add(cursor);
        const data=await invoke('refreshProjectInfrastructure',cursor?{cursor}:diagnostics?{}:{includeCapacity:true},mark,()=>sequence===infraSequence&&view==='infrastructure');
        if(!alive(mark)||sequence!==infraSequence||!data)return;
        infrastructure=data;infraLoadedAt=Date.now();render();
        const next=data.nextCursor,completed=(data.syncProgress||data.detailProgress)?.completed;
        if(!next||view!=='infrastructure')break;
        if(data.syncPaused||data.error||data.state==='error'||data.retryAfterMs>0){infraError=data.error?.message||'Синхронизация приостановлена. Повторите продолжение позже.';break;}
        if(!Number.isFinite(completed)||completed<=previous||seen.has(next)||next===cursor){infraError='Синхронизация приостановлена: новые данные пока не подтверждены.';break;}
        previous=completed;cursor=next;
        if(batch===1000)infraError='Продолжите синхронизацию следующей порции.';
      }
    }
    catch(error){if(alive(mark)&&sequence===infraSequence)infraError=failure(error).message;}
    finally{if(alive(mark)&&sequence===infraSequence){infraLoading=false;render();notify();}}
  }
  function pickerAlive(current,mark){return alive(mark)&&mailboxPicker===current&&current.open&&view==='infrastructure';}
  function mailboxDirty(current=mailboxPicker){const ids=current?.data?.selection?.accountIds;if(!ids)return false;const saved=new Set(ids);return saved.size!==current.selected.size||[...saved].some(id=>!current.selected.has(id));}
  function closeMailboxPicker(hard=false){
    const current=mailboxPicker;if(current){current.open=false;current.sequence++;if(hard||!current.operation)mailboxPicker=null;}
    const dialog=$('pj-mailbox-dialog');if(dialog?.open)dialog.close();
    if($('pj-mailbox-rows')){$('pj-mailbox-rows').replaceChildren();$('pj-mailbox-search').value='';$('pj-mailbox-count').textContent='';$('pj-mailbox-shown').textContent='';health('pj-mailbox-health','');}
    notify();
  }
  async function openMailboxPicker(){
    if(!ready||view!=='infrastructure'||infraLoading||hasPending()||mailboxPicker?.open)return;
    const current=mailboxPicker||{data:null,selected:new Set(),query:'',limit:100,pending:null,error:'',conflict:false,operation:null,sequence:0};mailboxPicker=current;current.open=true;
    $('pj-mailbox-search').value=current.query;$('pj-mailbox-dialog').showModal();renderMailboxPicker();notify();
    if(!current.operation)await loadMailboxSelection(current);
  }
  async function loadMailboxSelection(current=mailboxPicker){

    const noMatches=$('pj-capacity-empty');noMatches.hidden=!accounts.length||!!rows.childElementCount;
    noMatches.textContent=noMatches.hidden?'':'В этой группе почт нет.';
    const schedules=$('pj-schedule-rows');schedules.replaceChildren();
    for(const campaign of campaignMap.values()){
      if(!visibleCampaigns.has(campaign.id))continue;
      const row=node('tr');row.id='pj-schedule-'+campaign.id;row.tabIndex=-1;
      const name=poolCell(row,'Рассылка и сегмент');name.append(node('span','pj-name',campaign.name),node('span','pj-cell-note',segmentLabel(campaign)));
      const status=poolCell(row,'Статус Coldy');status.append(badge(campaign.status));
      if(campaign.waitSchedule===true)status.append(node('span','pj-cell-note','Ожидает расписания'));
      renderCampaignSchedule(campaign,poolCell(row,'График отправок'));
      poolCell(row,'Плановое завершение',poolDate(campaign.endAt)||'Дата неизвестна');
      schedules.append(row);
    }
    if(!schedules.childElementCount){
      const message=capacity?.state==='ready'?'У выбранных почт нет активных рассылок.':'Состав активных рассылок пока неизвестен.';
      const row=node('tr'),cell=poolCell(row,'',message,'pj-unavailable');cell.colSpan=4;schedules.append(row);
    }
    const note=$('pj-infrastructure-note');
    note.textContent=capacity?.stale?'Показаны последние сохранённые сведения. Обновите данные из Coldy.':visibleCampaigns.size?'Окно без отправок рассчитано по графикам активных рассылок. Coldy не передаёт плановую дату завершения. До завершения кампаний почта остаётся занятой.':'';
    note.hidden=!note.textContent;
  }
  function renderMailboxDiagnostics(accounts){
    const rows=$('pj-diagnostic-rows');rows.replaceChildren();
    for(const account of accounts){
      const row=node('tr');row.dataset.account=text(account.id);const identity=node('td');identity.append(node('span','pj-name',account.email||account.name||'Ящик без адреса'));
      const detail=[account.name&&account.name!==account.email?account.name:'',account.provider||''].filter(Boolean).join(' · ');if(detail)identity.append(node('span','pj-cell-note',detail));
      if(account.tags?.length)identity.append(node('span','pj-cell-note',account.tags.join(', ')));
      if(account.updatedAt)identity.append(node('span','pj-cell-note',(account.stale?'Сохранено ранее · ':'Проверено · ')+poolDate(account.updatedAt)));
      row.append(identity);const status=node('td');status.append(badge(account.status));
      if(typeof account.warmup?.enabled==='boolean')status.append(node('span','pj-cell-note','Прогрев: '+(account.warmup.enabled?'включён':'выключен')));
      else if(account.warmup?.status)status.append(node('span','pj-cell-note','Прогрев: '+text(account.warmup.status)));
      if(typeof account.warmup?.sentToday==='number')status.append(node('span','pj-cell-note','Прогрев сегодня: '+number(account.warmup.sentToday)));
      row.append(status);
      for(const value of [account.sentTotal,account.sentToday,account.dailyLimit])row.append(node('td','',number(value)));
      const errors=node('td');if(account.errors?.length){errors.append(node('div','pj-account-error',account.errors.map(item=>typeof item==='string'?item:[item.code,item.message].filter(Boolean).join(': ')).join('\n')));}else errors.append(node('span','br-muted',account.errorCount===0?'Нет':account.errorCount!==null&&account.errorCount!==undefined?number(account.errorCount):'—'));row.append(errors);rows.append(row);
    }
  }
  function render(){
    if(!$('pj-analytics-view'))return;
    $('pj-analytics-view').hidden=!ready||view!=='analytics';$('pj-infrastructure-view').hidden=!ready||view!=='infrastructure';
    if(!ready){scrub();return;}
    if(view==='analytics')renderAnalytics();else if(view==='infrastructure')renderInfrastructure();
  }
  function scrub(){
    if(!$('pj-analytics-view'))return;
    for(const id of ['pj-campaign-rows','pj-account-rows','pj-diagnostic-rows','pj-schedule-rows','pj-analytics-totals','pj-infrastructure-totals'])$(id).replaceChildren();
    $('pj-infrastructure-diagnostics').open=false;$('pj-capacity-filter').value='';$('pj-capacity-empty').textContent='';
    resetCampaignSearch();$('pj-campaign-shown').textContent='';$('pj-campaign-more').hidden=true;
    $('pj-segment').replaceChildren(new Option('Выберите сегмент',''));
    for(const id of ['pj-analytics-health','pj-selection-health','pj-infrastructure-health','pj-analytics-updated','pj-infrastructure-updated','pj-diagnostics-health','pj-analytics-connection','pj-infrastructure-connection','pj-selection-count','pj-analytics-note','pj-infrastructure-note'])$(id).textContent='';
    $('pj-infrastructure-continue').hidden=true;
  }
  function hasPending(){return !!recipientImport?.running||!!mailboxPicker?.operation?.running||[...contexts.values()].some(context=>context.operation?.running);}
  function isEditing(){const context=currentContext();return view==='infrastructure'?!!mailboxPicker&&(mailboxPicker.open||!!mailboxPicker.operation):view==='analytics'&&!!context&&(dirty(context)||!!context.operation||!!recipientImport?.open);}
  function isLoading(){return view==='analytics'?catalogLoading||!!currentContext()?.loading||!!currentContext()?.metricsLoading||hasPending():view==='infrastructure'?infraLoading||!!mailboxPicker?.pending:false;}
  if($('pj-segment')){
    $('pj-campaign-search').addEventListener('input',()=>{campaignLimit=campaignPageSize;renderAnalytics();});
    $('pj-campaign-more').addEventListener('click',()=>{campaignLimit=Math.max(campaignLimit,$('pj-campaign-rows').rows.length)+campaignPageSize;renderAnalytics();});
    $('pj-segment').addEventListener('change',()=>{resetCampaignSearch();segmentId=$('pj-segment').value;render();notify();const context=currentContext();if(segmentId&&(!context?.data||context.error||context.metricsError||Date.now()-(context.loadedAt||0)>=30000))loadSegment(segmentId);});
    $('pj-recipient-target').addEventListener('change',renderRecipient);
    $('pj-recipient-confirm').addEventListener('click',syncRecipients);
    $('pj-recipient-close').addEventListener('click',closeRecipientImport);
    $('pj-recipient-dialog').addEventListener('cancel',event=>{event.preventDefault();closeRecipientImport();});
    $('pj-selection-save').addEventListener('click',()=>saveSelection());$('pj-selection-retry').addEventListener('click',()=>saveSelection(true));
    for(const id of ['pj-analytics-connect','pj-infrastructure-connect'])$(id).addEventListener('click',()=>config?.openConnection?.());
    $('pj-analytics-refresh').addEventListener('click',()=>refresh({manual:true}));
    $('pj-infrastructure-refresh').addEventListener('click',()=>syncInfrastructure());
    $('pj-diagnostics-refresh').addEventListener('click',()=>syncInfrastructure(!!infrastructure?.nextCursor&&infrastructure.poolOnly!==true,true));
    $('pj-capacity-filter').addEventListener('change',renderInfrastructure);
    $('pj-infrastructure-diagnostics').addEventListener('toggle',()=>{
      const details=$('pj-infrastructure-diagnostics');if(details.open&&ready&&view==='infrastructure')renderMailboxDiagnostics(infrastructure?.accounts||[]);
      else $('pj-diagnostic-rows').replaceChildren();
    });
    $('pj-infrastructure-continue').addEventListener('click',()=>syncInfrastructure(true));
    $('pj-infrastructure-select').addEventListener('click',()=>openMailboxPicker());
    $('pj-mailbox-cancel').addEventListener('click',()=>{closeMailboxPicker();render();});
    $('pj-mailbox-dialog').addEventListener('cancel',event=>{event.preventDefault();closeMailboxPicker();render();});
    $('pj-mailbox-search').addEventListener('input',()=>{if(!mailboxPicker||mailboxPicker.pending||mailboxPicker.operation)return;mailboxPicker.query=$('pj-mailbox-search').value.trim();mailboxPicker.limit=100;renderMailboxPicker();});
    $('pj-mailbox-more').addEventListener('click',()=>{if(!mailboxPicker)return;mailboxPicker.limit+=100;renderMailboxPicker();});
    $('pj-mailbox-clear').addEventListener('click',()=>{if(!mailboxPicker||mailboxPicker.pending||mailboxPicker.operation)return;mailboxPicker.selected.clear();renderMailboxPicker();notify();});
    $('pj-mailbox-inventory').addEventListener('click',()=>refreshMailboxInventory());
    $('pj-mailbox-save').addEventListener('click',()=>saveMailboxSelection());$('pj-mailbox-retry').addEventListener('click',()=>saveMailboxSelection(true));
    $('pj-mailbox-reload').addEventListener('click',()=>loadMailboxSelection());
  }
  window.RegistryProject={configure,show,refresh,lock,invalidate,hasPending,isLoading,isEditing};
})();
</script>
