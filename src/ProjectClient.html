<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id), views=new Set(['analytics','infrastructure']);
  let config=null, view=null, ready=false, preview=false, accessEpoch=null, generation=0;
  let catalog=null,catalogLoading=false,catalogError='',catalogSequence=0,catalogLoadedAt=0,catalogExpiryTimer=null,segmentId='';
  let lastCampaignCatalog=null,hintRevision=0,dashboardHintsAfter=0;
  let catalogOptionsKey=null,campaignRowsKey=null,capacityRowsKey=null,capacitySource=null,capacityFilter=null;
  let infrastructure=null,infraLoading=false,infraError='',infraNotice='',infraSequence=0,infraLoadedAt=0,initialSyncAttempted=false;
  let mailboxPicker=null,infraSyncMode='';
  const expandedSenders=new Set();
  let senderTimer=null,senderAttempt=0,senderView=null;
  let recipientImport=null;
  let syncSetupBusy=false,syncSetupMessage='';
  let forecastData=null,forecastError='',forecastBusy=false,forecastSequence=0;
  let forecastTimer=null,forecastCheckedAt=0,forecastRetryAt=0;
  let forecastArchive=null,forecastPreviewAttempt=0,forecastPreviewVersion=0;
  let historyReport=null,historyError='',historySequence=0,historyTimer=null,historyBusy=false,historyRetryAt=0,historyChecked=0;
  let todayFacts=null,todayBusy=false,todayEpoch=0,todayChecked=0,todayRetry=0,todayTimer=null,todayError='';
  let completionData=null,completionMessage='',completionNext=0,completionTimer=null,completionVersion=0,completionBusy=false;
  let completionTableKey=null;
  const recipientRequests=new Map();
  const campaignPageSize=40;
  const liveInterval=60000;
  let infraLastLiveAttempt=0;
  let campaignLimit=campaignPageSize;
  function resetCampaignSearch(){campaignLimit=campaignPageSize;$('pj-campaign-search').value='';}
  const contexts=new Map();
  const text=value=>value===undefined||value===null?'':String(value);
  const numberFormat=new Intl.NumberFormat('ru-RU');
  const number=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0?numberFormat.format(value):'—';
  const failure=error=>{const message=text(error?.message||error||'Не удалось получить данные.');const match=message.match(/\[([A-Z_]+)\]\s*([\s\S]*)/);return {code:match?.[1]||'ERROR',message:match?.[2]||message};};
  const uuid=()=>globalThis.crypto?.randomUUID?.()||'project-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  const timestamp=value=>{if(!value)return '';const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString('ru-RU',{timeZone:'Europe/Moscow'}):'';};
  function currentContext(){return contexts.get(segmentId)||null;}
  function token(){return {generation,epoch:accessEpoch};}
  function alive(mark){return ready&&mark.generation===generation&&mark.epoch===accessEpoch;}
  function notify(){try{config?.onStateChange?.();}catch(ignored){}}
  function mutation(details){
    if(details?.kind==='binding'||details?.kind==='monitoring'){
      resetTodayFacts();
      clearHistory();
      if(details.kind==='binding'){infrastructure=null;infraLoadedAt=0;}
      senderAttempt=0;resetForecast();resetCompletions();paintOpenSenders();queueSenderUpdate(true);
      if(view==='analytics')queueMicrotask(()=>loadSendingPeriod());
    }
    try{config?.onMutation?.(details);}catch(ignored){}
  }
  function health(id,message,error=false){const node=$(id);if(!node)return;node.textContent=message||'';node.dataset.error=String(error);}
  function node(tag,className,value){const element=document.createElement(tag);if(className)element.className=className;if(value!==undefined)element.textContent=text(value);return element;}
  function renderConnection(section,configured,connected){
    const button=$('pj-'+section+'-connect'),box=$('pj-'+section+'-connection');
    button.textContent=configured===false?'Подключить Coldy':'Настройки Coldy';button.disabled=!ready||hasPending();
    const message=configured===false?'Подключите API Coldy, чтобы получать рассылки и показатели проекта.':
      configured===true&&connected===false?'Ключ Coldy сохранён. Проверьте подключение в настройках.':'';
    box.textContent=message;box.hidden=!message;
  }
  function confirmConnection(connected){
    if(!ready||typeof connected!=='boolean')return;
    let changed=false;
    for(const data of [catalog?.coldy,infrastructure,...Array.from(contexts.values(),context=>context.data)])
      if(data?.configured===true&&data.connected!==connected){data.connected=connected;changed=true;}
    if(changed)render();
  }
  function metrics(id,values){const root=$(id);root.replaceChildren();for(const [label,value] of values){const group=node('div');group.append(node('dt','',label),node('dd','',number(value)));root.append(group);}}
  function badge(value){
    const labels={Active:['Активна','success'],Draft:['Черновик','neutral'],Completed:['Завершена','neutral'],Paused:['На паузе','warning'],
      active:['Подключена','success'],connected:['Подключена','success'],ready:['Готова','success'],enabled:['Подключена','success'],
      disabled:['Отключена','neutral'],paused:['На паузе','warning'],error:['Ошибка','error'],failed:['Ошибка','error']};
    const result=labels[value]||labels[text(value).toLowerCase()]||[value||'Неизвестно','neutral'],element=node('span','pj-badge',result[0]);element.dataset.tone=result[1];return element;
  }
  function selected(context){return context.draft||new Set((context.data?.campaigns||[]).filter(item=>item.selected).map(item=>item.id));}
  function dirty(context){if(!context?.data)return false;const draft=selected(context),saved=new Set((context.data.campaigns||[]).filter(item=>item.selected).map(item=>item.id));return draft.size!==saved.size||[...draft].some(id=>!saved.has(id));}
  function configure(options){config=options||{};render();}
  function discardCampaignHints(){
    lastCampaignCatalog=null;hintRevision++;dashboardHintsAfter=Date.now();
    for(const context of contexts.values())context.previewNames=null;
  }
  function knownCampaignNames(id){
    const dashboard=config?.peekSegments?.();
    const dashboardNames=dashboard?.loadedAt>dashboardHintsAfter?dashboard.segments?.find(segment=>segment.id===id)?.previewNames:null;
    if(lastCampaignCatalog?.segmentId===id&&Date.now()-lastCampaignCatalog.loadedAt<30000&&(!dashboardNames?.length||lastCampaignCatalog.loadedAt>=dashboard.loadedAt)){
      const names=[];
      for(const campaign of lastCampaignCatalog.campaigns){
        if(campaign.ownerSegmentId===id&&campaign.name)names.push(campaign.name);
        if(names.length===10)break;
      }
      return names;
    }
    return dashboardNames?.slice(0,10)||[];
  }
  function clear(){
    resetTodayFacts();
    clearHistory();resetSendingFilters();
    clearTimeout(catalogExpiryTimer);catalogExpiryTimer=null;
    expandedSenders.clear();clearTimeout(senderTimer);senderTimer=null;senderAttempt=0;senderView=null;
    resetForecast();
    resetCompletions();
    closeMailboxPicker(true);
    closeRecipientImport();recipientImport=null;recipientRequests.clear();
    syncSetupBusy=false;syncSetupMessage='';
    generation++;catalog=null;catalogLoading=false;catalogError='';catalogSequence++;catalogLoadedAt=0;segmentId='';contexts.clear();
    lastCampaignCatalog=null;hintRevision++;dashboardHintsAfter=0;
    infrastructure=null;infraLoadedAt=0;infraLastLiveAttempt=0;infraLoading=false;infraError='';infraNotice='';infraSequence++;initialSyncAttempted=false;infraSyncMode='';
    scrub();
  }
  function lock(){ready=false;preview=false;clear();view=null;render();}
  function invalidate(options={}){
    if(options.credentialsChanged){clear();}
    else{
      resetTodayFacts();
      clearHistory();
      resetForecast();
      resetCompletions();
      catalogLoadedAt=0;catalogSequence++;catalogLoading=false;catalogError='';
      for(const context of contexts.values()){context.loadedAt=0;if(context.data){delete context.data.configured;delete context.data.connected;}context.sequence++;context.loading=false;context.metricsLoading=false;context.searching=false;}
      infraSequence++;infraLoadedAt=0;infraLoading=false;infraError='';infrastructure=null;senderAttempt=0;
    }
    discardCampaignHints();
    render();notify();
  }
  function show(next,options={}){
    const previous=view,wasReady=ready,wasPreview=preview;
    const scopeChanged=options.epoch!==undefined&&options.epoch!==accessEpoch;
    if(scopeChanged||options.ready!==true&&(wasReady||wasPreview&&options.preview!==true)){ready=false;clear();}
    if(scopeChanged)accessEpoch=options.epoch;
    ready=options.ready===true;preview=!ready&&options.preview===true;
    view=(ready||preview)&&views.has(next)?next:null;
    if(previous==='analytics'&&view!==previous)stopSendingTimers();
    const directoryApplied=updateCatalogHint();
    if(view!=='infrastructure'&&mailboxPicker?.open)closeMailboxPicker();
    if((view!=='analytics'||!ready)&&recipientImport?.open)closeRecipientImport();
    if(directoryApplied||scopeChanged||view!==previous||wasReady!==ready||wasPreview!==preview)render();
    if(ready&&view==='analytics'&&(previous!==view||!wasReady))queueMicrotask(()=>loadSendingPeriod());
    if(ready&&!wasReady&&wasPreview&&!scopeChanged){
      if(view==='infrastructure'&&mailboxPicker?.open)void loadMailboxSelection();
      if(view==='analytics'&&segmentId&&catalog?.segments.some(item=>item.id===segmentId))void loadSegment(segmentId);
    }
    if(next!==senderView){
      senderView=next;
      // The host toggles the segment mailing view immediately after this callback.
      if(ready)queueMicrotask(()=>queueSenderUpdate(true));
    }
    if(ready&&(next==='mailings'||view==='analytics'||view!==previous&&completionCells().length))queueCompletions();
  }
  function updateCatalogHint(){
    if(view!=='analytics'||catalogError||catalog&&catalogExpiryTimer===null)return false;
    const known=config?.peekSegments?.(),previous=catalog;
    if(catalog&&known?.preview&&known.loadedAt===catalog.loadedAt&&known.expiresAt===catalog.expiresAt&&known.expiresAt>Date.now())return false;
    clearTimeout(catalogExpiryTimer);catalogExpiryTimer=null;
    catalog=known?.state==='ready'&&Array.isArray(known.segments)&&(known.preview?known.expiresAt>Date.now():ready)?known:null;
    if(!ready&&segmentId&&!catalog?.segments.some(item=>item.id===segmentId))segmentId='';
    if(catalog?.preview)catalogExpiryTimer=setTimeout(()=>{
      catalogExpiryTimer=null;
      if(catalog===known){catalog=null;if(!ready)segmentId='';render();}
    },known.expiresAt-Date.now());
    return catalog!==previous;
  }
  async function invoke(method,payload,mark,canDispatch){
    if(!config?.transport||!alive(mark))throw new Error('Доступ закрыт.');
    const permitted=()=>alive(mark)&&(!canDispatch||canDispatch());
    if(!permitted())return null;
    const result=await config.transport(method,payload,permitted);
    if(!permitted())return null;
    return result;
  }
  async function loadCatalog(){
    if(!ready||catalogLoading)return;
    const mark=token(),sequence=++catalogSequence;
    catalogLoading=true;catalogError='';render();notify();
    try{const data=await invoke('getProjectAnalytics',{},mark);if(!alive(mark)||sequence!==catalogSequence||!data)return;
      clearTimeout(catalogExpiryTimer);catalogExpiryTimer=null;catalog=data;catalogLoadedAt=Date.now();
      if(segmentId&&!data.segments?.some(item=>item.id===segmentId)){segmentId='';resetCampaignSearch();}
    }catch(error){if(alive(mark)&&sequence===catalogSequence){
      const problem=failure(error);
      if(/^(LINK_|OUTSIDE_|ACCESS_|SOURCE_CHANGED|NOT_FOUND)/.test(problem.code))clear();
      catalogError=problem.message;discardCampaignHints();
      if(sequence!==catalogSequence){render();notify();}
    }}
    finally{if(alive(mark)&&sequence===catalogSequence){catalogLoading=false;render();notify();}}
  }
  function segmentReadFailed(context,error,metricsOnly){
    const parsed=failure(error);
    context[metricsOnly?'metricsError':'error']=parsed.message;context.previewNames=null;
    if(/^(LINK_|OUTSIDE_|COLDY_(AUTH|FORBIDDEN|CREDENTIAL_CHANGED|SCOPE_CHANGED|BINDING_CHANGED|BINDING_MISSING)$|SOURCE_CHANGED$|SEGMENT_NOT_FOUND$)/.test(parsed.code)){
      discardCampaignHints();context.sequence++;context.loading=false;context.metricsLoading=false;
      context.data=null;context.draft=null;context.mailings=null;context.loadedAt=0;render();notify();
    }
  }
  async function loadSegment(id,options={}){
    if(!ready||!id)return;
    let context=contexts.get(id);if(!context){context={data:null,mailings:null,loading:false,error:'',message:'',draft:null,operation:null,sequence:0};contexts.set(id,context);}
    if(context.loading||context.metricsLoading||context.searching||context.operation?.running||recipientImport?.open)return;
    const mark=token(),sequence=++context.sequence,hintsAtStart=hintRevision,current=()=>alive(mark)&&context.sequence===sequence;
    context.previewNames=!context.data&&!catalogError?knownCampaignNames(id):null;
    context.loading=true;context.error='';context.metricsError='';render();notify();
    async function loadMetrics(){
      if(!current())return;
      context.metricsLoading=true;
      try{
        let service;
        if(options.manual){
          context.lastLiveAttempt=Date.now();
          service=await invoke('refreshColdyMailings',{segmentId:id},mark,current);
          if(current()&&service)mutation({kind:'metrics',segmentId:id});
        }else{
          const mailings=await invoke('getSegmentMailings',{segmentId:id},mark,current);
          service=mailings?.services?.find(item=>item.id==='coldy'||item.key==='coldy');
        }
        if(current()&&context.data?.configured!==false)context.mailings=service||null;
      }catch(error){if(current())segmentReadFailed(context,error,true);}
      finally{if(current()){context.metricsLoading=false;render();notify();}}
    }
    // Let the actionable selection take the first available transport slot.
    const campaignsRead=invoke('getProjectAnalyticsCampaigns',{segmentId:id,...(options.manual?{refresh:true}:{})},mark,current);
    const metricsRead=!options.manual&&catalog?.coldy?.configured!==false?loadMetrics():null;
    try{
      const data=await campaignsRead;
      if(!current()||!data)return;
      applyCampaignData(context,data);
      context.previewNames=null;
      if(hintsAtStart===hintRevision)lastCampaignCatalog=data.configured&&Array.isArray(data.campaigns)?{segmentId:id,campaigns:data.campaigns,loadedAt:context.loadedAt}:null;
      context.loading=false;render();notify();
      if(!data.configured)context.mailings=null;
      else if(!metricsRead)await loadMetrics();
    }catch(error){if(current())segmentReadFailed(context,error,false);}
    finally{if(current()){context.loading=false;render();notify();}}
    if(metricsRead)await metricsRead;
    if(!options.manual&&view==='analytics'&&id===segmentId&&current())await pollSelected();
  }
  function pollVisible(){return ready&&!document.hidden&&!isEditing()&&!hasPending()&&config?.canPoll?.()!==false;}
  function recentPoll(at){const age=Date.now()-at;return at>0&&age>=0&&age<liveInterval;}
  function reportVisible(){return view==='analytics'&&pollVisible();}
  function forecastVisible(){return reportVisible()&&$('pj-plan-period').value!=='history';}
  function todayVisible(){return forecastVisible()&&$('pj-plan-period').value==='today';}
  function historyVisible(){return ready&&view==='analytics'&&!document.hidden&&$('pj-plan-period').value==='history';}
  function stopSendingTimers(){
    clearTimeout(todayTimer);todayTimer=null;
    clearTimeout(forecastTimer);forecastTimer=null;
    pauseHistory();
  }
  function loadSendingPeriod(manual=false){
    if(historyVisible()){
      if(historyRetryAt>Date.now()){
        if(historyTimer===null)scheduleHistory(historyRetryAt-Date.now());
      }else if(manual||historyTimer===null)void readHistory(manual);
    }else if(forecastVisible()){
      void readForecast(manual||!!forecastData?.pending&&forecastTimer===null);
      if(todayVisible()){
        if(todayRetry>Date.now()){
          if(todayTimer===null)scheduleTodayFacts(todayRetry-Date.now());
        }else if(manual||todayTimer===null)void readTodayFacts(manual);
      }
      void preloadForecast();
    }else return;
    if(pollVisible()&&(!infraLoadedAt||!recentPoll(infraLoadedAt)))void loadInfrastructure();
  }
  function pauseForecast(){
    if(forecastTimer!==null)clearTimeout(forecastTimer);
    forecastTimer=null;forecastBusy=false;forecastSequence++;
  }
  function resetForecast(){
    pauseForecast();forecastData=null;forecastError='';forecastCheckedAt=0;forecastRetryAt=0;
    forecastArchive=null;forecastPreviewAttempt=0;forecastPreviewVersion++;
  }
  function currentForecastDay(){return new Date(Date.now()+10800000).toISOString().slice(0,10);}
  async function preloadForecast(){
    if(!forecastVisible()||forecastArchive?.day===currentForecastDay()||recentPoll(forecastPreviewAttempt))return;
    const mark=token(),version=forecastPreviewVersion;
    const valid=()=>alive(mark)&&version===forecastPreviewVersion&&forecastVisible();
    forecastPreviewAttempt=Date.now();
    try{
      const data=await invoke('getProjectForecastPreview',{},mark,valid);
      if(valid()&&data?.forecast&&data.generatedAt&&data.day===currentForecastDay()&&
        (!forecastData||forecastData.previewScope===data.previewScope)&&
        !(Date.parse(forecastArchive?.generatedAt)>=Date.parse(data.generatedAt))){
        forecastArchive=data;renderSendingReport();
      }
    }catch(ignored){/* The live calculation reports any error when the forecast is opened. */}
  }
  function scheduleForecast(delay){
    if(forecastTimer!==null)clearTimeout(forecastTimer);
    forecastTimer=setTimeout(()=>{forecastTimer=null;void readForecast(true);},delay);
  }
  async function readForecast(explicit=false){
    if(!forecastVisible()||forecastBusy)return;
    if(forecastPreviewAttempt&&new Date(forecastPreviewAttempt+10800000).toISOString().slice(0,10)!==currentForecastDay()){
      forecastPreviewAttempt=0;void preloadForecast();
    }
    if(Date.now()<forecastRetryAt){
      if(forecastData?.pending&&forecastTimer===null)scheduleForecast(forecastRetryAt-Date.now());
      return;
    }
    if(!explicit&&recentPoll(forecastCheckedAt))return;
    const mark=token(),sequence=++forecastSequence,previous=forecastData;
    const valid=()=>alive(mark)&&sequence===forecastSequence&&forecastVisible();
    if(forecastTimer!==null){clearTimeout(forecastTimer);forecastTimer=null;}
    forecastBusy=true;forecastError='';forecastCheckedAt=Date.now();renderSendingReport();
    try{
      const data=await invoke('getProjectSendingForecast',{},mark,valid);
      if(!data||!valid())return;
      if(!data.previewScope||data.previewScope!==forecastArchive?.previewScope)forecastArchive=null;
      if(data.forecast&&data.generatedAt&&data.day&&data.previewScope)
        forecastArchive={forecast:data.forecast,generatedAt:data.generatedAt,day:data.day,previewScope:data.previewScope};
      forecastData=data;forecastRetryAt=Date.now()+Math.max(0,Number(data.retryAfterMs)||0);
      if(data.pending&&data.state!=='error'&&data.state!=='not_configured'&&data.state!=='no_selection'){
        const unchanged=previous?.pending&&JSON.stringify(previous.progress||{})===JSON.stringify(data.progress||{});
        scheduleForecast(Math.max(unchanged?6000:1500,forecastRetryAt-Date.now()));
      }
    }catch(error){
      if(!valid())return;
      const problem=failure(error);
      if(/^(LINK_|OUTSIDE_|COLDY_(AUTH|FORBIDDEN|CREDENTIAL_CHANGED|MONITORING_CHANGED|SCOPE_CHANGED)|SOURCE_CHANGED)/.test(problem.code)){
        forecastData=null;forecastArchive=null;forecastPreviewVersion++;
      }
      forecastError=problem.message;
    }finally{if(alive(mark)&&sequence===forecastSequence){forecastBusy=false;if(!valid())forecastCheckedAt=0;if(view==='analytics')renderSendingReport();}}
  }
  const forecastReasons={
    previous_horizon:'Последний день нового периода выходит за даты прежнего расчёта. Он появится после обновления.',
    stale_membership:'Данные о назначениях ящиков требуют обновления.',
    missing_accounts:'Coldy подтвердил сведения только для части выбранных ящиков.',
    unknown_status:'Состояние части ящиков неизвестно.',
    missing_limit:'Для части ящиков неизвестен дневной лимит.',
    missing_schedule:'Неизвестно расписание части рассылок.',
    outside_campaigns:'Часть ящиков используется также в рассылках за пределами выбранного набора.',
    incomplete_demand:'Данные об очереди отправки получены частично.',
    unknown_sender:'Не удалось определить ящик отправителя для части очереди.',
    unknown_lead:'Неизвестно, продолжит ли часть получателей цепочку.',
    unknown_sequence:'Для части получателей неизвестен следующий шаг или срок отправки.',
    missing_gap:'Для части отправителей неизвестен интервал между письмами.',
    unknown_today:'Неизвестен доступный остаток отправок до полуночи.',
    model_limit:'Объём очереди превысил предел расчёта.'
  };
  function forecastDate(value){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return '—';
    const parts=value.split('-');return parts[2]+'.'+parts[1]+'.'+parts[0];
  }
  const completionReasons={
    incomplete:'Очередь отправок получена частично.',
    unavailable:'Coldy не подтвердил данные этой рассылки.',
    forbidden:'У текущего API-ключа нет доступа к этой рассылке (HTTP 403).',
    bad_request:'Coldy отклонил запрос данных этой рассылки.',
    verification:'Coldy не подтвердил валидность всех нужных контактов.',
    sequence:'Недостаточно сведений о шагах или паузах цепочки.',
    status:'Неизвестно состояние части отправок.',
    capacity:'Недостаточно данных о назначенных ящиках или их лимитах.',
    no_capacity:'При текущих лимитах или состоянии ящиков оставшиеся письма отправить не получится.',
    schedule:'Недостаточно данных о расписании отправок.',
    shared_capacity:'Неизвестна загрузка общих почтовых ящиков.',
    horizon:'Завершение за пределами периода расчёта.',
    no_contacts:'Нет подтверждённых валидных контактов.',
    no_sends:'Нет писем для отправки.',
    paused:'Отправки приостановлены.',
    not_active:'Рассылка не запущена.'
  };
  function paintCompletion(block){
    const record=completionData?.campaignCompletions?.[block.dataset.completionCampaign];
    block.replaceChildren();
    const date=record?.state==='estimated'?forecastDate(record.estimatedDate):'—';
    const previous=date==='—'&&record?.state==='unknown'?record.previousEstimate:null;
    const previousDate=forecastDate(previous?.date);
    const hasDate=date!=='—'||previousDate!=='—';
    const previousAt=timestamp(previous?.generatedAt);
    const notice=completionMessage||completionData?.message;
    let description;
    if(record?.state==='completed')description='Все письма отправлены';
    else if(block.dataset.providerStatus==='Completed')description='Рассылка завершена в Coldy';
    else if(date!=='—')description='Ориентировочно '+date;
    else if(previousDate!=='—')description='Предыдущая оценка '+previousDate;
    else if(record)description=completionReasons[record.reason]||'Пока нет оценки даты завершения.';
    else description=notice||(completionData&&!completionData.pending?'Для этой рассылки пока нет расчёта.':'Рассчитываем завершение…');
    block.append(node(hasDate||record?.state==='completed'?'strong':'span','pj-completion-date',description));
    const note=value=>block.append(node('small','pj-completion-count',value));
    if(record?.state==='completed'&&record.lastSentAt)note('Последнее письмо по валидным контактам: '+timestamp(record.lastSentAt)+' МСК');
    else if(record?.state==='completed')note('Для части отправок нет подтверждённого времени последнего письма.');
    else if(block.dataset.providerStatus==='Completed')note('Coldy не передал дату завершения.');
    if(previousDate!=='—'&&previousAt)note('Рассчитано '+previousAt+' МСК');
    if(hasDate&&(date!=='—'?record.reason:previous.reason)==='observed_pace')note('По фактическому темпу отправок этой рассылки.');
    if(date!=='—'&&record.reason==='from_tomorrow')note('Расчёт с завтрашнего дня, остаток отправок на сегодня неизвестен.');
    if(previousDate!=='—'&&completionReasons[record.reason])note(completionReasons[record.reason]);

  async function readCompletions(){

    const mark=token(),version=completionVersion;
    const valid=()=>alive(mark)&&version===completionVersion&&!document.hidden&&visible();
    const paint=()=>{

      completionCells().forEach(paintCompletion);paintOpenSenders();

      if(!completionData){
        const preview=await invoke('getProjectCampaignCompletions',{preview:true},mark,valid);
        if(!valid())return;

          if(Array.isArray(preview.campaigns)&&!preview.campaigns.length){completionNext=Date.now()+300000;return;}
          const wait=Math.max(Number(preview.freshForMs)||0,Number(preview.retryAfterMs)||0);
          if(wait>0){completionNext=Date.now()+wait;return;}

      if(completionData&&historyVisible()&&historyBusy){completionNext=Date.now()+2500;return;}
      const data=await invoke('getProjectCampaignCompletions',{},mark,valid);
      if(!valid()||!data)return;
      completionData=data;completionMessage='';
      const retry=Number(data.retryAfterMs)||0;
      completionNext=Date.now()+Math.max(data.pending?2500:300000,retry);
    }catch(error){

        const campaign=campaignMap.get(id);if(!campaign)continue;
        const group=node('div','pj-assignment');
        group.append(node('span','',campaign.name),node('small','',' · '+segmentLabel(campaign)),badge(campaign.status));assignments.append(group);
      }
      if(account.capacity?.outsideActive)assignments.append(node('div','pj-assignment','Занята в другой рассылке'));
      for(const id of account.capacity?.inactiveCampaignIds||[]){
        const campaign=inactiveMap.get(id);if(!campaign)continue;
        const group=node('div','pj-assignment');
        group.append(node('span','',campaign.name||'Название недоступно'),node('small','',' · '+segmentLabel(campaign)),badge(campaign.status||'Неактивна'));
        if(campaign.statusFromBinding)group.append(node('small','pj-cell-note','Статус при привязке'));
        assignments.append(group);
      }
      if(account.capacity?.outsideInactive)assignments.append(node('div','pj-assignment','Есть неактивное назначение вне проекта'));
      if(!assignments.childElementCount)assignments.textContent=state==='free'?'Активных рассылок нет':'Нет подтверждённых данных';
      const observed=Date.parse(account.todayQuota?.limitAt);
      const limit=now>=observed&&now-observed<300000?account.todayQuota.limit:null;
      poolCell(row,'Дневной лимит',number(limit));
      const blocked=['failed','error','disabled','paused','disconnected','blocked'].includes(text(account.status).toLowerCase());
      const errors=[...(account.errors||[])];
      if(account.syncError)errors.push(account.syncError);
      if(errors.length){
        const problem=node('details','pj-account-error'),summary=node('summary','',account.syncError?'Не удалось обновить ящик':'Проблема с подключением');
        problem.append(summary);
        for(const error of errors)problem.append(node('span','pj-cell-note',typeof error==='string'?error:[error.code,error.message].filter(Boolean).join(' · ')));
        identity.append(problem);
      }else if(blocked)identity.append(node('span','pj-cell-note','Проверьте подключение'));
      rows.append(row);
    }
    const noMatches=$('pj-capacity-empty');noMatches.hidden=!accounts.length||!!rows.childElementCount;
    noMatches.textContent=noMatches.hidden?'':'В этой группе почт нет.';
  }
  function render(){
    if(!$('pj-analytics-view'))return;
    for(const name of views){
      const panel=$('pj-'+name+'-view');
      panel.hidden=(!ready&&!preview)||view!==name;
    }
    if(view==='analytics')renderAnalytics();else if(view==='infrastructure')renderInfrastructure();
  }
  function scrub(){
    if(!$('pj-analytics-view'))return;
    $('pj-binding-settings').open=false;
    catalogOptionsKey=null;campaignRowsKey=null;capacityRowsKey=null;capacitySource=null;capacityFilter=null;
    for(const id of ['pj-recipient-sync-setup','br-recipient-sync-setup'])renderRecipientSyncSetup(id,[]);
    for(const id of ['pj-campaign-rows','pj-account-rows','pj-analytics-totals','pj-infrastructure-totals'])$(id).replaceChildren();
    $('pj-capacity-filter').value='';$('pj-capacity-empty').textContent='';
    resetCampaignSearch();$('pj-campaign-shown').textContent='';$('pj-campaign-more').hidden=true;
    $('pj-segment').replaceChildren(new Option('Выберите сегмент',''));
    for(const id of ['pj-analytics-health','pj-selection-health','pj-infrastructure-health','pj-analytics-updated','pj-infrastructure-updated','pj-analytics-connection','pj-infrastructure-connection','pj-selection-count','pj-analytics-note'])$(id).textContent='';
    $('pj-infrastructure-continue').hidden=true;
  }
  function hasPending(){return !!recipientImport?.running||!!mailboxPicker?.operation?.running||[...contexts.values()].some(context=>context.operation?.running);}
  function isEditing(){const context=currentContext();return view==='infrastructure'?!!mailboxPicker&&(mailboxPicker.open||!!mailboxPicker.operation):view==='analytics'&&!!context&&(context.picker||dirty(context)||!!context.operation||!!recipientImport?.open);}
  function isLoading(){return view==='analytics'?catalogLoading||!!currentContext()?.loading||!!currentContext()?.metricsLoading||hasPending():view==='infrastructure'?infraLoading||!!mailboxPicker?.pending:false;}
  if($('pj-segment')){
    $('pj-plan-period').addEventListener('change',()=>{
      sendingFilters.period=$('pj-plan-period').value;renderSendingReport();loadSendingPeriod();
    });
    $('pj-history-date').addEventListener('change',()=>{
      if(!$('pj-history-date').validity.valid){$('pj-history-date').reportValidity();return;}
      changeHistoryWeek();renderSendingReport();
    });
    $('pj-plan-group').addEventListener('change',()=>{sendingFilters.group=$('pj-plan-group').value;renderSendingReport();});
    $('pj-plan-segment').addEventListener('change',()=>{sendingFilters.segment=$('pj-plan-segment').value;sendingFilters.campaign='';renderSendingReport();});
    $('pj-plan-campaign').addEventListener('change',()=>{sendingFilters.campaign=$('pj-plan-campaign').value;renderSendingReport();});
    $('pj-plan-all').addEventListener('change',()=>{
      sendingFilters.accounts=$('pj-plan-all').checked?null:new Set();renderSendingReport();
    });
    $('pj-plan-senders').addEventListener('change',event=>{
      if(!event.target.matches('input[type="checkbox"]'))return;
      sendingFilters.accounts=new Set([...$('pj-plan-senders').querySelectorAll('input:checked')].map(b=>b.value));renderSendingReport();
    });
    $('pj-plan-detail').addEventListener('toggle',renderSendingReport);$('pj-plan-day').addEventListener('change',renderSendingReport);
    $('pj-plan-refresh').addEventListener('click',()=>loadSendingPeriod(true));
    for(const button of document.querySelectorAll('[data-enable-recipient-sync]'))button.addEventListener('click',enableRecipientSync);
    document.addEventListener('visibilitychange',()=>{
      queueSenderUpdate(!document.hidden);
      if(document.hidden){stopSendingTimers();}
      else{
        loadSendingPeriod();
        if(projectCompletionVisible()||completionCells().length)queueCompletions();
      }
    });
    $('pj-selection-open').addEventListener('click',()=>{const context=currentContext();if(!context?.data?.configured||context.operation)return;context.picker=true;render();notify();$('pj-campaign-search').focus();});
    $('pj-campaign-lookup').addEventListener('submit',event=>{event.preventDefault();findCampaigns();});
    $('pj-campaign-extend').addEventListener('click',()=>findCampaigns(true));
    $('pj-campaign-back').addEventListener('click',closeCampaignSearch);
    $('pj-campaign-search').addEventListener('input',renderAnalytics);
    $('pj-campaign-more').addEventListener('click',()=>{campaignLimit=Math.max(campaignLimit,$('pj-campaign-rows').rows.length)+campaignPageSize;renderAnalytics();});
    $('pj-segment').addEventListener('change',()=>{resetCampaignSearch();segmentId=$('pj-segment').value;render();notify();const context=currentContext();if(segmentId&&(!context?.data||context.error||context.metricsError||Date.now()-(context.loadedAt||0)>=30000))loadSegment(segmentId);});
    $('pj-recipient-target').addEventListener('change',renderRecipient);
    $('pj-recipient-confirm').addEventListener('click',syncRecipients);
    $('pj-recipient-close').addEventListener('click',closeRecipientImport);
    $('pj-recipient-dialog').addEventListener('cancel',event=>{event.preventDefault();closeRecipientImport();});
    $('pj-selection-save').addEventListener('click',()=>saveSelection());$('pj-selection-retry').addEventListener('click',()=>saveSelection(true));
    for(const id of ['pj-analytics-connect','pj-infrastructure-connect'])$(id).addEventListener('click',()=>{if(ready)config?.openConnection?.();});
    $('pj-analytics-refresh').addEventListener('click',()=>refresh({manual:true}));
    $('pj-infrastructure-refresh').addEventListener('click',()=>refresh({manual:true}));
    $('pj-capacity-filter').addEventListener('change',renderInfrastructure);
    $('pj-infrastructure-continue').addEventListener('click',()=>syncInfrastructure(true));
    $('pj-infrastructure-select').addEventListener('click',()=>openMailboxPicker());
    $('pj-mailbox-cancel').addEventListener('click',()=>{closeMailboxPicker();render();});
    $('pj-mailbox-dialog').addEventListener('cancel',event=>{event.preventDefault();closeMailboxPicker();render();});
    $('pj-mailbox-search').addEventListener('input',()=>{
      const current=mailboxPicker;if(!current||current.operation||current.conflict)return;
      const query=$('pj-mailbox-search').value.trim();
      if(current.query!==query){
        if(current.data)current.error='';
        current.query=query;current.limit=100;$('pj-mailbox-rows').scrollTop=0;
      }
      renderMailboxPicker();scheduleMailboxSearch(current);
    });
    $('pj-mailbox-more').addEventListener('click',()=>{if(!mailboxPicker)return;mailboxPicker.limit+=100;renderMailboxPicker(true,true);});
    $('pj-mailbox-rows').addEventListener('scroll',event=>{
      const rows=event.currentTarget;
      if(mailboxPicker?.open&&!$('pj-mailbox-more').hidden&&rows.scrollTop+rows.clientHeight>=rows.scrollHeight-50){
        mailboxPicker.limit+=100;renderMailboxPicker(true,true);
      }
    });
    $('pj-mailbox-clear').addEventListener('click',()=>{if(!mailboxPicker||mailboxPicker.pending==='load'||mailboxPicker.operation||mailboxPicker.conflict)return;mailboxPicker.selected.clear();renderMailboxPicker();notify();});
    $('pj-mailbox-inventory').addEventListener('click',()=>refreshMailboxInventory());
    $('pj-mailbox-search').addEventListener('keydown',event=>{
      if(event.key==='ArrowDown'){const first=$('pj-mailbox-rows').querySelector('input:not(:disabled)');if(first){event.preventDefault();first.focus();}}
      if(event.key==='Enter'){event.preventDefault();if(mailboxPicker&&!mailboxResult(mailboxPicker))refreshMailboxInventory();}
    });
    $('pj-mailbox-save').addEventListener('click',()=>saveMailboxSelection());$('pj-mailbox-retry').addEventListener('click',()=>saveMailboxSelection(true));
    $('pj-mailbox-reload').addEventListener('click',()=>loadMailboxSelection());
  }
  window.RegistryProject={configure,show,refresh,lock,invalidate,confirmConnection,hasPending,isLoading,isEditing,campaignCompletion,campaignSenderDetails,recipientSyncText,renderRecipientSyncSetup};
})();
</script>
