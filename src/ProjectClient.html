<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id), views=new Set(['analytics','infrastructure']);
  let config=null, view=null, ready=false, accessEpoch=null, generation=0;
  let catalog=null,catalogLoading=false,catalogError='',catalogSequence=0,catalogLoadedAt=0,segmentId='';
  let lastCampaignCatalog=null,hintRevision=0,dashboardHintsAfter=0;
  let infrastructure=null,infraLoading=false,infraError='',infraNotice='',infraSequence=0,infraLoadedAt=0,initialSyncAttempted=false;
  let mailboxPicker=null,infraSyncMode='';
  let recipientImport=null;
  let forecastData=null,forecastError='',forecastDays=1,forecastBusy=false,forecastSequence=0;
  let forecastTimer=null,forecastCheckedAt=0,forecastRetryAt=0;
  let forecastArchive=null,forecastPreviewAttempt=0,forecastPreviewVersion=0;
  const recipientRequests=new Map();
  const campaignPageSize=40;
  const liveInterval=60000;
  let infraLastLiveAttempt=0;
  let campaignLimit=campaignPageSize;
  function resetCampaignSearch(){campaignLimit=campaignPageSize;$('pj-campaign-search').value='';}
  const contexts=new Map();
  const text=value=>value===undefined||value===null?'':String(value);
  const number=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0?new Intl.NumberFormat('ru-RU').format(value):'—';
  const failure=error=>{const message=text(error?.message||error||'Не удалось получить данные.');const match=message.match(/\[([A-Z_]+)\]\s*([\s\S]*)/);return {code:match?.[1]||'ERROR',message:match?.[2]||message};};
  const uuid=()=>globalThis.crypto?.randomUUID?.()||'project-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  const timestamp=value=>{if(!value)return '';const date=new Date(value);return Number.isFinite(date.getTime())?date.toLocaleString('ru-RU',{timeZone:'Europe/Moscow'}):'';};
  function currentContext(){return contexts.get(segmentId)||null;}
  function token(){return {generation,epoch:accessEpoch};}
  function alive(mark){return ready&&mark.generation===generation&&mark.epoch===accessEpoch;}
  function notify(){try{config?.onStateChange?.();}catch(ignored){}}
  function mutation(details){
    if(details?.kind==='binding'||details?.kind==='monitoring')resetForecast(false);
    try{config?.onMutation?.(details);}catch(ignored){}
  }
  function health(id,message,error=false){const node=$(id);if(!node)return;node.textContent=message||'';node.dataset.error=String(error);}
  function node(tag,className,value){const element=document.createElement(tag);if(className)element.className=className;if(value!==undefined)element.textContent=text(value);return element;}
  function renderConnection(section,configured,connected){
    const button=$('pj-'+section+'-connect'),box=$('pj-'+section+'-connection');
    button.textContent=configured===false?'Подключить Coldy':'Настройки Coldy';button.disabled=hasPending();
    const message=configured===false?'Подключите API Coldy, чтобы получать рассылки и показатели проекта.':
      configured===true&&connected===false?'Ключ Coldy сохранён. Проверьте подключение в настройках.':'';
    box.textContent=message;box.hidden=!message;
  }
  function confirmConnection(connected){
    if(!ready||typeof connected!=='boolean')return;
    let changed=false;
    for(const data of [catalog?.coldy,infrastructure,...Array.from(contexts.values(),context=>context.data)])
      if(data?.configured===true&&data.connected!==connected){data.connected=connected;changed=true;}
    if(changed)render();
  }
  function metrics(id,values){const root=$(id);root.replaceChildren();for(const [label,value] of values){const group=node('div');group.append(node('dt','',label),node('dd','',number(value)));root.append(group);}}
  function badge(value){
    const labels={Active:['Активна','success'],Draft:['Черновик','neutral'],Completed:['Завершена','neutral'],Paused:['На паузе','warning'],
      active:['Подключена','success'],connected:['Подключена','success'],ready:['Готова','success'],enabled:['Подключена','success'],
      disabled:['Отключена','neutral'],paused:['На паузе','warning'],error:['Ошибка','error'],failed:['Ошибка','error']};
    const result=labels[value]||labels[text(value).toLowerCase()]||[value||'Неизвестно','neutral'],element=node('span','pj-badge',result[0]);element.dataset.tone=result[1];return element;
  }
  function selected(context){return context.draft||new Set((context.data?.campaigns||[]).filter(item=>item.selected).map(item=>item.id));}
  function dirty(context){if(!context?.data)return false;const draft=selected(context),saved=new Set((context.data.campaigns||[]).filter(item=>item.selected).map(item=>item.id));return draft.size!==saved.size||[...draft].some(id=>!saved.has(id));}
  function configure(options){config=options||{};render();}
  function discardCampaignHints(){
    lastCampaignCatalog=null;hintRevision++;dashboardHintsAfter=Date.now();
    for(const context of contexts.values())context.previewNames=null;
  }
  function knownCampaignNames(id){
    const dashboard=config?.peekSegments?.();
    const dashboardNames=dashboard?.loadedAt>dashboardHintsAfter?dashboard.segments?.find(segment=>segment.id===id)?.previewNames:null;
    if(lastCampaignCatalog?.segmentId===id&&Date.now()-lastCampaignCatalog.loadedAt<30000&&(!dashboardNames?.length||lastCampaignCatalog.loadedAt>=dashboard.loadedAt)){
      const names=[];
      for(const campaign of lastCampaignCatalog.campaigns){
        if(campaign.ownerSegmentId===id&&campaign.name)names.push(campaign.name);
        if(names.length===10)break;
      }
      return names;
    }
    return dashboardNames?.slice(0,10)||[];
  }
  function clear(){
    resetForecast();
    closeMailboxPicker(true);
    closeRecipientImport();recipientImport=null;recipientRequests.clear();
    generation++;catalog=null;catalogLoading=false;catalogError='';catalogSequence++;catalogLoadedAt=0;segmentId='';contexts.clear();
    lastCampaignCatalog=null;hintRevision++;dashboardHintsAfter=0;
    infrastructure=null;infraLoadedAt=0;infraLastLiveAttempt=0;infraLoading=false;infraError='';infraNotice='';infraSequence++;initialSyncAttempted=false;infraSyncMode='';
    scrub();
  }
  function lock(){ready=false;clear();view=null;render();}
  function invalidate(options={}){
    if(options.credentialsChanged){clear();}
    else{
      resetForecast(false);
      catalogLoadedAt=0;catalogSequence++;catalogLoading=false;catalogError='';
      for(const context of contexts.values()){context.loadedAt=0;if(context.data){delete context.data.configured;delete context.data.connected;}context.sequence++;context.loading=false;context.metricsLoading=false;context.searching=false;}
      infraSequence++;infraLoadedAt=0;infraLoading=false;infraError='';
    }
    discardCampaignHints();
    render();notify();
  }
  function show(next,options={}){
    if(options.epoch!==undefined&&options.epoch!==accessEpoch){clear();accessEpoch=options.epoch;}
    ready=options.ready===true;view=views.has(next)?next:null;
    if((view!=='analytics'||!ready)&&$('pj-forecast')?.open){$('pj-forecast').open=false;pauseForecast();}
    if(view!=='infrastructure'||!ready)closeMailboxPicker();
    if(view!=='analytics'||!ready)closeRecipientImport();
    if(!ready){view=null;if(catalog||infrastructure||contexts.size)clear();}
    render();
  }
  async function invoke(method,payload,mark,canDispatch){
    if(!config?.transport||!alive(mark))throw new Error('Доступ закрыт.');
    const permitted=()=>alive(mark)&&(!canDispatch||canDispatch());
    if(!permitted())return null;
    const result=await config.transport(method,payload,permitted);
    if(!permitted())return null;
    return result;
  }
  async function loadCatalog(){
    if(!ready||catalogLoading)return;
    const mark=token(),sequence=++catalogSequence;
    if(!catalog&&view==='analytics'){
      const cached=config?.peekSegments?.();
      if(cached?.state==='ready'&&Array.isArray(cached.segments))catalog={state:'ready',source:cached.source,segments:cached.segments};
    }
    catalogLoading=true;catalogError='';render();notify();
    try{const data=await invoke('getProjectAnalytics',{},mark);if(!alive(mark)||sequence!==catalogSequence||!data)return;catalog=data;catalogLoadedAt=Date.now();
      if(segmentId&&!data.segments?.some(item=>item.id===segmentId)){segmentId='';resetCampaignSearch();}
    }catch(error){if(alive(mark)&&sequence===catalogSequence){catalogError=failure(error).message;discardCampaignHints();}}
    finally{if(alive(mark)&&sequence===catalogSequence){catalogLoading=false;render();notify();}}
  }
  function segmentReadFailed(context,error,metricsOnly){
    const parsed=failure(error);
    context[metricsOnly?'metricsError':'error']=parsed.message;context.previewNames=null;
    if(/^(LINK_|OUTSIDE_|COLDY_(AUTH|FORBIDDEN|CREDENTIAL_CHANGED|SCOPE_CHANGED|BINDING_CHANGED|BINDING_MISSING)$|SOURCE_CHANGED$|SEGMENT_NOT_FOUND$)/.test(parsed.code)){
      discardCampaignHints();context.sequence++;context.loading=false;context.metricsLoading=false;
      context.data=null;context.draft=null;context.mailings=null;context.loadedAt=0;render();notify();
    }
  }
  async function loadSegment(id,options={}){
    if(!ready||!id)return;
    let context=contexts.get(id);if(!context){context={data:null,mailings:null,loading:false,error:'',message:'',draft:null,operation:null,sequence:0};contexts.set(id,context);}
    if(context.loading||context.metricsLoading||context.searching||context.operation?.running||recipientImport?.open)return;
    const mark=token(),sequence=++context.sequence,hintsAtStart=hintRevision,current=()=>alive(mark)&&context.sequence===sequence;
    context.previewNames=!context.data&&!catalogError?knownCampaignNames(id):null;
    context.loading=true;context.error='';context.metricsError='';render();notify();
    async function loadMetrics(){
      if(!current())return;
      context.metricsLoading=true;
      try{
        let service;
        if(options.manual){
          context.lastLiveAttempt=Date.now();
          service=await invoke('refreshColdyMailings',{segmentId:id},mark,current);
          if(current()&&service)mutation({kind:'metrics',segmentId:id});
        }else{
          const mailings=await invoke('getSegmentMailings',{segmentId:id},mark,current);
          service=mailings?.services?.find(item=>item.id==='coldy'||item.key==='coldy');
        }
        if(current()&&context.data?.configured!==false)context.mailings=service||null;
      }catch(error){if(current())segmentReadFailed(context,error,true);}
      finally{if(current()){context.metricsLoading=false;render();notify();}}
    }
    // Let the actionable selection take the first available transport slot.
    const campaignsRead=invoke('getProjectAnalyticsCampaigns',{segmentId:id,...(options.manual?{refresh:true}:{})},mark,current);
    const metricsRead=!options.manual&&catalog?.coldy?.configured!==false?loadMetrics():null;
    try{
      const data=await campaignsRead;
      if(!current()||!data)return;
      applyCampaignData(context,data);
      context.previewNames=null;
      if(hintsAtStart===hintRevision)lastCampaignCatalog=data.configured&&Array.isArray(data.campaigns)?{segmentId:id,campaigns:data.campaigns,loadedAt:context.loadedAt}:null;
      context.loading=false;render();notify();
      if(!data.configured)context.mailings=null;
      else if(!metricsRead)await loadMetrics();
    }catch(error){if(current())segmentReadFailed(context,error,false);}
    finally{if(current()){context.loading=false;render();notify();}}
    if(metricsRead)await metricsRead;
    if(!options.manual&&view==='analytics'&&id===segmentId&&current())await pollSelected();
  }
  function pollVisible(){return ready&&!document.hidden&&!isEditing()&&!hasPending()&&config?.canPoll?.()!==false;}
  function recentPoll(at){const age=Date.now()-at;return at>0&&age>=0&&age<liveInterval;}
  function forecastVisible(){return view==='analytics'&&$('pj-forecast')?.open&&pollVisible();}
  function pauseForecast(){
    if(forecastTimer!==null)clearTimeout(forecastTimer);
    forecastTimer=null;forecastBusy=false;forecastSequence++;
  }
  function resetForecast(close=true){
    pauseForecast();forecastData=null;forecastError='';forecastCheckedAt=0;forecastRetryAt=0;
    forecastArchive=null;forecastPreviewAttempt=0;forecastPreviewVersion++;
    if(close){forecastDays=1;if($('pj-forecast'))$('pj-forecast').open=false;}
    renderForecast();
  }
  function currentForecastDay(){return new Date(Date.now()+10800000).toISOString().slice(0,10);}
  async function preloadForecast(){
    if(view!=='analytics'||!ready||document.hidden||forecastArchive?.day===currentForecastDay()||recentPoll(forecastPreviewAttempt))return;
    const mark=token(),version=forecastPreviewVersion;
    const valid=()=>alive(mark)&&version===forecastPreviewVersion&&view==='analytics'&&!document.hidden;
    forecastPreviewAttempt=Date.now();
    try{
      const data=await invoke('getProjectForecastPreview',{},mark,valid);
      if(valid()&&data?.forecast&&data.generatedAt&&data.day===currentForecastDay()&&
        (!forecastData||forecastData.previewScope===data.previewScope)&&
        !(Date.parse(forecastArchive?.generatedAt)>=Date.parse(data.generatedAt))){
        forecastArchive=data;renderForecast();
      }
    }catch(ignored){/* The live calculation reports any error when the forecast is opened. */}
  }
  function scheduleForecast(delay){
    if(forecastTimer!==null)clearTimeout(forecastTimer);
    forecastTimer=setTimeout(()=>{forecastTimer=null;void readForecast(true);},delay);
  }
  async function readForecast(explicit=false){
    if(!forecastVisible()||forecastBusy)return;
    if(Date.now()<forecastRetryAt){
      if(forecastData?.pending&&forecastTimer===null)scheduleForecast(forecastRetryAt-Date.now());
      return;
    }
    if(!explicit&&recentPoll(forecastCheckedAt))return;
    const mark=token(),sequence=++forecastSequence,previous=forecastData;
    const valid=()=>alive(mark)&&sequence===forecastSequence&&forecastVisible();
    if(forecastTimer!==null){clearTimeout(forecastTimer);forecastTimer=null;}
    forecastBusy=true;forecastError='';forecastCheckedAt=Date.now();renderForecast();
    try{
      const data=await invoke('getProjectSendingForecast',{},mark,valid);
      if(!data||!valid())return;
      if(!data.previewScope||data.previewScope!==forecastArchive?.previewScope)forecastArchive=null;
      if(data.forecast&&data.generatedAt&&data.day&&data.previewScope)
        forecastArchive={forecast:data.forecast,generatedAt:data.generatedAt,day:data.day,previewScope:data.previewScope};
      forecastData=data;forecastRetryAt=Date.now()+Math.max(0,Number(data.retryAfterMs)||0);
      if(data.pending&&data.state!=='error'&&data.state!=='not_configured'&&data.state!=='no_selection'){
        const unchanged=previous?.pending&&JSON.stringify(previous.progress||{})===JSON.stringify(data.progress||{});
        scheduleForecast(Math.max(unchanged?6000:1500,forecastRetryAt-Date.now()));
      }
    }catch(error){
      if(!valid())return;
      const problem=failure(error);
      if(/^(LINK_|OUTSIDE_|COLDY_(AUTH|FORBIDDEN|CREDENTIAL_CHANGED|MONITORING_CHANGED|SCOPE_CHANGED)|SOURCE_CHANGED)/.test(problem.code)){
        forecastData=null;forecastArchive=null;forecastPreviewVersion++;
      }
      forecastError=problem.message;
    }finally{if(alive(mark)&&sequence===forecastSequence){forecastBusy=false;renderForecast();}}
  }
  const forecastReasons={
    previous_horizon:'Последний день нового периода выходит за даты прежнего расчёта. Он появится после обновления.',
    stale_membership:'Данные о назначениях ящиков требуют обновления.',
    missing_accounts:'Coldy подтвердил сведения только для части выбранных ящиков.',
    unknown_status:'Состояние части ящиков неизвестно.',
    missing_limit:'Для части ящиков неизвестен дневной лимит.',
    missing_schedule:'Неизвестно расписание части рассылок.',
    outside_campaigns:'Часть ящиков используется также в рассылках за пределами выбранного набора.',
    incomplete_demand:'Данные об очереди отправки получены частично.',
    unknown_sender:'Не удалось определить ящик отправителя для части очереди.',
    unknown_lead:'Неизвестно, продолжит ли часть получателей цепочку.',
    unknown_sequence:'Для части получателей неизвестен следующий шаг или срок отправки.',
    missing_gap:'Для части отправителей неизвестен интервал между письмами.',
    unknown_today:'Неизвестен доступный остаток отправок до полуночи.',
    model_limit:'Объём очереди превысил предел расчёта.'
  };
  function forecastDate(value){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return '—';
    const parts=value.split('-');return parts[2]+'.'+parts[1]+'.'+parts[0];
  }
  function renderForecast(){
    if(!$('pj-forecast'))return;
    const today=currentForecastDay(),response=forecastData?.day&&forecastData.day!==today?null:forecastData;
    const archive=forecastArchive?.day===today?forecastArchive:null;
    const historical=!!archive&&!response?.generatedAt;
    const report=historical?archive.forecast:response?.forecast,generatedAt=historical?archive.generatedAt:response?.generatedAt;
    const period=report?.periods?.find(item=>item.days===forecastDays);
    const body=$('pj-forecast-report'),rows=$('pj-forecast-rows'),reasons=$('pj-forecast-reasons'),queue=$('pj-forecast-queue');
    body.hidden=!period;rows.replaceChildren();reasons.replaceChildren();reasons.hidden=true;queue.textContent='';queue.hidden=true;
    $('pj-forecast-refresh').disabled=forecastBusy||Date.now()<forecastRetryAt;
    for(const button of $('pj-forecast').querySelectorAll('[data-forecast-days]'))button.setAttribute('aria-pressed',String(Number(button.dataset.forecastDays)===forecastDays));
    const progress=response?.progress;
    let message=forecastError||response?.message||'';
    if(!forecastError&&response?.retryAfterMs>0&&Date.now()<forecastRetryAt)message=message||'Coldy попросил подождать. Расчёт продолжится после паузы.';
    if(!forecastError&&progress&&(response.pending||response.retryAfterMs>0)){
      const counts='Рассылок обработано '+number(progress.campaignsDone)+' из '+number(progress.campaignsTotal)+', контактов проверено '+number(progress.contactsRead)+'.';
      message=(message||'Идёт расчёт.')+' '+counts;
    }
    else if(!message&&(forecastBusy||response?.pending))message='Получаем данные для прогноза…';
    else if(!message&&response)message=({no_selection:'Для расчёта выберите почты мониторинга и привяжите рассылки проекта.',not_configured:'Для расчёта подключите Coldy.',error:'Не удалось получить прогноз. Повторите расчёт.'})[response.state]||'';
    if(historical)message=[forecastBusy||response?.pending?'Показан последний расчёт. Обновляем прогноз в фоне.':'Показан последний расчёт.',message==='Получаем данные для прогноза…'?'':message].filter(Boolean).join(' ');
    else if(period&&forecastBusy&&!forecastError&&!response?.message)message='Обновляем прогноз в фоне.';
    health('pj-forecast-health',message,!!forecastError||response?.state==='error');
    if(!period){$('pj-forecast-totals').replaceChildren();$('pj-forecast-context').textContent='';return;}
    const range=period.from===period.to?forecastDate(period.from):forecastDate(period.from)+' – '+forecastDate(period.to);
    const context=[range+' · МСК','выбранных ящиков '+number(report.selectedAccounts),'активных рассылок '+number(report.activeCampaigns)];
    if(generatedAt)context.push('расчёт на '+timestamp(generatedAt)+' МСК');
    $('pj-forecast-context').textContent=context.join(' · ');
    const totals=[['Ожидается писем',period.expected],['Первые письма',period.initial],['Повторные письма',period.followups],['Предел по лимитам',period.capacity]];
    const hasScenario=item=>item.expected===null&&Number.isFinite(item.modeled);
    if(hasScenario(period))totals.push(['По разобранной части (сценарий)',period.modeled]);
    metrics('pj-forecast-totals',totals);
    if(report.queue&&(generatedAt||response?.progress?.contactsRead>0)){
      const q=report.queue,parts=['первого письма ждут '+number(q.pendingInitial),'повторного — '+number(q.pendingFollowups)];
      if(q.unresolved>0)parts.push('неизвестен отправитель или следующий шаг у '+number(q.unresolved));
      if(q.unreadCampaigns>0)parts.push('ещё не полностью прочитано рассылок '+number(q.unreadCampaigns));
      queue.textContent=(generatedAt?'В очереди на момент расчёта ':'Среди уже прочитанных адресатов ')+parts.join(', ')+'.';queue.hidden=false;
    }
    $('pj-forecast-daily').hidden=forecastDays===1;
    const displayedDays=(report.days||[]).filter(day=>day.date>=period.from&&day.date<=period.to),dailyScenario=displayedDays.some(hasScenario);
    $('pj-forecast-scenario-column').hidden=!dailyScenario;
    if(forecastDays>1)for(const day of displayedDays){
      const tr=node('tr'),date=node('th','',forecastDate(day.date));date.scope='row';tr.append(date);
      for(const key of ['initial','followups','expected','capacity'])tr.append(node('td','pj-number',number(day[key])));
      if(dailyScenario)tr.append(node('td','pj-number',hasScenario(day)?number(day.modeled):'—'));
      rows.append(tr);
    }
    const notes=new Set((report.reasons||[]).filter(code=>code!=='previous_horizon'||forecastDays===7).map(code=>forecastReasons[code]||'Для части отправок не хватает подтверждённых данных.'));
    if(hasScenario(period)||dailyScenario)notes.add('Сценарий показывает, сколько писем можно отправить по известной части очереди, если остальные получатели не займут время выбранных ящиков.');
    if([period.initial,period.followups,period.expected,period.capacity].some(value=>value===null))notes.add('Прочерк означает, что для расчёта не хватает данных.');
    for(const note of notes)reasons.append(node('li','',note));reasons.hidden=!notes.size;
  }
  async function pollSelected(){
    if(!pollVisible()||isLoading())return;
    if(view==='infrastructure'){
      if(!infrastructure?.configured||!infrastructure.monitoring?.accountIds?.length||recentPoll(infraLastLiveAttempt))return;
      if(infrastructure.retryAfterMs>0&&Date.now()<infraLoadedAt+infrastructure.retryAfterMs)return;
      if(infrastructure.nextCursor&&infrastructure.poolOnly!==true)return;
      if(!infraLastLiveAttempt&&!infrastructure.nextCursor&&recentPoll(Date.parse(infrastructure.capacity?.updatedAt)))return;
      return syncInfrastructure(!!infrastructure.nextCursor,false,true);
    }
    if(view!=='analytics')return;
    const context=currentContext(),id=segmentId;
    if(!context?.data?.configured||!context.data.bindings?.length||context.error||recentPoll(context.lastLiveAttempt))return;
    if(context.retryAt>Date.now()||!context.lastLiveAttempt&&recentPoll(Date.parse(context.mailings?.generatedAt)))return;
    const mark=token(),sequence=context.sequence;
    const current=()=>alive(mark)&&context.sequence===sequence;
    const visible=()=>current()&&view==='analytics'&&id===segmentId&&pollVisible();
    context.metricsLoading=true;context.metricsError='';context.lastLiveAttempt=Date.now();render();notify();
    let changed=false;
    try{
      const service=await invoke('refreshColdyMailings',{segmentId:id,monitor:true},mark,visible);
      if(!service||!visible())return;
      context.mailings=service;context.retryAt=Date.now()+(Number(service.retryAfterMs)||0);
      const ids=new Set((service.campaigns||[]).map(campaign=>campaign.id));
      changed=context.data.bindings.length!==ids.size||context.data.bindings.some(binding=>!ids.has(binding.campaignId));
      if(changed){context.data=null;context.loadedAt=0;}
    }catch(error){if(current())segmentReadFailed(context,error,true);}
    finally{if(current()){context.metricsLoading=false;render();notify();}}
    if(changed&&visible())await loadSegment(id);
  }
  async function refresh(options={}){
    if(!ready||!view)return;
    if(options.automatic)return Promise.all([pollProjectView(),readForecast()]);
    if(view==='analytics'&&(recipientImport?.open||recipientImport?.running))return;

    const parts=[];

    for(const account of accounts){
      const row=node('tr');row.dataset.account=text(account.id);const identity=node('td');identity.append(node('span','pj-name',account.email||account.name||'Ящик без адреса'));
      const detail=[account.name&&account.name!==account.email?account.name:'',account.provider||''].filter(Boolean).join(' · ');if(detail)identity.append(node('span','pj-cell-note',detail));
      if(account.tags?.length)identity.append(node('span','pj-cell-note',account.tags.join(', ')));
      if(account.updatedAt)identity.append(node('span','pj-cell-note',(account.stale?'Сохранено ранее · ':'Проверено · ')+poolDate(account.updatedAt)));
      row.append(identity);const status=node('td');status.append(badge(account.status));
      if(typeof account.warmup?.enabled==='boolean')status.append(node('span','pj-cell-note','Прогрев: '+(account.warmup.enabled?'включён':'выключен')));
      else if(account.warmup?.status)status.append(node('span','pj-cell-note','Прогрев: '+text(account.warmup.status)));
      if(typeof account.warmup?.sentToday==='number')status.append(node('span','pj-cell-note','Прогрев сегодня: '+number(account.warmup.sentToday)));
      row.append(status);
      for(const value of [account.sentTotal,account.sentToday,account.dailyLimit])row.append(node('td','',number(value)));
      const errors=node('td');if(account.errors?.length){errors.append(node('div','pj-account-error',account.errors.map(item=>typeof item==='string'?item:[item.code,item.message].filter(Boolean).join(': ')).join('\n')));}else errors.append(node('span','br-muted',account.errorCount===0?'Нет':account.errorCount!==null&&account.errorCount!==undefined?number(account.errorCount):'—'));row.append(errors);rows.append(row);
    }
  }
  function render(){
    if(!$('pj-analytics-view'))return;
    $('pj-analytics-view').hidden=!ready||view!=='analytics';$('pj-infrastructure-view').hidden=!ready||view!=='infrastructure';
    if(!ready){scrub();return;}
    if(view==='analytics')renderAnalytics();else if(view==='infrastructure')renderInfrastructure();
  }
  function scrub(){
    if(!$('pj-analytics-view'))return;
    for(const id of ['pj-campaign-rows','pj-account-rows','pj-diagnostic-rows','pj-schedule-rows','pj-analytics-totals','pj-infrastructure-totals'])$(id).replaceChildren();
    $('pj-infrastructure-diagnostics').open=false;$('pj-capacity-filter').value='';$('pj-capacity-empty').textContent='';
    resetCampaignSearch();$('pj-campaign-shown').textContent='';$('pj-campaign-more').hidden=true;
    $('pj-segment').replaceChildren(new Option('Выберите сегмент',''));
    for(const id of ['pj-analytics-health','pj-selection-health','pj-infrastructure-health','pj-analytics-updated','pj-infrastructure-updated','pj-diagnostics-health','pj-analytics-connection','pj-infrastructure-connection','pj-selection-count','pj-analytics-note','pj-infrastructure-note'])$(id).textContent='';
    $('pj-infrastructure-continue').hidden=true;
  }
  function hasPending(){return !!recipientImport?.running||!!mailboxPicker?.operation?.running||[...contexts.values()].some(context=>context.operation?.running);}
  function isEditing(){const context=currentContext();return view==='infrastructure'?!!mailboxPicker&&(mailboxPicker.open||!!mailboxPicker.operation):view==='analytics'&&!!context&&(context.picker||dirty(context)||!!context.operation||!!recipientImport?.open);}
  function isLoading(){return view==='analytics'?catalogLoading||!!currentContext()?.loading||!!currentContext()?.metricsLoading||hasPending():view==='infrastructure'?infraLoading||!!mailboxPicker?.pending:false;}
  if($('pj-segment')){
    $('pj-forecast').addEventListener('toggle',()=>{
      if($('pj-forecast').open){renderForecast();void readForecast(!forecastData||forecastData.pending);}
      else pauseForecast();
    });
    $('pj-forecast-refresh').addEventListener('click',()=>readForecast(true));
    for(const button of $('pj-forecast').querySelectorAll('[data-forecast-days]'))button.addEventListener('click',()=>{
      forecastDays=Number(button.dataset.forecastDays);renderForecast();
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)pauseForecast();
      else if(forecastVisible())void readForecast(!forecastData||forecastData.pending);
    });
    $('pj-selection-open').addEventListener('click',()=>{const context=currentContext();if(!context?.data?.configured||context.operation)return;context.picker=true;render();notify();$('pj-campaign-search').focus();});
    $('pj-campaign-lookup').addEventListener('submit',event=>{event.preventDefault();findCampaigns();});
    $('pj-campaign-extend').addEventListener('click',()=>findCampaigns(true));
    $('pj-campaign-back').addEventListener('click',closeCampaignSearch);
    $('pj-campaign-search').addEventListener('input',renderAnalytics);
    $('pj-campaign-more').addEventListener('click',()=>{campaignLimit=Math.max(campaignLimit,$('pj-campaign-rows').rows.length)+campaignPageSize;renderAnalytics();});
    $('pj-segment').addEventListener('change',()=>{resetCampaignSearch();segmentId=$('pj-segment').value;render();notify();const context=currentContext();if(segmentId&&(!context?.data||context.error||context.metricsError||Date.now()-(context.loadedAt||0)>=30000))loadSegment(segmentId);});
    $('pj-recipient-target').addEventListener('change',renderRecipient);
    $('pj-recipient-confirm').addEventListener('click',syncRecipients);
    $('pj-recipient-close').addEventListener('click',closeRecipientImport);
    $('pj-recipient-dialog').addEventListener('cancel',event=>{event.preventDefault();closeRecipientImport();});
    $('pj-selection-save').addEventListener('click',()=>saveSelection());$('pj-selection-retry').addEventListener('click',()=>saveSelection(true));
    for(const id of ['pj-analytics-connect','pj-infrastructure-connect'])$(id).addEventListener('click',()=>config?.openConnection?.());
    $('pj-analytics-refresh').addEventListener('click',()=>refresh({manual:true}));
    $('pj-infrastructure-refresh').addEventListener('click',()=>syncInfrastructure());
    $('pj-diagnostics-refresh').addEventListener('click',()=>syncInfrastructure(!!infrastructure?.nextCursor&&infrastructure.poolOnly!==true,true));
    $('pj-capacity-filter').addEventListener('change',renderInfrastructure);
    $('pj-infrastructure-diagnostics').addEventListener('toggle',()=>{
      const details=$('pj-infrastructure-diagnostics');if(details.open&&ready&&view==='infrastructure')renderMailboxDiagnostics(infrastructure?.accounts||[]);
      else $('pj-diagnostic-rows').replaceChildren();
    });
    $('pj-infrastructure-continue').addEventListener('click',()=>syncInfrastructure(true));
    $('pj-infrastructure-select').addEventListener('click',()=>openMailboxPicker());
    $('pj-mailbox-cancel').addEventListener('click',()=>{closeMailboxPicker();render();});
    $('pj-mailbox-dialog').addEventListener('cancel',event=>{event.preventDefault();closeMailboxPicker();render();});
    $('pj-mailbox-search').addEventListener('input',()=>{
      const current=mailboxPicker;if(!current||current.pending==='load'||current.operation||current.conflict)return;
      const query=$('pj-mailbox-search').value.trim();
      if(current.query!==query){
        if(current.pending==='inventory'){current.sequence++;current.pending=null;}
        current.error='';current.foundQuery=null;current.query=query;current.limit=100;
      }
      renderMailboxPicker();
    });
    $('pj-mailbox-more').addEventListener('click',()=>{if(!mailboxPicker)return;mailboxPicker.limit+=100;renderMailboxPicker();});
    $('pj-mailbox-clear').addEventListener('click',()=>{if(!mailboxPicker||mailboxPicker.pending==='load'||mailboxPicker.operation||mailboxPicker.conflict)return;mailboxPicker.selected.clear();renderMailboxPicker();notify();});
    $('pj-mailbox-inventory').addEventListener('click',()=>refreshMailboxInventory());
    $('pj-mailbox-search').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();refreshMailboxInventory();}});
    $('pj-mailbox-save').addEventListener('click',()=>saveMailboxSelection());$('pj-mailbox-retry').addEventListener('click',()=>saveMailboxSelection(true));
    $('pj-mailbox-reload').addEventListener('click',()=>loadMailboxSelection());
  }
  window.RegistryProject={configure,show,refresh,lock,invalidate,confirmConnection,hasPending,isLoading,isEditing};
})();
</script>
